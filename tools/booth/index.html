<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title id="page-title">내 부스 꾸미기</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
:root{--lmp-block-bg:#fff;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:transparent;display:flex;flex-direction:column;align-items:center;max-height:100%;overflow:hidden;}

/* ── 공통 버튼 (lmp 스타일) ── */
.lmp-btn{flex-shrink:0;padding:7px 14px;background:transparent;color:#000;border:2px solid #000;border-radius:0;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;letter-spacing:-.2px;transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;}
.lmp-btn:hover,.lmp-btn:active,.lmp-btn.active{background:#000;color:var(--lmp-block-bg);}

/* ── 상단 툴바 ── */
#toolbar{width:100%;max-width:480px;background:transparent;border-bottom:2px solid #000;display:flex;align-items:center;gap:0;padding:8px 10px;z-index:100;flex-shrink:0;overflow-x:auto;}
#toolbar::-webkit-scrollbar{display:none;}
#toolbar .lmp-btn{margin-right:6px;}
.tool-sep{flex-shrink:0;width:1px;height:20px;background:#000;margin:0 4px;}

/* ── 메타 바 (사용자 필드값 + 배경 이미지 제목) ── */
#meta-bar{display:none;width:100%;max-width:480px;padding:6px 12px;font-size:11px;font-weight:700;color:rgba(0,0,0,.7);background:rgba(0,0,0,.04);border-bottom:1.5px solid rgba(0,0,0,.06);align-items:center;gap:10px;overflow-x:auto;white-space:nowrap;flex-shrink:0;}
#meta-bar.on{display:flex;}
#meta-bar::-webkit-scrollbar{display:none;}
.meta-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;letter-spacing:-.2px;}

/* ── 캔버스 영역 (실제 비율 유지용 컨테이너) ── */
#canvas-area{position:relative;flex:1;min-height:0;width:100%;max-width:480px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#canvas-wrap{position:relative;width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:1/1;overflow:hidden;background:rgba(0,0,0,.04);touch-action:none;}
#bg-canvas,#draw-canvas,#items-layer{position:absolute;top:0;left:0;width:100%;height:100%;}
#bg-canvas{z-index:1;}
#items-layer{z-index:2;pointer-events:none;}
#draw-canvas{z-index:3;}
#items-layer.interactive{pointer-events:auto;}

/* ── 데코 아이템 ── */
.deco-item{position:absolute;cursor:move;user-select:none;touch-action:none;}
.deco-item.selected{outline:2px dashed #000;}
.deco-item.selected .item-handles{display:block;}
.item-handles{display:none;position:absolute;inset:-10px;}
.handle{position:absolute;width:18px;height:18px;background:#000;border:2px solid #fff;border-radius:50%;cursor:pointer;}
.handle.tl{top:0;left:0;transform:translate(-50%,-50%);}
.handle.tr{top:0;right:0;transform:translate(50%,-50%);}
.handle.bl{bottom:0;left:0;transform:translate(-50%,50%);}
.handle.br{bottom:0;right:0;transform:translate(50%,50%);cursor:se-resize;}
.handle.rot{top:-28px;left:50%;transform:translateX(-50%);cursor:grab;background:#fff;border:2px solid #000;}
.item-del{position:absolute;top:-10px;right:-10px;width:22px;height:22px;background:#000;border:2px solid #fff;border-radius:50%;color:#fff;font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;z-index:10;}
.deco-item.selected .item-del{display:flex;}
.deco-item canvas,.deco-item img{display:block;width:100%;height:100%;}

/* 프레임 클립 */
.frame-circle{border-radius:50%;overflow:hidden;}
.frame-square{border-radius:0;overflow:hidden;}
.frame-round{border-radius:16px;overflow:hidden;}
.frame-triangle .frame-inner{clip-path:polygon(50% 0%,100% 100%,0% 100%);overflow:hidden;width:100%;height:100%;}
.frame-heart .frame-inner{clip-path:url(#clip-heart);overflow:hidden;width:100%;height:100%;}
.frame-star .frame-inner{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);overflow:hidden;width:100%;height:100%;}
.frame-squirt .frame-inner{clip-path:polygon(25% 0%,75% 0%,100% 25%,100% 75%,75% 100%,25% 100%,0% 75%,0% 25%);overflow:hidden;width:100%;height:100%;}

/* ── 하단 패널 ── */
#bottom-panel{width:100%;max-width:480px;background:transparent;border-top:2px solid #000;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));min-height:145px;z-index:100;flex-shrink:0;}
#panel-default{display:flex;gap:6px;justify-content:center;align-items:center;}
#panel-image{display:none;flex-direction:column;gap:10px;}
#panel-draw{display:none;flex-direction:column;gap:10px;}

.panel-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.panel-label{font-size:11px;font-weight:700;color:#000;white-space:nowrap;letter-spacing:-.2px;}

/* 프레임 버튼 */
.frame-btn{width:34px;height:34px;border:2px solid #000;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:#000;transition:background .15s,color .15s;}
.frame-btn.active,.frame-btn:hover{background:#000;color:var(--lmp-block-bg);}

/* 슬라이더 — 검정 트랙 + 검정 원형 thumb */
input[type=range]{-webkit-appearance:none;appearance:none;height:2px;background:#000;border:none;outline:none;cursor:pointer;flex:1;min-width:80px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#000;border:none;cursor:pointer;}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#000;border:none;cursor:pointer;}

/* 색상 피커 */
.color-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.color-swatch{width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.2);cursor:pointer;flex-shrink:0;transition:transform .1s,border-color .1s;}
.color-swatch.active{border-color:#000;transform:scale(1.25);}
#draw-color-input{width:28px;height:28px;border:2px solid #000;border-radius:50%;cursor:pointer;background:none;padding:0;flex-shrink:0;}

/* ── 배경 선택 모달 ── */
#bg-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center;}
#bg-modal.on{display:flex;}
#bg-modal-inner{background:#fff;border-top:2px solid #000;padding:0;width:100%;max-width:480px;max-height:72vh;display:flex;flex-direction:column;overflow:hidden;}
.bg-modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;flex-shrink:0;}
.bg-modal-header span{font-size:14px;font-weight:700;color:#000;}
.bg-modal-header button{background:none;border:none;font-size:20px;cursor:pointer;color:#000;line-height:1;padding:2px;}
#bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.bg-thumb{position:relative;overflow:hidden;cursor:pointer;border:2px solid transparent;background:#f0f0f0;aspect-ratio:4/5;}
.bg-thumb:hover,.bg-thumb.active{border-color:#000;}
.bg-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.bg-thumb.broken{opacity:.35;}
.bg-thumb .bg-label{position:absolute;bottom:0;left:0;right:0;font-size:10px;font-weight:700;color:#fff;text-align:center;padding:3px 4px;background:rgba(0,0,0,.55);z-index:1;}

/* 배경 모달 탭 */
.bg-tabs{display:flex;border-bottom:2px solid #000;margin:10px 16px 0;flex-shrink:0;}
.bg-tab{flex:1;padding:8px 0;background:transparent;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.2px;color:rgba(0,0,0,.4);border-bottom:2px solid transparent;margin-bottom:-2px;}
.bg-tab.active{color:#000;border-bottom-color:#000;}
.bg-tab-content{flex:1;overflow-y:auto;padding:12px 16px 16px;min-height:0;}
.bg-tab-panel{display:none;}
.bg-tab-panel.active{display:block;}
#bg-upload-zone{border:2px dashed rgba(0,0,0,.3);padding:30px 16px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;color:rgba(0,0,0,.4);}
#bg-upload-zone:hover{border-color:#000;color:#000;}
#bg-upload-input{display:none;}
#export-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px;}
#export-modal.on{display:flex;}
#export-canvas{max-width:360px;max-height:60vh;}
.export-btns{display:flex;gap:0;}
.exp-btn{padding:12px 20px;border:2px solid #fff;background:transparent;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.2px;transition:background .15s,color .15s;margin-right:-2px;}
.exp-btn:hover,.exp-btn:active{background:#fff;color:#000;}
.exp-btn.primary{background:#fff;color:#000;}
.exp-btn.primary:hover{background:transparent;color:#fff;}

/* ── 로딩 ── */
#loading{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999;}
#loading .lmp-spinner{width:36px;height:36px;border:3px solid rgba(0,0,0,.12);border-top-color:#000;border-radius:50%;animation:lmp-spin .8s linear infinite;}
@keyframes lmp-spin{to{transform:rotate(360deg);}}
#loading p{color:#000;font-size:13px;font-weight:700;letter-spacing:-.2px;}

/* ── 배경 없을 때 안내 ── */
#no-bg-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:rgba(0,0,0,.3);font-size:13px;font-weight:700;z-index:0;pointer-events:none;}

/* ── 자동 배경 선택 UI ── */
#auto-bg-select{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:250;align-items:flex-end;justify-content:center;}
#auto-bg-select.on{display:flex;}
#auto-bg-inner{background:#fff;border-top:2px solid #000;padding:0;width:100%;max-width:480px;height:88vh;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
.auto-bg-header{display:flex;align-items:center;justify-content:center;padding:14px 16px 10px;flex-shrink:0;border-bottom:1.5px solid rgba(0,0,0,.06);}
.auto-bg-header span{font-size:14px;font-weight:700;color:#000;}
#auto-bg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 16px 24px;overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch;}
.auto-bg-thumb{position:relative;overflow:hidden;cursor:pointer;border:2px solid rgba(0,0,0,.12);background:#f0f0f0;transition:border-color .15s;aspect-ratio:4/5;}
.auto-bg-thumb:hover{border-color:rgba(0,0,0,.45);}
.auto-bg-thumb.active{border-color:#000;border-width:3px;}
.auto-bg-thumb.active::after{content:'✓';position:absolute;top:6px;right:6px;width:24px;height:24px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:1;}
.auto-bg-thumb .bg-label{position:absolute;bottom:0;left:0;right:0;font-size:11px;font-weight:700;color:#fff;text-align:center;padding:5px 6px;background:rgba(0,0,0,.6);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#auto-bg-actions{padding:10px 16px 14px;padding-bottom:max(14px,calc(env(safe-area-inset-bottom,0px) + 10px));border-top:1.5px solid rgba(0,0,0,.08);flex-shrink:0;background:#fff;}
#auto-bg-confirm-btn{width:100%;padding:13px 14px;background:#000;color:#fff;border:2px solid #000;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.2px;transition:opacity .15s;}
#auto-bg-confirm-btn:disabled{opacity:.35;cursor:not-allowed;}
/* ── 도형 선택 모달 ── */
#shape-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center;}
#shape-modal.on{display:flex;}
#shape-modal-inner{background:#fff;border-top:2px solid #000;padding:0;width:100%;max-width:480px;max-height:60vh;display:flex;flex-direction:column;overflow:hidden;}
#shape-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:8px;overflow-y:auto;}
.shape-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;border:none;background:transparent;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;border-radius:4px;}
.shape-btn:hover,.shape-btn:active{background:rgba(0,0,0,.07);}
.shape-btn svg{width:44px;height:44px;}
.shape-btn span{font-size:10px;font-weight:700;color:#000;letter-spacing:-.2px;}
/* ── 도형 패널 ── */
#panel-shape{flex-direction:column;gap:10px;display:none;}
.shape-color-btn{width:26px;height:26px;border:2px solid rgba(0,0,0,.25);cursor:pointer;padding:0;flex-shrink:0;}
.shape-none-btn{padding:4px 10px;border:2px solid rgba(0,0,0,.3);background:transparent;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:#000;}
.shape-none-btn.active{background:#000;color:#fff;border-color:#000;}
/* ── 설명 오버레이 (배경 선택 후 펼쳐진 채로 시작, 접기 가능) ── */
#desc-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:70;align-items:center;justify-content:center;padding:20px;}
#desc-overlay.on{display:flex;}
#desc-card{background:#fff;border:2px solid #000;padding:18px 18px 14px;width:100%;max-width:340px;max-height:90%;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);}
#desc-card-header{font-size:12px;font-weight:700;color:rgba(0,0,0,.55);letter-spacing:.4px;text-transform:uppercase;}
#desc-card-content{font-size:13px;line-height:1.65;color:#000;white-space:pre-wrap;word-break:break-word;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;}
#desc-card-collapse{align-self:stretch;padding:10px 12px;background:#000;color:#fff;border:2px solid #000;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.2px;flex-shrink:0;}
#desc-card-collapse:hover{background:transparent;color:#000;}
#desc-icon{display:none;position:absolute;top:10px;right:10px;width:30px;height:30px;border:2px solid #000;background:#fff;color:#000;border-radius:50%;font-size:14px;cursor:pointer;z-index:60;align-items:center;justify-content:center;font-family:inherit;line-height:1;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.15);}
#desc-icon.on{display:flex;}
#desc-icon:hover{background:#000;color:#fff;}
.auto-bg-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.auto-bg-thumb .bg-label{z-index:1;}
</style>
</head>
<body>

<!-- 프레임 클립패스 정의 (objectBoundingBox = 요소 크기에 비례 스케일) -->
<svg style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true">
  <defs>
    <clipPath id="clip-heart" clipPathUnits="objectBoundingBox">
      <path d="M0.5,0.85 C0.5,0.85 0.05,0.55 0.05,0.28 C0.05,0.14 0.14,0.05 0.28,0.05 C0.36,0.05 0.44,0.10 0.5,0.18 C0.56,0.10 0.64,0.05 0.72,0.05 C0.86,0.05 0.95,0.14 0.95,0.28 C0.95,0.55 0.5,0.85 0.5,0.85 Z"/>
    </clipPath>
  </defs>
</svg>

<div id="loading">
  <div class="lmp-spinner"></div>
  <p>꾸미기 도구를 준비하고 있어요…</p>
</div>

<!-- 도형 선택 모달 -->
<div id="shape-modal">
  <div id="shape-modal-inner">
    <div class="bg-modal-header">
      <span>도형 추가</span>
      <button onclick="closeShapeModal()">✕</button>
    </div>
    <div id="shape-grid"></div>
  </div>
</div>

<!-- 자동 배경 선택 (여러 장일 때) -->
<div id="auto-bg-select">
  <div id="auto-bg-inner">
    <div class="auto-bg-header">
      <span>배경을 선택해 주세요</span>
    </div>
    <div id="auto-bg-grid"></div>
    <div id="auto-bg-actions">
      <button id="auto-bg-confirm-btn" disabled onclick="confirmAutoBg()">선택 완료</button>
    </div>
  </div>
</div>

<!-- 기본 이미지 선택 모달 -->
<div id="preset-img-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:flex-end;justify-content:center;">
  <div style="background:#fff;width:100%;max-width:480px;max-height:70vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;overflow:hidden;">
    <div class="bg-modal-header" style="border-bottom:1.5px solid rgba(0,0,0,.08);">
      <span style="font-weight:700;">이미지 추가</span>
      <button onclick="closePresetModal()" style="border:none;background:none;font-size:18px;cursor:pointer;padding:4px;">✕</button>
    </div>
    <div style="overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;">
      <div id="preset-img-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;"></div>
      <label style="display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border:2px dashed rgba(0,0,0,.2);cursor:pointer;font-size:13px;font-weight:700;color:rgba(0,0,0,.55);border-radius:4px;">
        📁 기기에서 직접 추가
        <input type="file" accept="image/*" style="display:none;" onchange="onImageFileSelected(event);closePresetModal()">
      </label>
    </div>
  </div>
</div>

<!-- 상단 툴바 -->
<div id="toolbar">
  <button class="lmp-btn" id="btn-bg" onclick="openBgModal()">배경</button>
  <div class="tool-sep"></div>
  <button class="lmp-btn" id="btn-img" onclick="triggerImageUpload()">이미지 추가</button>
  <button class="lmp-btn" id="btn-shape" onclick="openShapeModal()">도형</button>
  <button class="lmp-btn" id="btn-draw" onclick="toggleDrawMode()">그리기</button>
  <div class="tool-sep"></div>
  <button class="lmp-btn" id="btn-export" onclick="openExport()" style="background:#000;color:var(--lmp-block-bg);">완성</button>
  <input type="file" id="img-file-input" accept="image/*" style="display:none;" onchange="onImageFileSelected(event)">
</div>

<!-- 메타 바: 사용자 필드값 + 배경 이미지 제목 -->
<div id="meta-bar"></div>

<!-- 캔버스 영역 (실제 비율 유지 컨테이너) -->
<div id="canvas-area">
  <div id="canvas-wrap">
    <div id="no-bg-msg">
      <span style="font-size:32px;">🏕</span>
      <span>배경을 선택해 주세요</span>
    </div>
    <canvas id="bg-canvas"></canvas>
    <div id="items-layer"></div>
    <canvas id="draw-canvas"></canvas>
  </div>
  <!-- 설명 오버레이 패널 -->
  <div id="desc-overlay">
    <div id="desc-card">
      <div id="desc-card-header">💬 안내</div>
      <div id="desc-card-content"></div>
      <button id="desc-card-collapse" onclick="collapseDesc()">접기</button>
    </div>
  </div>
  <!-- 접힌 상태: 다시 펴기 버튼 -->
  <button id="desc-icon" onclick="expandDesc()" title="안내 다시 보기" aria-label="안내 다시 보기">💬</button>
</div>

<!-- 하단 패널 -->
<div id="bottom-panel">
  <!-- 기본 상태 -->
  <div id="panel-default">
    <span style="font-size:12px;font-weight:700;color:rgba(0,0,0,.3);letter-spacing:-.2px;">아이템을 탭하면 편집할 수 있어요</span>
  </div>
  <!-- 이미지/드로잉 선택 상태 -->
  <div id="panel-image">
    <div class="panel-row">
      <span class="panel-label">크기</span>
      <input type="range" id="img-size-range" min="20" max="400" value="120" oninput="onItemSizeChange(this.value)">
      <span id="img-size-cm" style="font-size:11px;font-weight:700;color:rgba(0,0,0,.45);min-width:44px;text-align:right;white-space:nowrap;"></span>
    </div>
    <div class="panel-row">
      <span class="panel-label">프레임</span>

// ── 내보내기 목표 해상도 (인스타그램 포스트 4:5 표준) ──
const EXPORT_W = 1080;
const EXPORT_H = 1350;

// ── 앱 상태 ──
let canvasW = 0, canvasH = 0;
let bgImage = null;
let backgrounds = []; // [{type, label, urls:[]}]
let fieldKey = 'name'; // config에서 로드 (빈칸이면 'name' 기본)
let currentRefPx = 0; // 출력 이미지(1080px 기준) 픽셀 수 = 10cm; 0이면 표시 안 함
let currentBgLabel = ''; // 선택된 배경 이미지 라벨 (메타 바 표시용)
let _hasDesc = false; // 현재 설명 보유 여부 (오버레이 토글 상태 관리)
let commonPresetImages = []; // 필드값 무관 공통 꾸미기 소스
let lastContextData = null; // lmp-context 원본 저장 (loadBackgrounds 이후 재처리용)
let items = [];       // 데코 아이템 목록
let selectedItem = null;
let drawMode = false;
let drawColor = '#000000';
let drawSize = 8;
let strokeHistory = [];
let keyColors = [];
let userBoothType = '';
let contextReceived = false; // 프로젝트에서 컨텍스트 수신 여부
let toolTitle = '내 부스 꾸미기'; // 설정에서 동적으로 업데이트됨
let isDrawing = false;
let lastX = 0, lastY = 0;

const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const drawCanvas = document.getElementById('draw-canvas');
const drawCtx = drawCanvas.getContext('2d');
const itemsLayer = document.getElementById('items-layer');
const canvasWrap = document.getElementById('canvas-wrap');

// ── 초기화 ──
async function init() {
  // UI 동기 설정 — Firebase 로드와 무관하게 먼저 화면 보이도록
  resizeCanvases();
  renderFreeBgGrid();
  setupDrawEvents();
  document.getElementById('draw-size-range').addEventListener('input', e => {
    drawSize = +e.target.value;
    document.getElementById('draw-size-val').textContent = drawSize;
  });
  document.getElementById('draw-color-input').addEventListener('input', e => {
    setDrawColor(e.target.value);
  });
  window.addEventListener('resize', resizeCanvases);
  // UI 준비 완료 → 로딩 스크린 즉시 제거 (Firestore 응답 안 기다림)
  document.getElementById('loading').style.display = 'none';
  // 부모 플레이어에 ready 신호 전송 (컨텍스트 수신 시작)
  window.parent.postMessage({type:'lmp-ready'}, '*');
  // 1.5초 안에 컨텍스트가 안 오면 배경 버튼 표시
  setTimeout(() => {
    if(!contextReceived) showBgBtn();
  }, 1500);
  // 배경 설정 로드는 백그라운드로 (autoSelectBg는 컨텍스트 수신과 타이밍 무관하게 재처리됨)
  loadBackgrounds();
}

function showBgBtn() {
  const btn = document.getElementById('btn-bg');
  const sep = btn.nextElementSibling;
  btn.style.display = '';
  if(sep) sep.style.display = '';
}
function hideBgBtn() {
  const btn = document.getElementById('btn-bg');
  const sep = btn.nextElementSibling;
  btn.style.display = 'none';
  if(sep) sep.style.display = 'none';
}

function resizeCanvases() {
  const wrap = canvasWrap.getBoundingClientRect();
  canvasW = Math.round(wrap.width);
  canvasH = Math.round(wrap.height);
  [bgCanvas, drawCanvas].forEach(c => { c.width = canvasW; c.height = canvasH; });
  if(bgImage) drawBg();
}

// ── 설정 ID (URL 파라미터 ?config=xxx, 기본값 'booth') ──
const CONFIG_ID = new URLSearchParams(location.search).get('config') || 'booth';

// ── 배경 로드 (Firestore) ──
async function loadBackgrounds() {
  try {
    const doc = await db.collection('game_configs').doc(CONFIG_ID).get();
    if(doc.exists) {
      const data = doc.data();
      backgrounds = data.backgrounds || [];
      commonPresetImages = data.commonPresetImages || [];
      fieldKey = data.fieldKey || 'name';
      if(data.name) {
        document.getElementById('page-title').textContent = data.name;
        toolTitle = data.name;
      }
      // lmp-context가 먼저 도착한 경우: fieldKey가 확정된 지금 다시 값 추출
      if(lastContextData) {
        const d = lastContextData;
        const bt = d.boothType || d.userFields?.[fieldKey] || d.userFields?.boothType || d.userFields?.type || '';
        if(bt) {
          userBoothType = bt;
          hideBgBtn();
          updateMetaBar();
          autoSelectBg();
        } else {
          showBgBtn();
          updateMetaBar();
        }
      } else if(userBoothType) {
        updateMetaBar();
        autoSelectBg();
      }
    }
  } catch(e) {}
}

function renderFreeBgGrid() {
  const grid = document.getElementById('bg-grid');
  if(!grid) return;
  grid.innerHTML = FREE_BG_IMAGES.map((b,i)=>`
    <div class="bg-thumb" data-idx="${i}">
      <img src="${b.thumb}" loading="lazy" onerror="this.parentElement.classList.add('broken')">
      <div class="bg-label">${b.label}</div>
    </div>`).join('');
  grid.querySelectorAll('.bg-thumb').forEach(el => {
    el.addEventListener('click', () => {
      const i = +el.dataset.idx;
      selectBgByUrl(FREE_BG_IMAGES[i].url, FREE_BG_IMAGES[i].label); // 고해상도 URL 사용
    });
  });
}

function switchBgTab(tab, btn) {
  document.querySelectorAll('.bg-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.bg-tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('bg-tab-'+tab).classList.add('active');
}

function checkUnsupportedFormat(file) {
  const n = file.name.toLowerCase(), t = (file.type || '').toLowerCase();
  if(n.endsWith('.heic') || n.endsWith('.heif') || t === 'image/heic' || t === 'image/heif') {
    alert('HEIC/HEIF 파일은 지원하지 않아요 📵\n\n아이폰에서 촬영한 사진이라면:\n• 사진 앱 → 공유 → JPG로 내보내기\n• 또는 설정 > 카메라 > 포맷 > "호환성 우선" 으로 변경 후 재촬영');
    return true;
  }
  if(n.endsWith('.tif') || n.endsWith('.tiff') || t === 'image/tiff') {
    alert('TIFF 파일은 지원하지 않아요.\nJPG, PNG, WebP 형식으로 변환 후 업로드해 주세요.');
    return true;
  }
  return false;
}

function onBgUpload(e) {
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  if(checkUnsupportedFormat(file)) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      // 인스타 4:5 출력 기준 최소 해상도 체크
      const upscale = Math.max(EXPORT_W / img.naturalWidth, EXPORT_H / img.naturalHeight);
      if(upscale > 1.2) {
        const ok = confirm(
          `이미지 해상도가 낮아요 (${img.naturalWidth}×${img.naturalHeight}px)\n\n` +
          `인스타그램 고화질 업로드 권장 최소: 1080×1350px\n` +
          `현재 이미지를 사용하면 완성 이미지가 흐릿하게 보일 수 있어요.\n\n` +
          `그래도 사용하시겠어요?`
        );
        if(!ok) { e.target.value = ''; return; }
      }
      bgImage = img; bgImage._src = ev.target.result;
      currentBgLabel = '내가 업로드한 배경';
      document.getElementById('no-bg-msg').style.display = 'none';
      canvasWrap.style.aspectRatio = `${img.naturalWidth}/${img.naturalHeight}`;
      requestAnimationFrame(() => {
        resizeCanvases();
        drawBg();
        updateMetaBar();
      });
      closeBgModal();
      showBgDesc(''); // 업로드 배경은 설명 없음
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function autoSelectBg() {
  const match = backgrounds.find(b => b.type === userBoothType);
  if(!match) return;
  const urls = match.urls || (match.url ? [match.url] : []);
  if(!urls.length) return;
  if(urls.length === 1) {
    selectBgByUrl(urls[0], match.label || '', true, match.refPx || 0);
    showBgDesc(match.description || '');
  } else {
    showAutoBgSelect(urls, match.description || '', match.urlNames || [], match.refPx || 0);
  }
}

let autoBgState = { urls: [], names: [], desc: '', refPx: 0, selectedIdx: -1 };

function showAutoBgSelect(urls, desc, names, refPx=0) {
  autoBgState = { urls: urls.slice(), names: (names||[]).slice(), desc: desc||'', refPx: refPx||0, selectedIdx: -1, _bodyScrollY: window.scrollY || 0 };
  const grid = document.getElementById('auto-bg-grid');
  grid.innerHTML = urls.map((url, i) => {
    const name = (names && names[i]) ? names[i] : '';
    return `<div class="auto-bg-thumb" onclick="selectAutoBg(${i})">
      <img src="${url}" onerror="this.parentElement.style.opacity='.3'">
      ${name ? `<div class="bg-label">${name}</div>` : ''}
    </div>`;
  }).join('');
  const btn = document.getElementById('auto-bg-confirm-btn');
  if(btn) btn.disabled = true;
  // 모달 높이: body가 컨테이너(iframe 혹은 윈도우) 높이의 100%이므로 window.innerHeight = 실제 가용 높이
  const inner = document.getElementById('auto-bg-inner');
  const safeH = Math.floor(window.innerHeight * 0.80);
  inner.style.height = safeH + 'px';
  inner.style.maxHeight = safeH + 'px';
  document.getElementById('auto-bg-select').classList.add('on');
}

function selectAutoBg(idx) {
  autoBgState.selectedIdx = idx;
  document.querySelectorAll('#auto-bg-grid .auto-bg-thumb').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  const btn = document.getElementById('auto-bg-confirm-btn');
  if(btn) btn.disabled = false;
}

function confirmAutoBg() {
  const idx = autoBgState.selectedIdx;
  if(idx < 0) return;
  const url = autoBgState.urls[idx];
  const desc = autoBgState.desc || '';
  const refPx = autoBgState.refPx;
  const name = (autoBgState.names && autoBgState.names[idx]) ? autoBgState.names[idx] : '';
  document.getElementById('auto-bg-select').classList.remove('on');
  requestAnimationFrame(() => {
    selectBgByUrl(url, name, false, refPx);
    showBgDesc(desc);
  });
}

function showBgDesc(desc) {
  const overlay = document.getElementById('desc-overlay');
  const icon = document.getElementById('desc-icon');
  const content = document.getElementById('desc-card-content');
  if(!overlay || !icon || !content) return;
  if(!desc) {
    _hasDesc = false;
    overlay.classList.remove('on');
    icon.classList.remove('on');
    content.textContent = '';
    return;
  }
  _hasDesc = true;
  content.textContent = desc;
  overlay.classList.add('on');   // 진입 시 펼쳐진 채로
  icon.classList.remove('on');   // 오버레이 떠있는 동안 아이콘 숨김
}

function collapseDesc() {
  document.getElementById('desc-overlay').classList.remove('on');
  if(_hasDesc) document.getElementById('desc-icon').classList.add('on');
}

function expandDesc() {
  if(!_hasDesc) return;
  document.getElementById('desc-overlay').classList.add('on');
  document.getElementById('desc-icon').classList.remove('on');
}

function updateMetaBar() {
  const bar = document.getElementById('meta-bar');
  if(!bar) return;
  const userVal = (userBoothType||'').trim();
  const bgVal = (currentBgLabel||'').trim();
  if(!userVal && !bgVal) { bar.innerHTML=''; bar.classList.remove('on'); return; }
  const parts = [];
  if(userVal) parts.push(userVal);
  if(bgVal) parts.push(bgVal);
  bar.textContent = parts.join(' | ');
  bar.classList.add('on');
}

function selectBg(i, silent=false) {
  const b = backgrounds[i];
  const urls = b.urls || (b.url ? [b.url] : []);
  if(urls.length === 1) {
    selectBgByUrl(urls[0], b.label||'', silent, b.refPx||0);
    showBgDesc(b.description||'');
  }
  else if(urls.length > 1) showAutoBgSelect(urls, b.description||'', b.urlNames||[], b.refPx||0);
}

function selectBgByUrl(url, label='', silent=false, refPx=0) {
  currentRefPx = refPx;
  currentBgLabel = label||'';
  showBgDesc('');
  function onSuccess(img) {
    bgImage = img; bgImage._src = url;
    document.getElementById('no-bg-msg').style.display = 'none';
    canvasWrap.style.aspectRatio = `${img.naturalWidth}/${img.naturalHeight}`;
    requestAnimationFrame(() => {
      resizeCanvases();
      drawBg();
      updateMetaBar();
    });
    if(!silent) closeBgModal();
  }
  // CORS로 먼저 시도 (canvas toDataURL 내보내기용)
  const img1 = new Image();
  img1.crossOrigin = 'anonymous';
  img1.onload = () => onSuccess(img1);
  img1.onerror = () => {
    // CORS 실패 시 캐시버스터를 붙여 비-CORS로 재시도
    // (브라우저 CORS 캐시 오염 방지)
    const img2 = new Image();
    const sep = url.includes('?') ? '&' : '?';
    img2.onload = () => onSuccess(img2);
    img2.onerror = () => {}; // URL 자체가 잘못된 경우 — 무음 처리
    img2.src = url + sep + '_t=' + Date.now();
  };
  img1.src = url;
}

function drawBg() {
  if(!bgImage) return;
  bgCtx.clearRect(0,0,canvasW,canvasH);
  // 캔버스가 이미지 비율과 동일하므로 그대로 채움 (자연 비율 유지)
  bgCtx.drawImage(bgImage, 0, 0, canvasW, canvasH);
}

function openBgModal() { document.getElementById('bg-modal').classList.add('on'); }
function closeBgModal() { document.getElementById('bg-modal').classList.remove('on'); }

// ── 이미지 추가 ──
function getCurrentPresetImages() {
  const match = backgrounds.find(b => b.type === userBoothType);
  const bgSpecific = match?.presetImages || [];
  return [...commonPresetImages, ...bgSpecific];
}

function triggerImageUpload() {
  if(drawMode) cancelDrawMode();
  const presets = getCurrentPresetImages();
  if(presets.length) {
    openPresetModal();
  } else {
    document.getElementById('img-file-input').click();
  }
}

function openPresetModal() {
  const presets = getCurrentPresetImages();
  const grid = document.getElementById('preset-img-grid');
  grid.innerHTML = presets.map((p, i) => `
    <div onclick="addPresetImage(${i})" style="cursor:pointer;position:relative;border:1.5px solid rgba(0,0,0,.12);overflow:hidden;">
      <img src="${p.url}" loading="lazy" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;" onerror="this.style.opacity='.3'">
      ${p.name ? `<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:700;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.name}</div>` : ''}
      ${p.lockSize ? `<div style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;font-size:9px;font-weight:700;padding:2px 4px;border-radius:3px;">🔒</div>` : ''}
    </div>`).join('');
  document.getElementById('preset-img-modal').style.display = 'flex';
}

function closePresetModal() {
  document.getElementById('preset-img-modal').style.display = 'none';
}

function addPresetImage(presetIdx) {
  closePresetModal();
  const presets = getCurrentPresetImages();
  const p = presets[presetIdx];
  if(!p) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const naturalRatio = (img.naturalHeight / img.naturalWidth) || 1;
    const targetW = p.lockSize ? (p.fixedSize || 120) : Math.min(canvasW * 0.4, 150);
    const targetH = targetW * naturalRatio;
    const x = canvasW/2 - targetW/2;
    const y = canvasH/2 - targetH/2;
    const item = {
      id: Date.now(), type:'image', src: p.url,
      x, y, w: targetW, h: targetH, rot:0, frame:'', naturalRatio,
      _sizeFixed: p.lockSize || false,
    };
    items.push(item);
    renderItems();
    selectItemById(item.id);
  };
  img.onerror = () => { img.crossOrigin = undefined; img.src = p.url; };
  img.src = p.url;
}

function onImageFileSelected(e) {
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  if(checkUnsupportedFormat(file)) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => addImageItem(img, ev.target.result);
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function addImageItem(imgEl, src) {
  const targetW = Math.min(canvasW * 0.4, 150);
  const naturalRatio = (imgEl.naturalHeight / imgEl.naturalWidth) || 1;
  const targetH = targetW * naturalRatio;
  const x = canvasW/2 - targetW/2;
  const y = canvasH/2 - targetH/2;
  const item = { id: Date.now(), type:'image', src, x, y, w: targetW, h: targetH, rot:0, frame:'', naturalRatio };
  items.push(item);
  renderItems();
  selectItemById(item.id);
}

const SHAPE_DEFS = [
  { key:'circle',    label:'원',      path:`<ellipse cx="50" cy="50" rx="46" ry="46"/>` },
  { key:'rect',      label:'사각형',  path:`<rect x="3" y="3" width="94" height="94"/>` },
  { key:'triangle',  label:'삼각형',  path:`<polygon points="50,3 97,97 3,97"/>` },
  { key:'diamond',   label:'마름모',  path:`<polygon points="50,3 97,50 50,97 3,50"/>` },
  { key:'heart',     label:'하트',    path:`<path d="M50,85 C50,85 5,60 5,32 C5,15 16,5 30,5 C38,5 44,10 50,18 C56,10 62,5 70,5 C84,5 95,15 95,32 C95,60 50,85 50,85 Z"/>` },
  { key:'star',      label:'별',      path:`<polygon points="50,3 59,30 87,35 67,55 73,83 50,68 27,83 33,55 13,35 41,30"/>` },
  { key:'trapezoid', label:'사다리꼴', path:`<polygon points="20,3 80,3 97,97 3,97"/>` },
  { key:'pentagon',  label:'오각형',  path:`<polygon points="50,3 94,35 77,93 23,93 6,35"/>` },
  { key:'hexagon',   label:'육각형',  path:`<polygon points="97,50 74,90 26,90 3,50 26,10 74,10"/>` },
  { key:'arrow',     label:'화살표',  path:`<polygon points="5,35 65,35 65,10 95,50 65,90 65,65 5,65"/>` },
  { key:'speech',    label:'말풍선',  path:`<path d="M10,5 Q5,5 5,10 L5,65 Q5,70 10,70 L40,70 L50,90 L60,70 L90,70 Q95,70 95,65 L95,10 Q95,5 90,5 Z"/>` },
  { key:'ring',      label:'도넛',    path:`<path fill-rule="evenodd" d="M50,3 A47,47 0 0,1 50,97 A47,47 0 0,1 50,3 Z M50,27 A23,23 0 0,0 50,73 A23,23 0 0,0 50,27 Z"/>` },
];

function getShapeSvgContent(key) {
  return SHAPE_DEFS.find(d=>d.key===key)?.path || '';
}

function shapeSvgEl(key, fillColor='#ff6b6b', strokeColor='#000', strokeWidth=3) {
  const fc = fillColor==='none' ? 'none' : fillColor;
  const sw = strokeWidth > 0 ? strokeWidth : 0;
  const sc = sw > 0 ? strokeColor : 'none';
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;" preserveAspectRatio="xMidYMid meet">
    <g fill="${fc}" stroke="${sc}" stroke-width="${sw}" stroke-linejoin="round">
      ${getShapeSvgContent(key)}
    </g>
  </svg>`;
}

function openShapeModal() {
  const grid = document.getElementById('shape-grid');
  grid.innerHTML = SHAPE_DEFS.map(d => `
    <button class="shape-btn" onclick="addShape('${d.key}');closeShapeModal()">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g fill="#ff6b6b" stroke="#000" stroke-width="4" stroke-linejoin="round">${d.path}</g>
      </svg>
      <span>${d.label}</span>
    </button>`).join('');
  document.getElementById('shape-modal').classList.add('on');
}
function closeShapeModal() { document.getElementById('shape-modal').classList.remove('on'); }

function addShape(shapeKey) {
  const size = Math.min(canvasW, canvasH) * 0.35;
  const item = {
    id: Date.now(), type:'shape', shape: shapeKey,
    x: canvasW/2 - size/2, y: canvasH/2 - size/2,
    w: size, h: size, rot: 0,
    fillColor: '#ff6b6b', strokeColor: '#000000', strokeWidth: 4,
  };
  items.push(item);
  renderItems();
  selectItemById(item.id);
}

function updateShapeProp(prop, val) {
  if(!selectedItem || selectedItem.type!=='shape') return;
  selectedItem[prop] = val;
  const el = itemsLayer.querySelector(`[data-id="${selectedItem.id}"]`);
  if(el) el.querySelector('svg')?.replaceWith(
    Object.assign(document.createElement('div'), { innerHTML: shapeSvgEl(selectedItem.shape, selectedItem.fillColor, selectedItem.strokeColor, selectedItem.strokeWidth) }).firstChild
  );
}

function toggleShapeFillNone() {
  if(!selectedItem || selectedItem.type!=='shape') return;
  const btn = document.getElementById('shape-fill-none');
  if(selectedItem.fillColor === 'none') {
    selectedItem.fillColor = document.getElementById('shape-fill-color').value || '#ff6b6b';
    btn.classList.remove('active');
  } else {
    selectedItem.fillColor = 'none';
    btn.classList.add('active');
  }
  updateShapeProp('fillColor', selectedItem.fillColor);
}

function onShapeSizeChange(val) {
  if(!selectedItem || selectedItem.type!=='shape') return;
  selectedItem.w = +val;
  selectedItem.h = +val;
  const el = itemsLayer.querySelector(`[data-id="${selectedItem.id}"]`);
  if(el) { el.style.width = val+'px'; el.style.height = val+'px'; }
  refreshSizeCm(+val, 'shape-size-cm');
}

// Canvas2D 도형 그리기 (내보내기용)
function drawShapeToCtx(ctx, shape, w, h, fillColor, strokeColor, strokeWidth) {
  const hw=w/2, hh=h/2, sw=strokeWidth;
  ctx.beginPath();
  const p = (points) => {
    const pts = points.trim().split(/\s+/).map(p=>p.split(',').map(Number));
    ctx.moveTo(pts[0][0]/100*w - hw, pts[0][1]/100*h - hh);
    pts.slice(1).forEach(([x,y]) => ctx.lineTo(x/100*w - hw, y/100*h - hh));
    ctx.closePath();
  };
  switch(shape) {
    case 'circle':   ctx.ellipse(0,0,hw-sw/2,hh-sw/2,0,0,Math.PI*2); break;
    case 'rect':     ctx.rect(-hw+sw/2,-hh+sw/2,w-sw,h-sw); break;
    case 'triangle': p('50,3 97,97 3,97'); break;
    case 'diamond':  p('50,3 97,50 50,97 3,50'); break;
    case 'heart': {
      const mx=hw, my=hh;
      ctx.moveTo(0, my*0.7);
      ctx.bezierCurveTo(-mx*0.9, my*0.2, -mx*0.9, -my*0.55, -mx*0.4, -my*0.55);
      ctx.bezierCurveTo(-mx*0.1, -my*0.55, 0, -my*0.28, 0, -my*0.28);
      ctx.bezierCurveTo(0, -my*0.28, mx*0.1, -my*0.55, mx*0.4, -my*0.55);
      ctx.bezierCurveTo(mx*0.9, -my*0.55, mx*0.9, my*0.2, 0, my*0.7);
      ctx.closePath();
    } break;
    case 'star':     p('50,3 59,30 87,35 67,55 73,83 50,68 27,83 33,55 13,35 41,30'); break;
    case 'trapezoid':p('20,3 80,3 97,97 3,97'); break;
    case 'pentagon': p('50,3 94,35 77,93 23,93 6,35'); break;
    case 'hexagon':  p('97,50 74,90 26,90 3,50 26,10 74,10'); break;
    case 'arrow':    p('5,35 65,35 65,10 95,50 65,90 65,65 5,65'); break;
    case 'speech':
      ctx.moveTo(-hw*0.8,-hh); ctx.quadraticCurveTo(-hw,-hh,-hw,-hh*0.7);
      ctx.lineTo(-hw,-hh*0.3); ctx.quadraticCurveTo(-hw,hh*0.4,-hw*0.7,hh*0.4);
      ctx.lineTo(-hw*0.1,hh*0.4); ctx.lineTo(0,hh); ctx.lineTo(hw*0.1,hh*0.4);
      ctx.lineTo(hw*0.7,hh*0.4); ctx.quadraticCurveTo(hw,hh*0.4,hw,-hh*0.3);
      ctx.lineTo(hw,-hh*0.7); ctx.quadraticCurveTo(hw,-hh,hw*0.8,-hh);
      ctx.closePath(); break;
    case 'ring':
      ctx.ellipse(0,0,hw-sw/2,hh-sw/2,0,0,Math.PI*2);
      ctx.ellipse(0,0,hw*0.48,hh*0.48,0,0,Math.PI*2,true);
      break;
    default: ctx.rect(-hw,-hh,w,h);
  }
  if(fillColor && fillColor!=='none') { ctx.fillStyle=fillColor; ctx.fill('evenodd'); }
  if(sw>0 && strokeColor) { ctx.strokeStyle=strokeColor; ctx.lineWidth=sw; ctx.lineJoin='round'; ctx.stroke(); }
}

// ── 아이템 렌더링 ──
function renderItems() {
  itemsLayer.innerHTML = '';
  itemsLayer.classList.add('interactive');
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'deco-item' + (selectedItem?.id===item.id?' selected':'');
    el.dataset.id = item.id;
    el.style.cssText = `left:${item.x}px;top:${item.y}px;width:${item.w}px;height:${item.h}px;transform:rotate(${item.rot||0}deg);`;

    // 도형 아이템
    if(item.type === 'shape') {
      el.innerHTML = shapeSvgEl(item.shape, item.fillColor, item.strokeColor, item.strokeWidth);
    } else {
    // 프레임 설정
    const frameClass = item.frame || '';
    const needsInner = ['frame-triangle','frame-heart','frame-star','frame-squirt'].includes(frameClass);
    const objFit = frameClass ? 'cover' : 'fill';
    if(needsInner) {
      el.innerHTML = `<div class="frame-inner" style="width:100%;height:100%;"><img src="${item.src}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>`;
      el.classList.add(frameClass);
    } else {
      el.innerHTML = `<img src="${item.src}" style="width:100%;height:100%;object-fit:${objFit};display:block;">`;
      if(frameClass) el.classList.add(frameClass);
    }
    }

    // 핸들 (크기 고정 아이템은 resize 핸들 숨김)
    el.innerHTML += `
      <div class="item-handles">
        <div class="handle rot" data-action="rot"></div>
        ${item._sizeFixed ? '' : '<div class="handle br" data-action="resize"></div>'}
      </div>
      <button class="item-del" onclick="deleteItemById(${item.id})">✕</button>`;

    setupItemEvents(el, item);
    itemsLayer.appendChild(el);
  });
}

function setupItemEvents(el, item) {
  // 탭으로 선택
  el.addEventListener('pointerdown', e => {
    if(e.target.dataset.action) return;
    if(e.target.classList.contains('item-del')) return;
    e.stopPropagation();
    selectItemById(item.id);
    startDragItem(e, item);
  });
  // 회전 핸들
  const rotHandle = el.querySelector('[data-action="rot"]');
  if(rotHandle) rotHandle.addEventListener('pointerdown', e => { e.stopPropagation(); startRotItem(e, item, el); });
  // 리사이즈 핸들
  const resHandle = el.querySelector('[data-action="resize"]');
  if(resHandle) resHandle.addEventListener('pointerdown', e => { e.stopPropagation(); startResizeItem(e, item); });
}

// ── 드래그 이동 ──
function startDragItem(e, item) {
  const startX = e.clientX - item.x;
  const startY = e.clientY - item.y;
  const rect = canvasWrap.getBoundingClientRect();
  function onMove(ev) {
    const cx = (ev.clientX || ev.touches?.[0]?.clientX) - rect.left;
    const cy = (ev.clientY || ev.touches?.[0]?.clientY) - rect.top;
    item.x = (ev.clientX - startX);
    item.y = (ev.clientY - startY);
    const el = itemsLayer.querySelector(`[data-id="${item.id}"]`);
    if(el) { el.style.left = item.x+'px'; el.style.top = item.y+'px'; }
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

// ── 회전 ──
function startRotItem(e, item, el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  function onMove(ev) {
    const dx = ev.clientX - cx, dy = ev.clientY - cy;
    item.rot = Math.atan2(dy,dx) * 180/Math.PI + 90;
    el.style.transform = `rotate(${item.rot}deg)`;
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

// ── 리사이즈 ──
function startResizeItem(e, item) {
  const startDist = Math.hypot(e.clientX - (item.x + item.w/2), e.clientY - (item.y + item.h/2));
  const startW = item.w, startH = item.h;
  function onMove(ev) {
    const dist = Math.hypot(ev.clientX - (item.x + item.w/2), ev.clientY - (item.y + item.h/2));
    const scale = dist / startDist;
    item.w = Math.max(30, startW * scale);
    item.h = Math.max(30, startH * scale);
    const el = itemsLayer.querySelector(`[data-id="${item.id}"]`);
    if(el) { el.style.width = item.w+'px'; el.style.height = item.h+'px'; }
    const rangeEl = document.getElementById('img-size-range');
    if(rangeEl) rangeEl.value = item.w;
    refreshSizeCm(item.w, 'img-size-cm');
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

// ── 선택 ──
function selectItemById(id) {
  selectedItem = items.find(i=>i.id===id)||null;
  renderItems();
  updatePanelForSelection();
}

function deselectAll() {
  selectedItem = null;
  renderItems();
  updatePanelForSelection();
}

function deleteSelectedItem() {
  if(!selectedItem) return;
  deleteItemById(selectedItem.id);
}
function deleteItemById(id) {
  items = items.filter(i=>i.id!==id);
  if(selectedItem?.id===id) selectedItem=null;
  renderItems();
  updatePanelForSelection();
}

// 캔버스 빈 곳 탭 → 선택 해제
canvasWrap.addEventListener('pointerdown', e => {
  if(e.target === canvasWrap || e.target === itemsLayer) deselectAll();
});

function updatePanelForSelection() {
  const pDefault = document.getElementById('panel-default');
  const pImage   = document.getElementById('panel-image');
  const pShape   = document.getElementById('panel-shape');
  const pDraw    = document.getElementById('panel-draw');
  const hide = el => el.style.display='none';
  [pDefault,pImage,pShape,pDraw].forEach(hide);
  if(drawMode) {
    pDraw.style.display='flex';
  } else if(selectedItem?.type === 'shape') {
    pShape.style.display='flex';
    document.getElementById('shape-size-range').value = selectedItem.w;
    document.getElementById('shape-fill-color').value = selectedItem.fillColor==='none'?'#ff6b6b':selectedItem.fillColor;
    document.getElementById('shape-fill-none').classList.toggle('active', selectedItem.fillColor==='none');
    document.getElementById('shape-stroke-color').value = selectedItem.strokeColor||'#000000';
    document.getElementById('shape-stroke-w').value = selectedItem.strokeWidth||3;
    document.getElementById('shape-sw-val').textContent = selectedItem.strokeWidth||3;
    refreshSizeCm(selectedItem.w, 'shape-size-cm');
  } else if(selectedItem) {
    pImage.style.display='flex';
    const sizeRange = document.getElementById('img-size-range');
    const sizeRow = sizeRange.closest('.panel-row');
    sizeRange.value = Math.round(selectedItem.w);
    sizeRange.disabled = selectedItem._sizeFixed || false;
    if(sizeRow) sizeRow.style.opacity = selectedItem._sizeFixed ? '0.4' : '';
    document.querySelectorAll('.frame-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.frame===(selectedItem.frame||''));
    });
    refreshSizeCm(selectedItem.w, 'img-size-cm');
  } else {
    pDefault.style.display='flex';
  }
}

// ── 실제 크기(cm) 변환 ──
function pxToCm(screenPx) {
  if(!currentRefPx || !canvasW) return '';
  const cm = screenPx * EXPORT_W / canvasW / currentRefPx * 10;
  return cm.toFixed(1) + 'cm';
}

function refreshSizeCm(screenPx, elId) {
  const el = document.getElementById(elId);
  if(!el) return;
  el.textContent = pxToCm(screenPx);
}

function onItemSizeChange(val) {
  if(!selectedItem || selectedItem._sizeFixed) return;
  const ratio = selectedItem.h / selectedItem.w;
  selectedItem.w = +val;
  selectedItem.h = +val * ratio;
  const el = itemsLayer.querySelector(`[data-id="${selectedItem.id}"]`);
  if(el) { el.style.width = selectedItem.w+'px'; el.style.height = selectedItem.h+'px'; }
  refreshSizeCm(+val, 'img-size-cm');
}

function setFrame(btn, frame) {
  if(!selectedItem) return;
  const prevFrame = selectedItem.frame;
  selectedItem.frame = frame;

  if(frame && !prevFrame) {
    // 프레임 적용: 정사각형으로 변환 (프레임이 사방을 꽉 채우도록)
    selectedItem.h = selectedItem.w;
  } else if(!frame && prevFrame) {
    // 프레임 해제: 원본 비율 복원
    selectedItem.h = selectedItem.w * (selectedItem.naturalRatio || 1);
  }

  document.querySelectorAll('.frame-btn').forEach(b=>b.classList.toggle('active', b===btn));
  renderItems();
  // 선택 유지
  const el = itemsLayer.querySelector(`[data-id="${selectedItem.id}"]`);
  if(el) el.classList.add('selected');
}

// ── 드로잉 ──
function toggleDrawMode() {
  drawMode ? cancelDrawMode() : enterDrawMode();
}

function enterDrawMode() {
  drawMode = true;
  deselectAll();
  document.getElementById('btn-draw').style.background='#000';
  document.getElementById('btn-draw').style.color='#fff';
  drawCanvas.style.cursor = 'crosshair';
  drawCanvas.style.pointerEvents = 'auto';
  itemsLayer.classList.remove('interactive');
  // 드로잉 캔버스 초기화
  drawCtx.clearRect(0,0,canvasW,canvasH);
  strokeHistory = [];
  updatePanelForSelection();
}

function cancelDrawMode() {
  drawMode = false;
  drawCtx.clearRect(0,0,canvasW,canvasH);
  document.getElementById('btn-draw').style.background='';
  document.getElementById('btn-draw').style.color='';
  drawCanvas.style.pointerEvents = 'none';
  drawCanvas.style.cursor = 'default';
  itemsLayer.classList.add('interactive');
  updatePanelForSelection();
}

function getDrawingBBox() {
  const imageData = drawCtx.getImageData(0, 0, canvasW, canvasH);
  const data = imageData.data;
  let minX = canvasW, minY = canvasH, maxX = -1, maxY = -1;
  for(let y = 0; y < canvasH; y++) {
    for(let x = 0; x < canvasW; x++) {
      if(data[(y * canvasW + x) * 4 + 3] > 10) {
        if(x < minX) minX = x;
        if(x > maxX) maxX = x;
        if(y < minY) minY = y;
        if(y > maxY) maxY = y;
      }
    }
  }
  if(maxX < 0) return null;
  const pad = 12;
  const x = Math.max(0, minX - pad);
  const y = Math.max(0, minY - pad);
  const x2 = Math.min(canvasW - 1, maxX + pad);
  const y2 = Math.min(canvasH - 1, maxY + pad);
  return { x, y, w: x2 - x + 1, h: y2 - y + 1 };
}

function finishDrawing() {
  const blank = document.createElement('canvas');
  blank.width = canvasW; blank.height = canvasH;
  if(drawCanvas.toDataURL() === blank.toDataURL()) { cancelDrawMode(); return; }

  const bbox = getDrawingBBox();
  if(!bbox) { cancelDrawMode(); return; }

  // 실제 그림 영역만 크롭
  const cropCanvas = document.createElement('canvas');
  cropCanvas.width = bbox.w;
  cropCanvas.height = bbox.h;
  cropCanvas.getContext('2d').drawImage(drawCanvas, bbox.x, bbox.y, bbox.w, bbox.h, 0, 0, bbox.w, bbox.h);
  const croppedUrl = cropCanvas.toDataURL('image/png');

  const naturalRatio = bbox.h / bbox.w;
  const item = {
    id: Date.now(), type: 'drawing', src: croppedUrl,
    x: bbox.x, y: bbox.y, w: bbox.w, h: bbox.h,
    rot: 0, frame: '', naturalRatio
  };
  items.push(item);
  cancelDrawMode();
  renderItems();
  selectItemById(item.id);
}

function setupDrawEvents() {
  drawCanvas.style.pointerEvents = 'none';
  function getPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [(t.clientX - rect.left) * (canvasW / rect.width),
            (t.clientY - rect.top)  * (canvasH / rect.height)];
  }
  function startStroke(e) {
    if(!drawMode) return;
    e.preventDefault();
    isDrawing = true;
    [lastX, lastY] = getPos(e);
    // 스트로크 시작 전 스냅샷 저장
    strokeHistory.push(drawCtx.getImageData(0,0,canvasW,canvasH));
    drawCtx.beginPath();
    drawCtx.arc(lastX, lastY, drawSize/2, 0, Math.PI*2);
    drawCtx.fillStyle = drawColor;
    drawCtx.fill();
  }
  function drawStroke(e) {
    if(!drawMode || !isDrawing) return;
    e.preventDefault();
    const [x,y] = getPos(e);
    drawCtx.beginPath();
    drawCtx.moveTo(lastX, lastY);
    drawCtx.lineTo(x, y);
    drawCtx.strokeStyle = drawColor;
    drawCtx.lineWidth = drawSize;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    drawCtx.stroke();
    [lastX, lastY] = [x,y];
  }
  function endStroke() { isDrawing = false; }
  drawCanvas.addEventListener('pointerdown', startStroke);
  drawCanvas.addEventListener('pointermove', drawStroke);
  drawCanvas.addEventListener('pointerup', endStroke);
  drawCanvas.addEventListener('touchstart', startStroke, {passive:false});
  drawCanvas.addEventListener('touchmove', drawStroke, {passive:false});
  drawCanvas.addEventListener('touchend', endStroke);
}

function undoLastStroke() {
  if(!strokeHistory.length) return;
  drawCtx.putImageData(strokeHistory.pop(), 0, 0);
}

function setDrawColor(c) {
  drawColor = c;
  document.getElementById('draw-color-input').value = c;
  document.querySelectorAll('#draw-color-row .color-swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.color === c);
  });
}

function renderKeyColorSwatches() {
  const row = document.getElementById('draw-color-row');
  // 기존 스와치 제거
  row.querySelectorAll('.color-swatch').forEach(s=>s.remove());
  keyColors.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.dataset.color = c;
    sw.style.background = c;
    sw.title = c;
    sw.addEventListener('click', () => setDrawColor(c));
    row.appendChild(sw);
  });
}

// ── 내보내기 ──
async function openExport() {
  window.parent.postMessage({ type: 'lmp-tool-complete' }, '*');
  const expCanvas = document.getElementById('export-canvas');
  // 화면 캔버스 비율(=배경 이미지 자연 비율)에 맞춰 출력 캔버스 차원 산출
  const expW = EXPORT_W;
  const expH = canvasW > 0 ? Math.round(expW * canvasH / canvasW) : EXPORT_H;
  expCanvas.width = expW;
  expCanvas.height = expH;
  const ctx = expCanvas.getContext('2d');
  const scale = expW / canvasW; // 화면→출력 배율 (가로/세로 동일)

  // 1. 배경 (캔버스 비율이 이미지와 동일 → 정확히 채움)
  if(bgImage) {
    ctx.drawImage(bgImage, 0, 0, expW, expH);
  }

  // 2. 아이템들 (순서대로)
  for(const item of items) {
    await drawItemOnCanvas(ctx, item, scale);
  }

  document.getElementById('export-modal').classList.add('on');
}

async function drawItemOnCanvas(ctx, item, scale=1) {
  ctx.save();
  const sw = item.w * scale, sh = item.h * scale;
  ctx.translate((item.x + item.w/2) * scale, (item.y + item.h/2) * scale);
  ctx.rotate((item.rot||0) * Math.PI/180);

  if(item.type === 'shape') {
    drawShapeToCtx(ctx, item.shape, sw, sh, item.fillColor, item.strokeColor, (item.strokeWidth||0)*scale);
    ctx.restore();
    return;
  }

  const img = await loadImageCORS(item.src);
  if(!img) { ctx.restore(); return; }

  // 프레임 클립
  applyFrameClip(ctx, item.frame, sw, sh);

  ctx.drawImage(img, -sw/2, -sh/2, sw, sh);
  ctx.restore();
}

function applyFrameClip(ctx, frame, w, h) {
  if(!frame) return;
  ctx.beginPath();
  const hw=w/2, hh=h/2;
  if(frame==='frame-circle') {
    ctx.ellipse(0,0,hw,hh,0,0,Math.PI*2);
  } else if(frame==='frame-round') {
    const r=Math.min(hw,hh)*0.2;
    ctx.roundRect(-hw,-hh,w,h,r);
  } else if(frame==='frame-triangle') {
    ctx.moveTo(0,-hh); ctx.lineTo(hw,hh); ctx.lineTo(-hw,hh); ctx.closePath();
  } else if(frame==='frame-heart') {
    // 하트 근사
    const s=hw/50;
    ctx.moveTo(0,hh*0.85);
    ctx.bezierCurveTo(-hw,-hh*0.2,-hw,-hh*0.9,0,-hh*0.3);
    ctx.bezierCurveTo(hw,-hh*0.9,hw,-hh*0.2,0,hh*0.85);
  } else if(frame==='frame-star') {
    for(let i=0;i<10;i++){
      const r2=i%2===0?Math.max(hw,hh):Math.max(hw,hh)*0.45;
      const a=i*Math.PI/5-Math.PI/2;
      i===0?ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2):ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    }
    ctx.closePath();
  } else if(frame==='frame-squirt') {
    const pts=8, r2=Math.max(hw,hh);
    for(let i=0;i<pts;i++){
      const a=i*(Math.PI*2/pts)-Math.PI/2;
      i===0?ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2):ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    }
    ctx.closePath();
  }
  ctx.clip();
}

function loadImageCORS(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => {
      // crossOrigin 실패 시 재시도 (data URL은 필요 없음)
      if(src.startsWith('data:')) { resolve(null); return; }
      const img2 = new Image();
      img2.onload = () => resolve(img2);
      img2.onerror = () => resolve(null);
      img2.src = src;
    };
    img.src = src;
  });
}

function downloadExport() {
  const canvas = document.getElementById('export-canvas');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = '내부스꾸미기.png';
  a.click();
}

async function shareExport() {
  const canvas = document.getElementById('export-canvas');
  canvas.toBlob(async blob => {
    if(navigator.share && navigator.canShare({files:[new File([blob],'booth.png',{type:'image/png'})]})) {
      await navigator.share({files:[new File([blob],'booth.png',{type:'image/png'})], title:toolTitle});
    } else {
      downloadExport();
    }
  });
}

function closeExport() { document.getElementById('export-modal').classList.remove('on'); }

// ── postMessage: 부모 플레이어에서 사용자 데이터 수신 ──
window.addEventListener('message', e => {
  if(e.data?.type !== 'lmp-context') return;
  const d = e.data;
  lastContextData = d; // fieldKey 확정 후 재처리를 위해 저장
  contextReceived = true;
  if(d.blockBg) document.documentElement.style.setProperty('--lmp-block-bg', d.blockBg);
  if(d.keyColors?.length) { keyColors = d.keyColors; renderKeyColorSwatches(); }
  // fieldKey 기반으로 사용자 필드값 추출 (기존 boothType 하위호환 포함)
  const bt = d.boothType || d.userFields?.[fieldKey] || d.userFields?.boothType || d.userFields?.type || '';
  if(bt) {
    userBoothType = bt;
    hideBgBtn();
    updateMetaBar();
    // backgrounds가 이미 로드된 경우에만 즉시 적용 (미로드면 loadBackgrounds 완료 후 처리)
    if(backgrounds.length) autoSelectBg();
  } else {
    showBgBtn();
    updateMetaBar();
  }
});

// ── 시작: 배경 버튼 기본 숨김 (컨텍스트 대기) ──
document.addEventListener('DOMContentLoaded', () => {
  hideBgBtn();
});

init();
</script>
