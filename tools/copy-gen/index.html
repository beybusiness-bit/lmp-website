<head>

<title>문구 생성기</title>

<style>
:root{--lmp-block-bg:#fff;--lmp-input-bg:transparent;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:transparent;color:#000;}

#loading{padding:40px 20px;text-align:center;font-size:14px;color:rgba(0,0,0,.5);}
#err-screen{display:none;padding:40px 20px;text-align:center;font-size:14px;color:#c00;font-weight:700;}
#app{display:none;padding:24px 20px 48px;}

/* screens */
.cg-screen{display:none;}
.cg-screen.on{display:block;}

/* references */
.ref-section{margin-bottom:20px;padding:14px 16px;border:1.5px solid rgba(0,0,0,.12);background:rgba(0,0,0,.02);}
.ref-ttl{font-size:11px;font-weight:800;letter-spacing:.5px;color:rgba(0,0,0,.4);margin-bottom:10px;}
.ref-item{font-size:13px;color:rgba(0,0,0,.65);line-height:1.7;padding:5px 0;border-bottom:1px solid rgba(0,0,0,.06);}
.ref-item:last-child{border-bottom:none;}

/* form fields */
.ff-wrap{margin-bottom:32px;}
.ff-label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;line-height:1.4;}
.ff-desc{font-size:13px;color:rgba(0,0,0,.62);margin-bottom:8px;font-weight:500;line-height:1.6;}
.ff-inp,.ff-textarea,.ff-sel{width:100%;border:2px solid #000;border-radius:0;padding:11px 13px;font-size:15px;font-family:inherit;background:var(--lmp-input-bg);color:#000;outline:none;-webkit-appearance:none;appearance:none;}
.ff-textarea{min-height:100px;resize:vertical;}
.ff-inp:focus,.ff-textarea:focus,.ff-sel:focus{box-shadow:0 0 0 3px rgba(0,0,0,.08);}
.ff-err{color:#c00;font-size:13px;font-weight:700;margin-bottom:12px;min-height:16px;}
.ff-required{color:#c00;}

/* style selectors */
.style-section{margin-bottom:20px;}
.style-section-ttl{font-size:11px;font-weight:800;letter-spacing:.5px;color:rgba(0,0,0,.4);margin-bottom:14px;}
.style-dim{margin-bottom:14px;}
.style-dim-lbl{font-size:12px;font-weight:700;margin-bottom:8px;color:rgba(0,0,0,.7);}
.style-pills{display:flex;flex-wrap:wrap;gap:8px;}
.style-pill{padding:8px 14px;border:2px solid rgba(0,0,0,.3);background:var(--lmp-block-bg);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:rgba(0,0,0,.7);}
.style-pill.on{background:#000;color:var(--lmp-block-bg);border-color:#000;}

/* style hint */
.style-hint{font-size:11px;color:rgba(0,0,0,.45);font-weight:600;margin-top:6px;}
.style-pill:disabled{opacity:.3;cursor:default;}

/* title / description */
.cg-header{margin-bottom:22px;}
.cg-title{font-size:18px;font-weight:800;line-height:1.4;margin-bottom:6px;}
.cg-desc{font-size:13px;color:rgba(0,0,0,.6);line-height:1.7;}
.cg-desc p,.cg-desc div{margin-bottom:0.6em;}.cg-desc p:last-child,.cg-desc div:last-child{margin-bottom:0;}

/* generate button */
.gen-btn{display:block;width:100%;padding:14px;background:#000;color:var(--lmp-block-bg);border:2px solid #000;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;}
.gen-btn:disabled{opacity:.35;cursor:default;}

/* loading screen */
.cg-loading-wrap{padding:60px 20px;text-align:center;}
.cg-spinner{width:34px;height:34px;border:3px solid rgba(0,0,0,.1);border-top-color:#000;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.cg-loading-msg{font-size:14px;color:rgba(0,0,0,.5);}

/* results */
.results-ttl{font-size:11px;font-weight:800;letter-spacing:.5px;color:rgba(0,0,0,.4);margin-bottom:14px;}
.phrase-card{border:2px solid #000;padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;}
.phrase-text{flex:1;font-size:15px;font-weight:600;line-height:1.7;word-break:keep-all;white-space:pre-wrap;}
.copy-btn{flex-shrink:0;padding:8px 12px;border:1.5px solid #000;background:var(--lmp-block-bg);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;align-self:flex-start;transition:background .12s,color .12s;}
.copy-btn.done{background:#000;color:var(--lmp-block-bg);border-color:#000;}
.results-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.more-btn{padding:12px;background:transparent;border:2px solid #000;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.more-btn:disabled{opacity:.35;cursor:default;}
.edit-btn{padding:12px;background:transparent;border:2px solid rgba(0,0,0,.25);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:rgba(0,0,0,.55);}
</style>
</head>

<div id="app">

      <div class="cg-title" id="cg-title"></div>

    <div class="results-actions">

      <button class="edit-btn" onclick="backToInput()">← 수정하기</button>

  </div>
</div>

    {value:'exciting',label:'설레는'},{value:'touching',label:'감동적인'},{value:'lyrical',label:'감성적인'},
    {value:'mysterious',label:'신비로운'},{value:'calm',label:'차분한'},{value:'serious',label:'진지한'},
    {value:'professional',label:'전문적인'},{value:'trustworthy',label:'신뢰감 있는'},{value:'solemn',label:'장엄한'},
    {value:'intense',label:'강렬한'},{value:'urgent',label:'긴박한'},{value:'cold',label:'냉정한'},
    {value:'rigid',label:'딱딱한'},{value:'custom',label:'기타…'},
  ]},
];
let config = null;
let mergedStyleOptions = [];
let styleSelections = {};
let customStyleText = {};
let allPhrases = [];
let ctxProjectId = '';
let ctxUserId = '';
let ctxUserDisplayName = '';
let toolCompleteFired = false;
let userGenCount = 0;

window.addEventListener('message', e => {
  if (e.data?.type !== 'lmp-context') return;
  ctxProjectId = e.data.projectId || '';
  ctxUserId = e.data.userId || '';
  const uf = e.data.userFields || {};
  ctxUserDisplayName = uf.name || uf.displayName || uf.이름 || '';
  if (e.data.blockBg) {
    document.documentElement.style.setProperty('--lmp-block-bg', e.data.blockBg);
    document.documentElement.style.setProperty('--lmp-input-bg', e.data.blockBg);
  }
  if (e.data.blockBgImage) { const _f=e.data.blockBgFit||'cover',_p=e.data.blockBgPos||'center'; document.body.style.backgroundImage=`url('${e.data.blockBgImage}')`; document.body.style.backgroundSize=_f==='natural'?'contain':_f; document.body.style.backgroundPosition=_p; document.body.style.backgroundRepeat='no-repeat'; }
  if (config) loadUserGenerationCount();
});

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showScreen(id) {
  ['screen-input', 'screen-loading', 'screen-results'].forEach(s => {
    document.getElementById(s).classList.toggle('on', s === id);
  });
}

function showErr(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('err-screen');
  el.textContent = msg;
  el.style.display = 'block';
}

function renderField(f) {
  const fid = f.key || f.id;
  const req = f.required ? '<span class="ff-required"> *</span>' : '';
  const desc = f.description ? `<div class="ff-desc">${esc(f.description)}</div>` : '';
  const ph = esc(f.placeholder || '');
  if (f.type === 'text' || f.type === 'string') {
    return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}<input class="ff-inp" id="ff-${fid}" type="text" placeholder="${ph}"></div>`;
  }
  if (f.type === 'textarea') {
    return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}<textarea class="ff-textarea" id="ff-${fid}" placeholder="${ph}"></textarea></div>`;
  }
  if (f.type === 'select') {
    const opts = (f.options || []).map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
    return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}<select class="ff-sel" id="ff-${fid}"><option value="">선택해주세요</option>${opts}</select></div>`;
  }
  return '';
}

function renderStyleDim(dim) {
  const multiSel = dim.multiSelect || false;
  const maxSel = dim.maxSelect || 2;
  const curSel = styleSelections[dim.key];
  const selArr = multiSel ? (Array.isArray(curSel) ? curSel : []) : null;

  const pills = dim.choices.map(c => {
    const isOn = multiSel ? selArr.includes(c.value) : curSel === c.value;
    return `<button type="button" class="style-pill${isOn ? ' on' : ''}"
      onclick="toggleStylePill(this,'${esc(dim.key)}','${esc(c.value)}')">${esc(c.label)}</button>`;
  }).join('');

  const hasCustom = dim.choices.some(c => c.value === 'custom');
  const showCustom = hasCustom && (multiSel ? selArr.includes('custom') : curSel === 'custom');
  const customInp = hasCustom
    ? `<input type="text" id="style-custom-${esc(dim.key)}" class="ff-inp"
        placeholder="분위기를 직접 입력해주세요 (예: 귀여운, 학구적인…)"
        style="display:${showCustom?'block':'none'};margin-top:10px;"
        oninput="customStyleText['${esc(dim.key)}']=this.value">`
    : '';

  const hint = multiSel
    ? `<div class="style-hint" id="style-hint-${esc(dim.key)}">여러 개 선택 가능 (최대 ${maxSel}개, 현재 ${selArr.length}개 선택됨)</div>`
    : '';

  const inner = `<div class="style-dim">
    <div class="style-dim-lbl">${esc(dim.label)}</div>
    <div class="style-pills" id="style-pills-${esc(dim.key)}">${pills}</div>
    ${hint}
    ${customInp}
  </div>`;
  if (dim.key === 'speech_level') {
    return `<div id="dim-wrap-speech_level" style="display:none;">${inner}</div>`;
  }
  return `<div id="dim-wrap-${esc(dim.key)}">${inner}</div>`;
}

function toggleStylePill(btn, key, value) {
  const container = document.getElementById('style-pills-' + key);
  if (!container) return;
  const dim = mergedStyleOptions.find(d => d.key === key);
  const multiSel = dim?.multiSelect || false;
  const maxSel = dim?.maxSelect || 2;

  if (multiSel) {
    if (!Array.isArray(styleSelections[key])) styleSelections[key] = [];
    const isOn = btn.classList.contains('on');
    if (isOn) {
      styleSelections[key] = styleSelections[key].filter(v => v !== value);
      btn.classList.remove('on');
    } else {
      if (styleSelections[key].length >= maxSel) return;
      styleSelections[key].push(value);
      btn.classList.add('on');
    }
    if (!styleSelections[key].length) delete styleSelections[key];
    // update hint count
    const hint = document.getElementById('style-hint-' + key);
    if (hint) hint.textContent = `여러 개 선택 가능 (최대 ${maxSel}개, 현재 ${(styleSelections[key]||[]).length}개 선택됨)`;
    // show/hide custom input
    const customInp = document.getElementById('style-custom-' + key);
    if (customInp) {
      const sel = styleSelections[key] || [];
      customInp.style.display = sel.includes('custom') ? 'block' : 'none';
      if (sel.includes('custom') && value === 'custom') { customInp.value = customStyleText[key] || ''; customInp.focus(); }
    }
  } else {
    const isOn = btn.classList.contains('on');
    container.querySelectorAll('.style-pill').forEach(p => p.classList.remove('on'));
    if (!isOn) { btn.classList.add('on'); styleSelections[key] = value; }
    else { delete styleSelections[key]; }
    const customInp = document.getElementById('style-custom-' + key);
    if (customInp) {
      const show = !isOn && value === 'custom';
      customInp.style.display = show ? 'block' : 'none';
      if (show) { customInp.value = customStyleText[key] || ''; customInp.focus(); }
    }
  }
  if (key === 'format') updateFormatDependentDims();
}

// 슬로건 선택 시 어미/말투/격식 숨김, 문장식 선택 시 어미만 표시
const SLOGAN_HIDDEN = ['speech_level', 'register', 'formality'];
function updateFormatDependentDims() {
  const fmt = styleSelections.format;
  const isSlogan = fmt === 'slogan';
  const isProse  = fmt === 'prose';

  // 어미: 문장식일 때만 표시 (슬로건이면 어차피 숨겨짐)
  const speechWrap = document.getElementById('dim-wrap-speech_level');
  if (speechWrap) speechWrap.style.display = (isProse && !isSlogan) ? '' : 'none';
  if (!isProse) {
    delete styleSelections.speech_level;
    document.getElementById('style-pills-speech_level')?.querySelectorAll('.style-pill').forEach(p => p.classList.remove('on'));
  }

  // 슬로건이면 말투·격식 숨김 + 선택 초기화
  ['register', 'formality'].forEach(k => {
    const wrap = document.getElementById('dim-wrap-' + k);
    if (!wrap) return;
    if (isSlogan) {
      wrap.style.display = 'none';
      delete styleSelections[k];
      wrap.querySelectorAll('.style-pill').forEach(p => p.classList.remove('on'));
    } else {
      wrap.style.display = '';
    }
  });
}

function genLimitDocId() {
  return CONFIG_ID + '__' + (ctxUserId || 'anon');
}

async function loadUserGenerationCount() {
  if (!ctxUserId) return;
  const max = config?.outputConfig?.maxGenerationsPerUser || 0;
  if (!max) return;
  try {
    const snap = await db.collection('cms_copy_gen_usages').doc(genLimitDocId()).get();
    userGenCount = snap.exists ? (snap.data().count || 0) : 0;
    updateGenLimitUI(max);
  } catch (e) { console.warn('[copy-gen] usage load failed', e); }
}

function updateGenLimitUI(max) {
  if (!max) { document.getElementById('cg-gen-limit').style.display = 'none'; return; }
  const remaining = Math.max(0, max - userGenCount);
  const el = document.getElementById('cg-gen-limit');
  el.style.display = '';
  if (remaining <= 0) {
    el.textContent = '생성 횟수를 모두 사용했습니다.';
    el.style.color = '#c00';
    document.getElementById('gen-btn').disabled = true;
    const moreBtn = document.getElementById('more-btn');
    if (moreBtn) moreBtn.disabled = true;
  } else {
    el.textContent = `남은 생성 횟수: ${remaining}회`;
    el.style.color = 'rgba(0,0,0,.5)';
  }
}

async function incrementGenerationCount() {
  const max = config?.outputConfig?.maxGenerationsPerUser || 0;
  if (!max || !ctxUserId) return;
  userGenCount++;
  try {
    await db.collection('cms_copy_gen_usages').doc(genLimitDocId()).set({
      configId: CONFIG_ID, userId: ctxUserId, count: userGenCount,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
  } catch (e) { console.warn('[copy-gen] usage save failed', e); }
  updateGenLimitUI(max);
}

async function init() {
  if (!CONFIG_ID) { showErr('문구 생성기 ID가 없습니다.'); return; }
  try {
    const snap = await db.collection('cms_copy_gen_configs').doc(CONFIG_ID).get();
    if (!snap.exists) { showErr('문구 생성기를 찾을 수 없습니다.'); return; }
    config = snap.data();

    // 제목 / 설명
    if (config.title || config.description) {
      document.getElementById('cg-title').textContent = config.title || '';
      document.getElementById('cg-desc').textContent = config.description || '';
      document.getElementById('cg-desc').style.display = config.description ? '' : 'none';
      document.getElementById('cg-header').style.display = '';
    }

    // PREDEFINED와 저장된 styleOptions를 병합 — 구 형식 config도 모든 차원이 표시되도록
    const savedByKey = {};
    (config.styleOptions || []).forEach(s => { savedByKey[s.key] = s; });
    mergedStyleOptions = PREDEFINED_STYLE_OPTIONS.map(pred => {
      const saved = savedByKey[pred.key] || {};
      return { ...pred, mode: saved.mode || 'user-select', fixedValue: saved.fixedValue || '',
               multiSelect: saved.multiSelect || false, maxSelect: saved.maxSelect || 2 };
    });

    // admin이 고정한 스타일 값을 초기 선택으로 세팅
    mergedStyleOptions.forEach(dim => {
      if (dim.mode === 'fixed' && dim.fixedValue) styleSelections[dim.key] = dim.fixedValue;
    });

    // 참고 문구 (showToUser=true만)
    const visibleRefs = (config.references || []).filter(r => r.showToUser);
    if (visibleRefs.length) {
      document.getElementById('cg-ref-section').style.display = '';
      document.getElementById('cg-ref-list').innerHTML = visibleRefs.map(r => `<div class="ref-item">${esc(r.text)}</div>`).join('');
    }

    // 필드 렌더링
    const fields = (config.fields || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    document.getElementById('cg-field-list').innerHTML = fields.map(renderField).join('');

    // 스타일 선택 UI (user-select 항목만)
    const userStyleDims = mergedStyleOptions.filter(d => d.mode === 'user-select');
    if (userStyleDims.length) {
      document.getElementById('cg-style-section').style.display = '';
      document.getElementById('cg-style-dims').innerHTML = userStyleDims.map(renderStyleDim).join('');
    }
    updateFormatDependentDims();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    showScreen('screen-input');
    window.parent.postMessage({ type: 'lmp-ready' }, '*');
    if (ctxUserId) loadUserGenerationCount();
  } catch (e) {
    console.error('[copy-gen init]', e);
    showErr('불러오기에 실패했어요: ' + (e.code || e.message || '알 수 없는 오류'));
  }
}

function collectFields() {
  const fields = (config.fields || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  const result = {};
  const errEl = document.getElementById('cg-err');
  errEl.textContent = '';
  for (const f of fields) {
    const fid = f.key || f.id;
    const el = document.getElementById('ff-' + fid);
    if (!el) continue;
    const val = el.value?.trim() || '';
    if (f.required && !val) {
      errEl.textContent = (f.label || fid) + '을(를) 입력해주세요.';
      return null;
    }
    if (val) result[f.label || fid] = val;
  }
  return result;
}

async function callAPI(existingPhrases) {
  const fields = collectFields();
  if (fields === null) return null;

  // 'custom' 값 교체 + 배열(중복선택) 처리
  const resolvedSelections = {};
  Object.entries(styleSelections).forEach(([k, v]) => {
    if (Array.isArray(v)) {
      const resolved = v.map(val => val === 'custom' ? (customStyleText[k]||'').trim() : val).filter(Boolean);
      if (resolved.length) resolvedSelections[k] = resolved.join(', ');
    } else if (v === 'custom') {
      const txt = (customStyleText[k] || '').trim();
      if (txt) resolvedSelections[k] = txt;
    } else if (v) {
      resolvedSelections[k] = v;
    }
  });

  const refs = (config.references || []).map(r => r.text).filter(Boolean);
  const body = {
    fields,
    referenceRole: config.referenceRole || 'style',
    styleSelections: resolvedSelections,
    references: refs,
    outputConfig: config.outputConfig || { count: 5 },
    existingPhrases,
    aiContext: config.aiContext || '',
    speakerDesc: config.speakerDesc || '',
  };

  const res = await fetch('/api/generate-copy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.phrases || [];
}

async function generate() {
  const max = config?.outputConfig?.maxGenerationsPerUser || 0;
  if (max && userGenCount >= max) {
    document.getElementById('cg-err').textContent = '생성 횟수를 모두 사용했습니다.';
    return;
  }
  showScreen('screen-loading');
  document.getElementById('gen-btn').disabled = true;
  try {
    const phrases = await callAPI([]);
    if (phrases === null) { showScreen('screen-input'); document.getElementById('gen-btn').disabled = false; return; }
    allPhrases = phrases;
    renderPhrases(allPhrases);
    showScreen('screen-results');
    await incrementGenerationCount();
  } catch (e) {
    showScreen('screen-input');
    document.getElementById('cg-err').textContent = '생성 실패: ' + e.message;
  }
  document.getElementById('gen-btn').disabled = false;
}

async function generateMore() {
  const max = config?.outputConfig?.maxGenerationsPerUser || 0;
  if (max && userGenCount >= max) { alert('생성 횟수를 모두 사용했습니다.'); return; }
  const btn = document.getElementById('more-btn');
  btn.disabled = true; btn.textContent = '생성 중…';
  try {
    const newPhrases = await callAPI(allPhrases);
    if (newPhrases) {
      allPhrases = [...allPhrases, ...newPhrases];
      renderPhrases(allPhrases);
      await incrementGenerationCount();
    }
  } catch (e) {
    alert('추가 생성 실패: ' + e.message);
  }
  btn.disabled = false; btn.textContent = '추가 생성 →';
}

function backToInput() {
  showScreen('screen-input');
}

function renderPhrases(phrases) {
  document.getElementById('results-ttl').textContent = `생성된 문구 ${phrases.length}개`;
  document.getElementById('phrase-list').innerHTML = phrases.map((p, i) =>
    `<div class="phrase-card">
      <div class="phrase-text">${esc(p)}</div>
      <button class="copy-btn" id="copy-btn-${i}" onclick="copyPhrase(${i})">복사</button>
    </div>`
  ).join('');
}

async function copyPhrase(idx) {
  const raw = allPhrases[idx];
  if (!raw) return;
  try {
    await navigator.clipboard.writeText(raw);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = raw; ta.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const btn = document.getElementById('copy-btn-' + idx);
  if (btn) { btn.textContent = '복사됨 ✓'; btn.classList.add('done'); }

  saveResult(raw);

  if (!toolCompleteFired) {
    toolCompleteFired = true;
    window.parent.postMessage({ type: 'lmp-tool-complete' }, '*');
  }
}

async function saveResult(copiedText) {
  try {
    const fields = collectFields() || {};
    await db.collection('cms_copy_gen_results').add({
      configId: CONFIG_ID,
      projectId: ctxProjectId || '',
      userId: ctxUserId || '',
      userDisplayName: ctxUserDisplayName || '',
      copiedText,
      inputData: fields,
      styleData: { ...styleSelections },
      copiedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  } catch (e) {
    console.warn('[copy-gen] save failed:', e);
  }
}

init();
</script>
