<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>폼</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
:root{--lmp-block-bg:#fff;--lmp-input-bg:transparent;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:transparent;overflow-y:auto;-webkit-overflow-scrolling:touch;}

.lmp-btn{display:block;width:100%;padding:14px 18px;background:#000;color:var(--lmp-block-bg);border:2px solid #000;border-radius:0;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.2px;transition:background .15s,color .15s;}
.lmp-btn:hover,.lmp-btn:active{background:var(--lmp-block-bg);color:#000;}
.lmp-btn:disabled{opacity:.35;cursor:default;}

.ff-wrap{margin-bottom:32px;}
.ff-label{display:block;font-size:15px;font-weight:700;margin-bottom:8px;line-height:1.4;}
.ff-desc{font-size:13px;color:rgba(0,0,0,.62);margin-bottom:10px;font-weight:500;line-height:1.6;}
.ff-desc *{font-size:inherit!important;color:inherit!important;}
.ff-desc a{color:inherit;text-decoration:underline;}
.ff-inp,.ff-textarea,.ff-sel{width:100%;border:2px solid #000;border-radius:0;padding:12px 14px;font-size:15px;font-family:inherit;background:var(--lmp-input-bg);color:#000;outline:none;-webkit-appearance:none;appearance:none;}
.ff-textarea{min-height:100px;resize:vertical;}
.ff-inp:focus,.ff-textarea:focus,.ff-sel:focus{box-shadow:0 0 0 3px rgba(0,0,0,.08);}
.ff-sel-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.ff-sel-btn{padding:10px 16px;border:2px solid #000;background:var(--lmp-block-bg);color:#000;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;}
.ff-sel-btn.on{background:#000;color:var(--lmp-block-bg);}
.ff-err{color:#c00;font-size:13px;font-weight:700;margin-bottom:12px;min-height:16px;}
.ff-required{color:#c00;}
.ff-char-count{font-size:11px;font-weight:600;color:rgba(0,0,0,.4);text-align:right;margin-top:4px;}
.ff-char-count.warn{color:#c00;}
.ff-color-wrap{display:flex;align-items:center;}
.ff-color-label{position:relative;display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:2px dashed rgba(0,0,0,.3);cursor:pointer;min-width:150px;transition:border-color .15s;}
.ff-color-label:hover{border-color:#000;}
.ff-color-wrap[data-picked="1"] .ff-color-label{border-style:solid;border-color:#000;}
/* input은 항상 버튼 위에 투명하게 깔아서 피커가 버튼 위치에서 열리게 함 */
.ff-color-inp{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0;-webkit-appearance:none;appearance:none;}
.ff-color-ph{font-size:13px;color:rgba(0,0,0,.45);font-family:inherit;pointer-events:none;}
.ff-color-wrap[data-picked="1"] .ff-color-ph{display:none;}
.ff-color-swatch{width:26px;height:26px;border:1.5px solid rgba(0,0,0,.25);flex-shrink:0;pointer-events:none;}
.ff-color-hex{font-size:13px;font-weight:700;font-family:monospace;letter-spacing:.5px;pointer-events:none;}
.ff-color-preview{display:none;align-items:center;gap:8px;}
.ff-color-wrap[data-picked="1"] .ff-color-preview{display:flex;}

/* 파일 업로드 */
.ff-file-label{display:none;}
.ff-file-name{display:none;}
.ff-thumbs-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.ff-thumb{position:relative;width:72px;height:72px;flex-shrink:0;}
.ff-thumb-img{width:72px;height:72px;object-fit:cover;border:1px solid rgba(0,0,0,.15);border-radius:6px;display:block;}
.ff-thumb-badge{width:72px;height:72px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;border:1px solid rgba(0,0,0,.2);border-radius:6px;background:#f5f5f5;font-size:10px;text-align:center;padding:6px;overflow:hidden;word-break:break-all;line-height:1.3;}
.ff-thumb-del{position:absolute;top:-7px;right:-7px;width:20px;height:20px;background:#111;color:#fff;border-radius:50%;font-size:12px;line-height:20px;text-align:center;cursor:pointer;font-weight:900;border:2px solid #fff;padding:0;z-index:1;}
.ff-file-add-label{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border:1.5px dashed rgba(0,0,0,.35);cursor:pointer;font-size:13px;font-weight:700;color:rgba(0,0,0,.6);transition:border-color .15s,color .15s;}
.ff-file-add-label:hover{border-color:#000;color:#000;}
.ff-file-add-label input[type=file]{display:none;}
.ff-file-progress{height:4px;background:rgba(0,0,0,.1);margin-top:6px;display:none;}
.ff-file-progress-bar{height:100%;background:#000;transition:width .2s;width:0%;}
.ff-file-size-note{font-size:11px;color:rgba(0,0,0,.4);margin-top:4px;}

#app{padding:24px 20px;}
.form-title{font-size:17px;font-weight:800;margin-bottom:24px;letter-spacing:-.3px;line-height:1.4;}
.form-desc{font-size:13px;color:rgba(0,0,0,.6);line-height:1.6;margin-bottom:20px;}
.form-desc p,.form-desc div{margin-bottom:0.6em;}.form-desc p:last-child,.form-desc div:last-child{margin-bottom:0;}
#done-msg p,#done-msg div{margin-bottom:0.6em;}#done-msg p:last-child,#done-msg div:last-child{margin-bottom:0;}
#done-screen{display:none;padding:40px 20px;text-align:center;}
#done-screen.on{display:block;}
#form-screen.off{display:none;}
#loading{padding:40px 20px;text-align:center;font-size:14px;color:rgba(0,0,0,.5);}
#err-screen{display:none;padding:40px 20px;text-align:center;font-size:14px;color:#c00;font-weight:700;}
#err-screen.on{display:block;}

/* 달력 위젯 */
.cal-w{border:1.5px solid #000;border-radius:4px;overflow:hidden;user-select:none;}
.cal-hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#000;color:#fff;}
.cal-nav{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0 10px;line-height:1;}
.cal-ttl{font-size:14px;font-weight:700;}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:#f5f5f5;border-bottom:1px solid rgba(0,0,0,.1);}
.cal-dow span{text-align:center;padding:6px 0;font-size:11px;font-weight:700;color:rgba(0,0,0,.45);}
.cal-dow span:first-child{color:#e00;}
.cal-dow span:last-child{color:#00c;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:4px;gap:2px;}
.cal-day{text-align:center;padding:7px 2px;font-size:13px;cursor:pointer;border-radius:4px;transition:background .1s;}
.cal-day:hover:not(.cal-dis){background:rgba(0,0,0,.08);}
.cal-day.cal-sel{background:#000!important;color:#fff!important;border-radius:4px!important;}
.cal-day.cal-range-in{background:rgba(0,0,0,.12);border-radius:0;}
.cal-day.cal-range-start{background:#000!important;color:#fff!important;border-radius:4px 0 0 4px!important;}
.cal-day.cal-range-end{background:#000!important;color:#fff!important;border-radius:0 4px 4px 0!important;}
.cal-day.cal-today{font-weight:800;}
.cal-day.cal-dis{opacity:.22;cursor:not-allowed;pointer-events:none;}
.cal-day.cal-sun{color:#e00;}
.cal-day.cal-sat{color:#00c;}
.cal-info{padding:8px 12px;font-size:12px;text-align:center;border-top:1px solid rgba(0,0,0,.08);min-height:34px;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.55);}

/* 제출 내역 / 수정 모드 */
.edit-mode-banner{background:rgba(0,0,0,.06);border-left:3px solid #000;padding:10px 12px;font-size:12px;font-weight:700;margin-bottom:16px;line-height:1.5;}
#history-link{text-align:center;margin-top:14px;}
#history-link button{background:none;border:none;font-size:13px;color:rgba(0,0,0,.5);text-decoration:underline;cursor:pointer;font-family:inherit;padding:4px 0;}
#history-link button:hover{color:#000;}
#history-screen{display:none;}
#history-screen.on{display:block;}
.hist-back{background:none;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;padding:0 0 16px;color:rgba(0,0,0,.6);display:block;}
.hist-item{border:1.5px solid rgba(0,0,0,.15);padding:16px;margin-bottom:12px;}
.hist-ts{font-size:11px;color:rgba(0,0,0,.45);margin-bottom:10px;font-weight:600;}
.hist-field{margin-bottom:5px;font-size:13px;line-height:1.6;}
.hist-field-lbl{font-weight:700;}
.hist-edit-btn{display:block;width:100%;padding:10px 14px;background:transparent;border:1.5px solid #000;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px;text-align:center;transition:background .15s,color .15s;}
.hist-edit-btn:hover,.hist-edit-btn:active{background:#000;color:#fff;}
</style>
</head>
<body>
<div id="loading">불러오는 중…</div>
<div id="err-screen"></div>
<div id="app" style="display:none;">
  <div id="form-screen">
    <div class="edit-mode-banner" id="edit-mode-banner" style="display:none;">✏️ 수정 모드 — 이전 제출 내역을 수정하고 있어요</div>
    <div class="form-title" id="form-title"></div>
    <div class="form-desc" id="form-desc" style="display:none;"></div>
    <div id="form-fields"></div>
    <div class="ff-err" id="form-err"></div>
    <button class="lmp-btn" id="submit-btn" onclick="submitForm()">제출하기</button>
    <div id="history-link" style="display:none;">
      <button onclick="showHistory()">이전 제출 내역 확인</button>
    </div>
  </div>
  <div id="done-screen">
    <div id="done-msg"></div>
    <div id="done-history-link" style="display:none;margin-top:16px;text-align:center;">
      <button onclick="showHistory()" style="background:none;border:none;font-size:13px;color:rgba(0,0,0,.5);text-decoration:underline;cursor:pointer;font-family:inherit;padding:4px 0;">제출 내역 확인</button>
    </div>
  </div>
  <div id="history-screen">
    <button class="hist-back" onclick="backFromHistory()">← 뒤로</button>
    <div id="history-title" style="font-size:16px;font-weight:800;margin-bottom:16px;letter-spacing:-.3px;">제출 내역</div>
    <div id="history-list"></div>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC8uy09XOeEYIs1m3Rga5BMqd7gS7o3roI",
  authDomain: "beyhome-admin.firebaseapp.com",
  projectId: "beyhome-admin",
  storageBucket: "beyhome-admin.firebasestorage.app",
  messagingSenderId: "849320781553",
  appId: "1:849320781553:web:9d844044e85995c0aa2b50"
};
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxjQmrW5PFpdq_5P4XkYZvsXxxAwgHaTl1weS1u1eML_R8nKpMXSP6U-IDGDsazUg-duw/exec';

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
const storage = firebase.storage();

const MAX_FILE_MB = 10;
const MAX_FILE_BYTES = MAX_FILE_MB * 1024 * 1024;

const FORM_ID = new URLSearchParams(location.search).get('id') || '';
let formConfig = null;
let ctxProjectId = '';
let ctxUserId = '';
let ctxUserFields = {};
let ctxReceived = false;
let editingResponseId = null;
let _prevScreen = 'form';
const _histCache = {};
const _fileState = {}; // fid -> { existing: [url,...], news: [File,...] }
const _IMG_EXTS = new Set(['jpg','jpeg','png','gif','webp','heic','heif','bmp','svg']);
let resolveCtx;
const ctxPromise = new Promise(res => { resolveCtx = res; });

window.addEventListener('message', e => {
  if (e.data?.type !== 'lmp-context') return;
  ctxProjectId = e.data.projectId || '';
  ctxUserId = e.data.userId || '';
  ctxUserFields = e.data.userFields || {};
  if (e.data.blockBg) { document.documentElement.style.setProperty('--lmp-block-bg', e.data.blockBg); document.documentElement.style.setProperty('--lmp-input-bg', e.data.blockBg); }
  if (e.data.blockBgImage) { const _f=e.data.blockBgFit||'cover',_p=e.data.blockBgPos||'center'; document.body.style.backgroundImage=`url('${e.data.blockBgImage}')`; document.body.style.backgroundSize=_f==='natural'?'contain':_f; document.body.style.backgroundPosition=_p; document.body.style.backgroundRepeat='no-repeat'; }
  if (!ctxReceived) { ctxReceived = true; resolveCtx(); }
});

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderField(f) {
  const fid = f.key || f.id;
  const req = f.required ? '<span class="ff-required">*</span>' : '';
  const desc = f.description ? `<div class="ff-desc">${f.description}</div>` : '';
  const ph = esc(f.placeholder || '');
  const type = f.type;
  if (type === 'text' || type === 'string') {
    const hasLimit = f.minChars > 0 || f.maxChars > 0;
    const maxAttr  = f.maxChars > 0 ? ` maxlength="${f.maxChars}"` : '';
    const cntId    = `ff-cnt-${fid}`;
    const oninput  = hasLimit ? ` oninput="updateCharCount(this,'${cntId}',${f.minChars||0},${f.maxChars||0})"` : '';
    const counter  = hasLimit ? `<div class="ff-char-count" id="${cntId}">0${f.maxChars > 0 ? ` / ${f.maxChars}자` : '자'}</div>` : '';
    return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}<input class="ff-inp" id="ff-${fid}" type="text" placeholder="${ph}"${maxAttr}${oninput}>${counter}</div>`;
  }
  if (type === 'textarea') {
    const hasLimit = f.minChars > 0 || f.maxChars > 0;
    const maxAttr  = f.maxChars > 0 ? ` maxlength="${f.maxChars}"` : '';
    const cntId    = `ff-cnt-${fid}`;
    const oninput  = hasLimit ? ` oninput="updateCharCount(this,'${cntId}',${f.minChars||0},${f.maxChars||0})"` : '';
    const counter  = hasLimit ? `<div class="ff-char-count" id="${cntId}">0${f.maxChars > 0 ? ` / ${f.maxChars}자` : '자'}</div>` : '';
    return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}<textarea class="ff-textarea" id="ff-${fid}" placeholder="${ph}"${maxAttr}${oninput}></textarea>${counter}</div>`;
  }
  if (type === 'number') {
    return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}<input class="ff-inp" id="ff-${fid}" type="number" placeholder="${ph}"></div>`;
  }
  if (type === 'color') {
    return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}<div class="ff-color-wrap" id="ff-${fid}-wrap" data-picked="0"><label class="ff-color-label"><span class="ff-color-ph">🎨 색상 선택</span><span class="ff-color-preview"><span class="ff-color-swatch" id="ff-${fid}-swatch"></span><span class="ff-color-hex" id="ff-${fid}-hex"></span></span><input class="ff-color-inp" id="ff-${fid}" type="color" oninput="onColorPick('${fid}',this.value)"></label></div></div>`;
  }
  if (type === 'file') {
    const accept = esc(f.accept || '');
    const acceptAttr = accept ? ` accept="${accept}"` : '';
    const maxFiles = f.maxFiles ? parseInt(f.maxFiles) : 0;
    const maxTotalMB = f.maxTotalMB ? parseFloat(f.maxTotalMB) : 0;
    const limitNote = [
      `파일당 최대 ${MAX_FILE_MB}MB`,
      maxFiles ? `최대 ${maxFiles}개` : '',
      maxTotalMB ? `전체 ${maxTotalMB}MB 이내` : '',
    ].filter(Boolean).join(' · ');
    return `<div class="ff-wrap">
      <label class="ff-label">${esc(f.label)}${req}</label>${desc}
      <div class="ff-thumbs-wrap" id="ff-${fid}-thumbs"></div>
      <label class="ff-file-add-label">＋ 파일 추가<input type="file" id="ff-${fid}"${acceptAttr} multiple onchange="_onFileAdd('${fid}',${maxFiles},${maxTotalMB},this)"></label>
      <div class="ff-file-progress" id="ff-${fid}-progress"><div class="ff-file-progress-bar" id="ff-${fid}-bar"></div></div>
      <div class="ff-file-size-note">${limitNote}</div>
    </div>`;
  }
  if (type === 'date') {
    const pickMode = f.datePickMode||'single';
    if(pickMode==='single' && f.dateMode==='datetime'){
      const minAttr = f.dateMin ? ` min="${f.dateMin}"` : '';
      const maxAttr = f.dateMax ? ` max="${f.dateMax}"` : '';
      return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}<input class="ff-inp" id="ff-${fid}" type="datetime-local"${minAttr}${maxAttr}></div>`;
    }
    // 달력 위젯 (single/range/multi, 날짜만 모드)
    const calHtml = _calHtml(fid);
    setTimeout(()=>_calInit(fid,{mode:pickMode,dateMin:f.dateMin||'',dateMax:f.dateMax||'',maxDays:f.dateMaxDays||0}),0);
    return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}${calHtml}</div>`;
  }
  if (type === 'select') {
    const mode = f.selectMode || 'dropdown';
    const opts = f.options || [];
    if (mode === 'buttons') {
      const max = f.maxSelect || 99;
      const btns = opts.map(o => `<button type="button" class="ff-sel-btn" data-value="${esc(o)}" onclick="toggleSelBtn(this,'${fid}',${max})">${esc(o)}</button>`).join('');
      const otherBtn = f.allowOther ? `<button type="button" class="ff-sel-btn" data-value="__other__" onclick="toggleSelBtn(this,'${fid}',${max})">기타</button>` : '';
      const otherInp = f.allowOther ? `<input class="ff-inp" id="ff-${fid}-other" placeholder="기타 입력" style="display:none;margin-top:6px;">` : '';
      return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}<div class="ff-sel-btns" id="ff-${fid}">${btns}${otherBtn}</div>${otherInp}</div>`;
    }
    const optHtml = opts.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
    const otherOpt = f.allowOther ? `<option value="__other__">기타</option>` : '';
    const otherInp = f.allowOther ? `<input class="ff-inp" id="ff-${fid}-other" placeholder="기타 입력" style="display:none;margin-top:6px;">` : '';
    return `<div class="ff-wrap"><label class="ff-label">${esc(f.label)}${req}</label>${desc}<select class="ff-sel" id="ff-${fid}" onchange="onSelChange('${fid}',${!!f.allowOther})"><option value="">선택해주세요</option>${optHtml}${otherOpt}</select>${otherInp}</div>`;
  }
  return '';
}

function updateCharCount(inp, cntId, minChars, maxChars) {
  const len = inp.value.length;
  const el = document.getElementById(cntId);
  if (!el) return;
  if (maxChars > 0) {
    el.textContent = `${len} / ${maxChars}자`;
    el.classList.toggle('warn', len >= maxChars);
  } else {
    const ok = minChars > 0 && len >= minChars;
    el.textContent = ok ? `${len}자` : `${len}자 (최소 ${minChars}자)`;
    el.classList.toggle('warn', false);
  }
}

function toggleSelBtn(btn, key, maxSelect) {
  const container = document.getElementById('ff-' + key);
  if (!container) return;
  const isOn = btn.classList.contains('on');
  const selected = container.querySelectorAll('.ff-sel-btn.on');
  if (!isOn && selected.length >= maxSelect) selected[0].classList.remove('on');
  btn.classList.toggle('on');
  const oth = document.getElementById('ff-' + key + '-other');
  if (oth) {
    const ob = container.querySelector('[data-value="__other__"]');
    oth.style.display = ob?.classList.contains('on') ? '' : 'none';
  }
}

function onSelChange(key, allowOther) {
  const sel = document.getElementById('ff-' + key);
  const oth = document.getElementById('ff-' + key + '-other');
  if (oth) oth.style.display = (sel && sel.value === '__other__') ? '' : 'none';
}

function showErr(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('err-screen');
  el.textContent = msg;
  el.classList.add('on');
}

function _fsGet(fid) {
  if (!_fileState[fid]) _fileState[fid] = { existing: [], news: [] };
  return _fileState[fid];
}

function _getFileNameFromUrl(url) {
  try {
    const pathPart = url.split('/o/')[1];
    if (pathPart) return decodeURIComponent(pathPart.split('?')[0]).split('/').pop();
  } catch(e) {}
  return url.slice(0, 30) + '…';
}

function _renderFileThumbs(fid) {
  const wrap = document.getElementById('ff-' + fid + '-thumbs');
  if (!wrap) return;
  const state = _fsGet(fid);
  const thumbs = [];
  state.existing.forEach((url, i) => {
    const name = _getFileNameFromUrl(url);
    const ext = (name.split('.').pop() || '').toLowerCase();
    const inner = _IMG_EXTS.has(ext)
      ? `<img src="${esc(url)}" class="ff-thumb-img">`
      : `<div class="ff-thumb-badge">📄<span>${esc(name)}</span></div>`;
    thumbs.push(`<div class="ff-thumb">${inner}<button type="button" class="ff-thumb-del" onclick="_removeExisting('${fid}',${i})" title="삭제">✕</button></div>`);
  });
  state.news.forEach((file, i) => {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const inner = _IMG_EXTS.has(ext)
      ? `<img src="${URL.createObjectURL(file)}" class="ff-thumb-img" style="border:2px solid #000;">`
      : `<div class="ff-thumb-badge" style="border-color:#000;">📄<span>${esc(file.name)}</span></div>`;
    thumbs.push(`<div class="ff-thumb">${inner}<button type="button" class="ff-thumb-del" onclick="_removeNew('${fid}',${i})" title="삭제">✕</button></div>`);
  });
  wrap.innerHTML = thumbs.join('');
}

function _removeExisting(fid, index) {
  _fsGet(fid).existing.splice(index, 1);
  _renderFileThumbs(fid);
}

function _removeNew(fid, index) {
  _fsGet(fid).news.splice(index, 1);
  _renderFileThumbs(fid);
}

function _onFileAdd(fid, maxFiles, maxTotalMB, inp) {
  if (!inp || !inp.files.length) return;
  const state = _fsGet(fid);
  const newFiles = Array.from(inp.files);
  inp.value = '';
  const oversized = newFiles.filter(f => f.size > MAX_FILE_BYTES);
  if (oversized.length) {
    alert(`파일이 너무 커요. 파일당 최대 ${MAX_FILE_MB}MB까지 업로드할 수 있어요.\n${oversized.map(f => `• ${f.name} (${(f.size/1024/1024).toFixed(1)}MB)`).join('\n')}`);
    return;
  }
  const totalCount = state.existing.length + state.news.length + newFiles.length;
  if (maxFiles && totalCount > maxFiles) {
    alert(`파일은 최대 ${maxFiles}개까지 선택할 수 있어요.`);
    return;
  }
  if (maxTotalMB) {
    const totalMB = (state.news.reduce((s, f) => s + f.size, 0) + newFiles.reduce((s, f) => s + f.size, 0)) / 1024 / 1024;
    if (totalMB > maxTotalMB) {
      alert(`전체 파일 용량이 너무 커요. ${maxTotalMB}MB 이내로 선택해주세요. (현재 ${totalMB.toFixed(1)}MB)`);
      return;
    }
  }
  state.news.push(...newFiles);
  _renderFileThumbs(fid);
}

function onColorPick(fid, val) {
  const wrap = document.getElementById('ff-' + fid + '-wrap');
  if (wrap) wrap.dataset.picked = '1';
  const hex = document.getElementById('ff-' + fid + '-hex');
  if (hex) hex.textContent = val.toUpperCase();
  const swatch = document.getElementById('ff-' + fid + '-swatch');
  if (swatch) swatch.style.background = val;
}
function applyVars(str) {
  if (!str) return '';
  return str.replace(/\{\{(\w+)\}\}/g, (_, key) => {
    const v = ctxUserFields[key];
    return v != null ? String(v) : '{{' + key + '}}';
  });
}

function showDone(html, showHistLink) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('form-screen').classList.add('off');
  document.getElementById('done-msg').innerHTML = applyVars(html) || '제출이 완료됐어요!';
  document.getElementById('done-screen').classList.add('on');
  if (showHistLink && formConfig?.allowEdit) document.getElementById('done-history-link').style.display = '';
}

async function checkAlreadySubmitted() {
  // noResubmit=true + 인증 프로젝트(projectId+userId 모두 있음): Firestore 조회
  if (ctxProjectId && ctxUserId) {
    try {
      const userDoc = await db.collection('cms_users_' + ctxProjectId).doc(ctxUserId).get();
      const subKey = 'formSubmitted_' + FORM_ID;
      if (userDoc.exists && userDoc.data()[subKey]) return true;
    } catch(e) {}
    return false;
  }
  // 비인증 프로젝트: 사용자 식별 불가이므로 항상 false (재제출 허용)
  return false;
}

async function init() {
  if (!FORM_ID) { showErr('폼 ID가 없습니다.'); return; }

  try {
    const snap = await db.collection('cms_form_configs').doc(FORM_ID).get();
    if (!snap.exists) { showErr('폼을 찾을 수 없습니다.'); return; }
    formConfig = snap.data();

    // noResubmit인 경우 context 대기 (최대 600ms, 보통 이미 도착해 있음)
    if (formConfig.noResubmit && !ctxReceived) {
      await Promise.race([ctxPromise, new Promise(res => setTimeout(res, 600))]);
    }
    // allowEdit인 경우 이전 제출 내역 링크를 위해 context 대기 (최대 300ms)
    if (formConfig.allowEdit && !ctxReceived) {
      await Promise.race([ctxPromise, new Promise(res => setTimeout(res, 300))]);
    }

    if (formConfig.noResubmit) {
      const alreadyDone = await checkAlreadySubmitted();
      if (alreadyDone) {
        showDone(formConfig.submitMsg || '이미 제출하셨습니다.', !!ctxUserId);
        window.parent.postMessage({ type: 'lmp-tool-complete' }, '*');
        return;
      }
    }

    const titleEl = document.getElementById('form-title');
    titleEl.textContent = applyVars(formConfig.title || '');
    const descEl = document.getElementById('form-desc');
    if (formConfig.desc) {
      descEl.innerHTML = applyVars(formConfig.desc);
      descEl.style.display = '';
      titleEl.style.marginBottom = '6px';
    } else {
      titleEl.style.marginBottom = '24px';
    }
    const fields = (formConfig.fields || []).sort((a, b) => (a.order || 0) - (b.order || 0));
    document.getElementById('form-fields').innerHTML = fields.map(renderField).join('');
    const submitBtn = document.getElementById('submit-btn');
    if (submitBtn) submitBtn.textContent = applyVars(formConfig.submitBtnText || '제출하기');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';

    // 응답 수정 허용인 경우 이전 제출 내역 링크 표시
    if (formConfig.allowEdit && ctxUserId) {
      try {
        const prevSnap = await db.collection('cms_form_responses').doc(FORM_ID).collection('responses')
          .where('_userId', '==', ctxUserId).limit(1).get();
        if (!prevSnap.empty) document.getElementById('history-link').style.display = '';
      } catch(e) {}
    }
  } catch(e) {
    console.error('[form init]', e);
    showErr('폼 로드에 실패했어요. 다시 시도해주세요.');
  }
}

async function submitForm() {
  if (!formConfig) return;
  const fields = (formConfig.fields || []).sort((a, b) => (a.order || 0) - (b.order || 0));
  const result = {};
  const errEl = document.getElementById('form-err');
  errEl.textContent = '';

  for (const f of fields) {
    const fid = f.key || f.id;
    let val;
    if (f.type === 'select' && f.selectMode === 'buttons') {
      const c = document.getElementById('ff-' + fid);
      const sel = [...(c?.querySelectorAll('.ff-sel-btn.on') || [])].map(b =>
        b.dataset.value === '__other__' ? (document.getElementById('ff-' + fid + '-other')?.value.trim() || '기타') : b.dataset.value
      );
      if (f.required && (!sel.length || (f.minSelect && sel.length < f.minSelect))) {
        errEl.textContent = f.label + '을(를) 선택해주세요.'; return;
      }
      val = sel.length === 1 ? sel[0] : sel;
    } else if (f.type === 'select') {
      const s = document.getElementById('ff-' + fid);
      val = s ? s.value : '';
      if (val === '__other__') { const oi = document.getElementById('ff-' + fid + '-other'); val = oi?.value.trim() || '기타'; }
      if (f.required && !val) { errEl.textContent = f.label + '을(를) 선택해주세요.'; return; }
    } else if (f.type === 'color') {
      const wrap = document.getElementById('ff-' + fid + '-wrap');
      const picked = wrap?.dataset.picked === '1';
      if (f.required && !picked) { errEl.textContent = f.label + ' 색상을 선택해주세요.'; return; }
      const inp = document.getElementById('ff-' + fid);
      val = picked && inp ? inp.value.toUpperCase() : '';
    } else if (f.type === 'file') {
      const state = _fsGet(fid);
      if (!state.existing.length && !state.news.length) {
        if (f.required) { errEl.textContent = f.label + ' 파일을 선택해주세요.'; return; }
        val = null;
      } else if (!state.news.length) {
        val = state.existing.length === 1 ? state.existing[0] : [...state.existing];
      } else {
        val = state.news; // File objects — uploaded below, then combined with existing
      }
    } else {
      const inp = document.getElementById('ff-' + fid);
      val = inp ? inp.value.trim() : '';
      if (f.type === 'number') {
        if (val !== '' && isNaN(Number(val))) { errEl.textContent = f.label + '에 숫자만 입력할 수 있어요.'; inp?.focus(); return; }
        val = val === '' ? null : Number(val);
      }
      if (f.required && (val === '' || val === null || val === undefined)) {
        errEl.textContent = f.label + '을(를) 입력해주세요.'; return;
      }
      if ((f.type === 'string' || f.type === 'text' || f.type === 'textarea') && typeof val === 'string') {
        if (f.minChars > 0 && val.length < f.minChars) {
          errEl.textContent = `'${f.label}': 최소 ${f.minChars}자 이상 입력해주세요. (현재 ${val.length}자)`; inp?.focus(); return;
        }
        if (f.maxChars > 0 && val.length > f.maxChars) {
          errEl.textContent = `'${f.label}': 최대 ${f.maxChars}자까지 입력 가능해요. (현재 ${val.length}자)`; inp?.focus(); return;
        }
      }
    }
    result[fid] = val;
  }

  const btn = document.getElementById('submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = '제출 중…'; }

  try {
    // 파일 필드 Storage 업로드 (새 파일 객체인 경우만)
    const fileFields = fields.filter(f => f.type === 'file' && Array.isArray(result[f.key || f.id]) && result[f.key || f.id].length && result[f.key || f.id][0] instanceof File);
    if (fileFields.length) {
      const totalFiles = fileFields.reduce((s, f) => s + result[f.key || f.id].length, 0);
      let totalDone = 0;
      if (btn) btn.textContent = `파일 업로드 중… (0 / ${totalFiles})`;
      const uploadTimestamp = Date.now();
      for (const f of fileFields) {
        const fid = f.key || f.id;
        const files = result[fid];
        const progressBar = document.getElementById('ff-' + fid + '-bar');
        const progressWrap = document.getElementById('ff-' + fid + '-progress');
        if (progressWrap) progressWrap.style.display = '';
        let doneCount = 0;
        const uploadPromises = files.map((file, i) => {
          const safeName = file.name.replace(/[^a-zA-Z0-9가-힣._-]/g, '_');
          const path = `form_uploads/${FORM_ID}/${uploadTimestamp}_${i > 0 ? i + '_' : ''}${safeName}`;
          const ref = storage.ref(path);
          const task = ref.put(file);
          return new Promise((resolve, reject) => {
            task.on('state_changed', null, reject, async () => {
              doneCount++;
              totalDone++;
              if (progressBar) progressBar.style.width = Math.round(doneCount / files.length * 100) + '%';
              if (btn) btn.textContent = `파일 업로드 중… (${totalDone} / ${totalFiles})`;
              try { resolve(await ref.getDownloadURL()); } catch(e) { reject(e); }
            });
          });
        });
        const results = await Promise.allSettled(uploadPromises);
        const newUrls = results.filter(r => r.status === 'fulfilled').map(r => r.value);
        const failCount = results.filter(r => r.status === 'rejected').length;
        if (failCount > 0 && newUrls.length === 0) throw new Error(`파일 업로드에 실패했어요. (${failCount}개)`);
        if (failCount > 0) console.warn(`파일 ${failCount}개 업로드 실패 (${newUrls.length}개는 성공)`);
        const allUrls = [..._fsGet(fid).existing, ...newUrls];
        result[fid] = allUrls.length === 1 ? allUrls[0] : allUrls;
      }
      if (btn) btn.textContent = '제출 중…';
    }

    const ts = new Date().toLocaleString('ko-KR');
    const headers = ['제출일시', ...fields.map(f => f.label), '_응답ID'];
    const vals = fields.map(f => { const v = result[f.key || f.id]; return Array.isArray(v) ? v.join(', ') : (v ?? ''); });
    let responseId;

    if (editingResponseId) {
      // 수정 모드: 기존 응답 업데이트
      const updateData = {
        ...result,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        projectId: ctxProjectId || '',
      };
      if (ctxUserFields && Object.keys(ctxUserFields).length) updateData._userFields = ctxUserFields;
      await db.collection('cms_form_responses').doc(FORM_ID).collection('responses').doc(editingResponseId).update(updateData);
      responseId = editingResponseId;

      if (formConfig.sheetId) {
        try {
          await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'updateFormRow', sheetId: formConfig.sheetId, sheetTab: formConfig.sheetTab || '응답', responseId, headers, row: [ts, ...vals, responseId] })
          });
        } catch(e) {}
      }
      editingResponseId = null;
      document.getElementById('edit-mode-banner').style.display = 'none';
      showDone('수정이 완료됐어요!', !!ctxUserId);
    } else {
      // 신규 제출
      const docData = {
        ...result,
        submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
        projectId: ctxProjectId || '',
      };
      if (ctxUserId) docData._userId = ctxUserId;
      if (ctxUserFields && Object.keys(ctxUserFields).length) docData._userFields = ctxUserFields;
      const docRef = await db.collection('cms_form_responses').doc(FORM_ID).collection('responses').add(docData);
      responseId = docRef.id;

      // 인증 프로젝트에서 noResubmit이면 사용자 doc에 제출 완료 기록
      if (formConfig.noResubmit && ctxProjectId && ctxUserId) {
        const subKey = 'formSubmitted_' + FORM_ID;
        db.collection('cms_users_' + ctxProjectId).doc(ctxUserId)
          .update({ [subKey]: true }).catch(() => {});
      }

      if (formConfig.sheetId) {
        try {
          await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'submitForm', sheetId: formConfig.sheetId, sheetTab: formConfig.sheetTab || '응답', headers, row: [ts, ...vals, responseId] })
          });
        } catch(e) {}
      }

      // 응답 수정 허용인 경우 이전 제출 내역 링크 표시
      if (formConfig.allowEdit && ctxUserId) {
        document.getElementById('history-link').style.display = '';
      }

      window.parent.postMessage({ type: 'lmp-tool-complete' }, '*');
      showDone(formConfig.submitMsg || '제출이 완료됐어요!', !!ctxUserId);
    }
  } catch(e) {
    console.error('[submitForm]', e);
    if (btn) {
      btn.disabled = false;
      btn.textContent = editingResponseId ? '수정 완료' : applyVars(formConfig.submitBtnText || '제출하기');
    }
    const msg = e?.code === 'permission-denied' ? '저장 권한이 없어요. 관리자에게 문의해주세요.' : (editingResponseId ? '수정에 실패했어요. 다시 시도해주세요.' : '제출에 실패했어요. 다시 시도해주세요.');
    errEl.textContent = msg;
  }
}

function _renderFileVal(val) {
  const urls = Array.isArray(val) ? val : (val ? [val] : []);
  if (!urls.length) return '';
  const thumbs = urls.map(url => {
    if (typeof url !== 'string') return '';
    const name = _getFileNameFromUrl(url);
    const ext = (name.split('.').pop() || '').toLowerCase();
    if (_IMG_EXTS.has(ext)) {
      return `<div class="ff-thumb"><img src="${esc(url)}" class="ff-thumb-img"></div>`;
    }
    return `<div class="ff-thumb"><div class="ff-thumb-badge">📄<span>${esc(name)}</span></div></div>`;
  }).filter(Boolean).join('');
  return `<div class="ff-thumbs-wrap" style="margin-bottom:0;">${thumbs}</div>`;
}

async function showHistory() {
  if (!ctxUserId) return;
  _prevScreen = document.getElementById('done-screen').classList.contains('on') ? 'done' : 'form';
  document.getElementById('form-screen').classList.add('off');
  document.getElementById('done-screen').classList.remove('on');
  document.getElementById('history-screen').classList.add('on');
  const formTitle = formConfig.title || '폼';
  const userDisplay = Object.values(ctxUserFields)[0] || '';
  document.getElementById('history-title').textContent = userDisplay ? `${formTitle} — ${userDisplay} 제출내역` : `${formTitle} 제출내역`;
  document.getElementById('history-list').innerHTML = '<div style="text-align:center;padding:24px 0;font-size:13px;color:rgba(0,0,0,.5);">불러오는 중…</div>';
  try {
    const snap = await db.collection('cms_form_responses').doc(FORM_ID).collection('responses')
      .where('_userId', '==', ctxUserId).get();
    if (snap.empty) {
      document.getElementById('history-list').innerHTML = '<div style="text-align:center;padding:24px 0;font-size:13px;color:rgba(0,0,0,.5);">제출 내역이 없어요.</div>';
      return;
    }
    const fields = (formConfig.fields || []).sort((a, b) => (a.order || 0) - (b.order || 0));
    const docs = snap.docs.slice().sort((a, b) => (b.data().submittedAt?.toMillis?.() || 0) - (a.data().submittedAt?.toMillis?.() || 0));
    docs.forEach(doc => {
      const d = doc.data();
      _histCache[doc.id] = Object.fromEntries(fields.map(f => [f.key || f.id, d[f.key || f.id] ?? '']));
    });
    document.getElementById('history-list').innerHTML = docs.map(doc => {
      const d = doc.data();
      const ts = d.submittedAt?.toDate?.()?.toLocaleString('ko-KR') || d.updatedAt?.toDate?.()?.toLocaleString('ko-KR') || '';
      const label = d.updatedAt ? '수정일' : '제출일';
      const fieldsHtml = fields.map(f => {
        const key = f.key || f.id;
        const val = d[key];
        if (val == null || val === '') return '';
        let valHtml;
        if (f.type === 'file') {
          valHtml = _renderFileVal(val);
        } else {
          valHtml = esc(Array.isArray(val) ? val.join(', ') : String(val));
        }
        return `<div class="hist-field"><span class="hist-field-lbl">${esc(f.label)}: </span>${valHtml}</div>`;
      }).join('');
      return `<div class="hist-item">
        <div class="hist-ts">${ts ? label + ': ' + ts : ''}</div>
        ${fieldsHtml}
        ${formConfig.allowEdit ? `<button class="hist-edit-btn" onclick="editFromHistory('${doc.id}')">이 제출 내용 수정하기</button>` : ''}
      </div>`;
    }).join('');
  } catch(e) {
    console.error('[history]', e);
    document.getElementById('history-list').innerHTML = '<div style="text-align:center;padding:24px 0;font-size:13px;color:#c00;">불러오기 실패. 다시 시도해주세요.</div>';
  }
}

function backFromHistory() {
  document.getElementById('history-screen').classList.remove('on');
  if (_prevScreen === 'done') {
    document.getElementById('done-screen').classList.add('on');
  } else {
    document.getElementById('form-screen').classList.remove('off');
  }
}

function editFromHistory(responseId) {
  const data = _histCache[responseId] || {};
  editingResponseId = responseId;
  document.getElementById('history-screen').classList.remove('on');
  document.getElementById('done-screen').classList.remove('on');
  document.getElementById('form-screen').classList.remove('off');
  document.getElementById('edit-mode-banner').style.display = '';

  // noResubmit 폼은 init()에서 폼 필드를 렌더링하지 않으므로 여기서 렌더링
  const fieldsContainer = document.getElementById('form-fields');
  const fields = (formConfig.fields || []).sort((a, b) => (a.order || 0) - (b.order || 0));
  if (!fieldsContainer.children.length) {
    fieldsContainer.innerHTML = fields.map(renderField).join('');
    const titleEl = document.getElementById('form-title');
    titleEl.textContent = applyVars(formConfig.title || '');
    titleEl.style.marginBottom = formConfig.desc ? '6px' : '24px';
    if (formConfig.desc) {
      const descEl = document.getElementById('form-desc');
      descEl.innerHTML = applyVars(formConfig.desc);
      descEl.style.display = '';
    }
  }

  // 이전 값 채우기
  fields.forEach(f => {
    const fid = f.key || f.id;
    const val = data[fid];
    if (val == null) return;
    if (f.type === 'file') {
      const urls = Array.isArray(val) ? val : (val ? [val] : []);
      _fileState[fid] = { existing: urls.filter(u => typeof u === 'string'), news: [] };
      _renderFileThumbs(fid);
      return;
    }
    if (f.type === 'select' && f.selectMode === 'buttons') {
      const vals = Array.isArray(val) ? val : [val];
      document.getElementById('ff-' + fid)?.querySelectorAll('.ff-sel-btn').forEach(b => {
        b.classList.toggle('on', vals.includes(b.dataset.value));
      });
    } else {
      const el = document.getElementById('ff-' + fid);
      if (el && el.tagName !== 'DIV') el.value = val;
    }
  });

  // 버튼 활성화 (이전 제출 성공으로 disabled 됐을 수 있음)
  const submitBtn = document.getElementById('submit-btn');
  submitBtn.disabled = false;
  submitBtn.textContent = '수정 완료';

  document.getElementById('history-link').style.display = '';
  document.getElementById('history-link').querySelector('button').textContent = '수정 취소';
  document.getElementById('history-link').querySelector('button').onclick = cancelEdit;
}

function cancelEdit() {
  editingResponseId = null;
  (formConfig.fields || []).forEach(f => {
    if (f.type === 'file') {
      const fid = f.key || f.id;
      delete _fileState[fid];
      _renderFileThumbs(fid);
    }
  });
  document.getElementById('edit-mode-banner').style.display = 'none';
  const submitBtn = document.getElementById('submit-btn');
  submitBtn.textContent = applyVars(formConfig.submitBtnText || '제출하기');
  submitBtn.disabled = false;
  const histBtn = document.getElementById('history-link').querySelector('button');
  histBtn.textContent = '이전 제출 내역 확인';
  histBtn.onclick = showHistory;
  // 수정 취소 시 히스토리 화면으로 복귀 (빈 폼 노출 방지)
  document.getElementById('form-screen').classList.add('off');
  document.getElementById('history-screen').classList.add('on');
}

window.parent.postMessage({ type: 'lmp-ready' }, '*');
init();

// iframe 높이를 내용 크기에 맞게 부모에게 알림
function _sendHeight() {
  window.parent.postMessage({ type: 'lmp-resize', height: document.body.scrollHeight }, '*');
}
new ResizeObserver(_sendHeight).observe(document.body);

// ── 달력 위젯 ──────────────────────────────────────────────────────────
const _cals = {};
function _calISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function _calFromISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function _calDayDiff(a,b){ return Math.round((_calFromISO(b)-_calFromISO(a))/(864e5)); }

function _calInit(fid, opts){
  const today = _calFromISO(_calISO(new Date()));
  _cals[fid] = {
    mode: opts.mode||'single',
    dateMin: opts.dateMin||'',
    dateMax: opts.dateMax||'',
    maxDays: opts.maxDays||0,
    sel: [],
    year: today.getFullYear(),
    month: today.getMonth()
  };
  _calRender(fid);
}

function _calRender(fid){
  const s = _cals[fid]; if(!s) return;
  const ttl = document.getElementById('cal-ttl-'+fid);
  const grid = document.getElementById('cal-grid-'+fid);
  if(!ttl||!grid) return;
  ttl.textContent = `${s.year}년 ${s.month+1}월`;
  const first = new Date(s.year, s.month, 1).getDay();
  const total = new Date(s.year, s.month+1, 0).getDate();
  const todayISO = _calISO(new Date());
  let html = '';
  for(let i=0;i<first;i++) html+='<span class="cal-day"></span>';
  for(let d=1;d<=total;d++){
    const iso=`${s.year}-${String(s.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls='cal-day';
    const dow=new Date(s.year,s.month,d).getDay();
    if(dow===0) cls+=' cal-sun';
    if(dow===6) cls+=' cal-sat';
    if(iso===todayISO) cls+=' cal-today';
    let disabled=(s.dateMin&&iso<s.dateMin)||(s.dateMax&&iso>s.dateMax);
    if(!disabled && s.mode==='range' && s.sel.length===1 && s.maxDays>0){
      const diff=_calDayDiff(s.sel[0],iso);
      if(Math.abs(diff)>=s.maxDays) disabled=true;
    }
    if(disabled) cls+=' cal-dis';
    else {
      if(s.mode==='single' && s.sel.includes(iso)) cls+=' cal-sel';
      else if(s.mode==='range'){
        if(s.sel.length>=2){
          if(iso===s.sel[0]) cls+=' cal-range-start';
          else if(iso===s.sel[1]) cls+=' cal-range-end';
          else if(iso>s.sel[0]&&iso<s.sel[1]) cls+=' cal-range-in';
        } else if(s.sel.length===1 && iso===s.sel[0]) cls+=' cal-sel';
      } else if(s.mode==='multi' && s.sel.includes(iso)) cls+=' cal-sel';
    }
    const click=disabled?'':`onclick="_calClick('${fid}','${iso}')"`;
    html+=`<span class="${cls}" ${click}>${d}</span>`;
  }
  grid.innerHTML=html;
  _calUpdateInfo(fid);
}

function _calClick(fid, iso){
  const s=_cals[fid]; if(!s) return;
  if(s.mode==='single'){
    s.sel=[iso];
  } else if(s.mode==='range'){
    if(s.sel.length===0||s.sel.length===2){ s.sel=[iso]; }
    else {
      const st=s.sel[0];
      if(iso===st) s.sel=[];
      else if(iso<st) s.sel=[iso,st];
      else s.sel=[st,iso];
    }
  } else {
    const i=s.sel.indexOf(iso);
    if(i>=0) s.sel.splice(i,1); else s.sel.push(iso);
    s.sel.sort();
  }
  const inp=document.getElementById('ff-'+fid);
  if(inp){
    if(s.mode==='single') inp.value=s.sel[0]||'';
    else if(s.mode==='range') inp.value=s.sel.length===2?s.sel[0]+' ~ '+s.sel[1]:(s.sel[0]||'');
    else inp.value=s.sel.join(', ');
  }
  _calRender(fid);
}

function _calNav(fid,dir){
  const s=_cals[fid]; if(!s) return;
  s.month+=dir;
  if(s.month>11){s.month=0;s.year++;}
  if(s.month<0){s.month=11;s.year--;}
  _calRender(fid);
}

function _calUpdateInfo(fid){
  const s=_cals[fid];
  const el=document.getElementById('cal-info-'+fid); if(!el) return;
  if(!s.sel.length){ el.textContent='날짜를 선택해주세요'; return; }
  if(s.mode==='single') el.textContent=s.sel[0];
  else if(s.mode==='range'){
    if(s.sel.length===1) el.textContent=(s.maxDays>0?`종료일 선택 (최대 ${s.maxDays}일)`:'종료일을 선택해주세요');
    else { const days=_calDayDiff(s.sel[0],s.sel[1])+1; el.textContent=`${s.sel[0]} ~ ${s.sel[1]} (${days}일)`; }
  } else el.textContent=`${s.sel.length}개 날짜 선택됨`;
}

function _calHtml(fid){
  return `<div class="cal-w" id="cal-${fid}">
    <div class="cal-hd">
      <button class="cal-nav" type="button" onclick="_calNav('${fid}',-1)">‹</button>
      <span class="cal-ttl" id="cal-ttl-${fid}"></span>
      <button class="cal-nav" type="button" onclick="_calNav('${fid}',1)">›</button>
    </div>
    <div class="cal-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="cal-grid" id="cal-grid-${fid}"></div>
    <div class="cal-info" id="cal-info-${fid}"></div>
    <input type="hidden" id="ff-${fid}" value="">
  </div>`;
}
</script>
</body>
