<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>방명록</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
:root{--lmp-block-bg:#fff;--lmp-input-bg:transparent;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:transparent;overflow-y:auto;-webkit-overflow-scrolling:touch;color:#000;}

#loading{padding:60px 20px;text-align:center;font-size:14px;color:rgba(0,0,0,.5);}
#err-screen{display:none;padding:40px 20px;text-align:center;font-size:14px;color:#c00;font-weight:700;}
#err-screen.on{display:block;}
#app{display:none;padding-bottom:20px;}
#app.on{display:block;}

/* Gallery header */
.gallery-top{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;}
.cards-count{font-size:12px;font-weight:700;color:rgba(0,0,0,.45);}
.write-fab{background:#000;color:#fff;border:none;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.2px;white-space:nowrap;}
.write-fab:active{opacity:.8;}

/* Scroll grid */
.cards-grid{padding:0 16px;display:flex;flex-direction:column;gap:16px;}
.cards-grid.two-col{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.cards-empty{padding:40px 20px;text-align:center;font-size:14px;color:rgba(0,0,0,.4);font-weight:600;line-height:1.7;}
.load-more-btn{display:block;width:calc(100% - 32px);margin:16px auto 0;padding:12px;background:#fff;border:2px solid #000;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.load-more-btn:active{background:#000;color:#fff;}
#scroll-sentinel{height:1px;}

/* Slide */
.slide-outer{overflow:hidden;}
.slide-track{display:flex;transition:transform .35s ease;will-change:transform;}
.slide-item{flex:0 0 100%;padding:0 16px;box-sizing:border-box;}
.slide-ctrl{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px 0;}
.slide-dots{display:flex;gap:6px;align-items:center;}
.slide-dot{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.2);cursor:pointer;border:none;padding:0;transition:background .2s;}
.slide-dot.on{background:#000;}
.slide-fraction{font-size:12px;font-weight:700;color:rgba(0,0,0,.5);}
.slide-arrow{background:none;border:2px solid #000;width:32px;height:32px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:900;line-height:1;flex-shrink:0;}
.slide-arrow:active{background:#000;color:#fff;}

/* Cards */
.gb-card{border:2px solid #000;overflow:hidden;cursor:pointer;position:relative;transition:opacity .12s;}
.gb-card:active{opacity:.8;}
.gb-card .card-img-wrap{width:100%;aspect-ratio:4/3;overflow:hidden;background:#e8e8e8;}
.gb-card .card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.gb-card .card-body{padding:16px;}
.gb-card.has-img-bg{min-height:160px;}
.gb-card .card-overlay{position:absolute;inset:0;pointer-events:none;}
.card-field{margin-bottom:9px;}
.card-field:last-of-type{margin-bottom:0;}
.card-field-val{font-size:14px;font-weight:600;line-height:1.55;word-break:break-word;}
.card-meta{font-size:10px;color:rgba(0,0,0,.35);margin-top:10px;font-weight:600;}
/* Gallery & slide cards — uniform height with ellipsis */
.cards-grid .gb-card,.slide-item .gb-card{height:var(--gallery-card-h,160px);}
.cards-grid .card-field-val,.slide-item .card-field-val{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}

/* Write Modal — full screen */
#write-modal{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;background:#fff;}
#write-modal.on{display:flex;}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px solid #000;flex-shrink:0;}
.modal-back{background:none;border:2px solid #000;width:32px;height:32px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:900;line-height:1;flex-shrink:0;}
.modal-back:active{background:#000;color:#fff;}
.modal-title{font-size:15px;font-weight:800;flex:1;}
.modal-body{overflow-y:auto;flex:1;padding:16px;}

/* Form elements */
.ff-wrap{margin-bottom:22px;}
.ff-label{display:block;font-size:14px;font-weight:700;margin-bottom:7px;line-height:1.4;}
.ff-req{color:#c00;}
.ff-inp,.ff-textarea{width:100%;border:2px solid #000;border-radius:0;padding:12px 14px;font-size:15px;font-family:inherit;background:var(--lmp-input-bg);color:#000;outline:none;-webkit-appearance:none;appearance:none;}
.ff-textarea{min-height:90px;resize:vertical;}
.ff-inp:focus,.ff-textarea:focus{box-shadow:0 0 0 3px rgba(0,0,0,.08);}
.img-upload-area{border:2px dashed rgba(0,0,0,.3);padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s;background:rgba(0,0,0,.02);}
.img-upload-area:hover{border-color:#000;}
.img-upload-area.has-img{border-style:solid;border-color:#000;padding:12px;}
.img-upload-preview{width:100%;max-height:220px;object-fit:contain;display:block;margin-bottom:8px;}
.img-upload-icon{font-size:28px;margin-bottom:8px;}
.img-upload-label{font-size:13px;color:rgba(0,0,0,.55);font-weight:600;}
.img-upload-hint{font-size:11px;color:rgba(0,0,0,.4);margin-top:4px;}
.img-prog-wrap{height:4px;background:rgba(0,0,0,.1);margin-top:8px;display:none;}
.img-prog-bar{height:100%;background:#000;transition:width .2s;width:0%;}
.color-swatches-wrap{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
.color-swatch{width:44px;height:44px;border:2px solid #000;cursor:pointer;position:relative;transition:transform .1s;outline:none;}
.color-swatch.selected{outline:3px solid #000;outline-offset:3px;}
.color-swatch.selected::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.9);}
.color-swatch:hover{transform:scale(1.1);}
.lmp-btn{display:block;width:100%;padding:14px 18px;background:#000;color:var(--lmp-block-bg);border:2px solid #000;border-radius:0;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.2px;transition:background .15s,color .15s;}
.lmp-btn:hover,.lmp-btn:active{background:var(--lmp-block-bg);color:#000;}
.lmp-btn:disabled{opacity:.35;cursor:default;}
.ff-err{color:#c00;font-size:13px;font-weight:700;margin-bottom:12px;min-height:16px;}
#done-banner{display:none;background:#000;color:#fff;padding:14px 16px;font-size:14px;font-weight:700;text-align:center;margin-bottom:20px;}
#done-banner.on{display:block;}


/* Live preview card */
#write-preview-wrap{margin-bottom:22px;display:none;}
#write-preview-wrap .preview-label{font-size:12px;font-weight:700;color:rgba(0,0,0,.45);margin-bottom:8px;}
#preview-card{border:2px solid #000;overflow:hidden;min-height:120px;position:relative;}
#preview-card .card-overlay{position:absolute;inset:0;pointer-events:none;}
#preview-card .card-body{padding:14px;position:relative;z-index:1;}
#preview-card .card-field-val{font-size:13px;font-weight:600;line-height:1.5;}

/* Detail Lightbox */
#detail-modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:24px;}
#detail-modal.on{display:flex;}
#detail-card{width:100%;max-height:72vh;overflow-y:auto;border:2px solid #000;background:#fff;}
#detail-card .gb-lightbox-img{width:100%;display:block;}
#detail-card .gb-lightbox-img-bg{width:100%;aspect-ratio:4/5;min-height:0;background-size:cover;background-repeat:no-repeat;position:relative;}
#detail-card .gb-lightbox-img-bg .card-overlay{position:absolute;inset:0;}
#detail-card .gb-lightbox-img-bg .gb-lightbox-body{position:relative;z-index:1;padding:20px 16px;}
#detail-card .gb-lightbox-body{padding:16px;}
#detail-card .card-field{margin-bottom:9px;}
#detail-card .card-field:last-of-type{margin-bottom:0;}
#detail-card .card-field-val{font-size:14px;font-weight:600;line-height:1.6;word-break:break-word;white-space:pre-wrap;}
#detail-card .card-meta{font-size:10px;color:rgba(0,0,0,.35);margin-top:10px;font-weight:600;}
.dm-del-btn{margin-top:14px;width:100%;padding:10px;border:2px solid #c00;background:#fff;color:#c00;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}

@keyframes spin{to{transform:rotate(360deg);}}
.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,.15);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px;}
</style>
</head>
<body>
<div id="loading">불러오는 중…</div>
<div id="err-screen"></div>

<div id="app">
  <div class="gallery-top">
    <span class="cards-count" id="cards-count"></span>
    <button class="write-fab" id="write-btn" onclick="openWriteModal()">남기기</button>
  </div>

  <!-- Scroll view -->
  <div id="scroll-view">
    <div class="cards-grid" id="cards-grid"></div>
    <div id="load-more-wrap" style="display:none;padding:0 0 16px;">
      <button class="load-more-btn" onclick="loadMoreCards()">더 보기</button>
    </div>
    <div id="scroll-sentinel"></div>
  </div>

  <!-- Slide view -->
  <div id="slide-view" style="display:none;">
    <div class="slide-outer">
      <div class="slide-track" id="slide-track"></div>
    </div>
    <div class="slide-ctrl">
      <button class="slide-arrow" onclick="slidePrev()">‹</button>
      <div id="slide-pager"></div>
      <button class="slide-arrow" onclick="slideNext()">›</button>
    </div>
  </div>
</div>

<!-- Write Modal -->
<div id="write-modal">
  <div class="modal-head">
    <button class="modal-back" onclick="closeWriteModal()">‹</button>
    <span class="modal-title" id="modal-title">남기기</span>
  </div>
  <div class="modal-body">
    <div id="done-banner">✅ 등록됐어요!</div>
    <div id="write-fields-wrap"></div>
    <div id="anon-row" class="ff-wrap" style="display:none;">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:600;">
        <input type="checkbox" id="anon-check" style="width:18px;height:18px;"> 익명으로 남기기
      </label>
    </div>

    <!-- 배경 이미지 섹션 (bgImageEnabled 일 때만 표시) -->
    <div id="bg-image-section" class="ff-wrap" style="display:none;">
      <label class="ff-label">배경 이미지 <span style="font-weight:400;opacity:.55;">(선택)</span></label>
      <div class="img-upload-area" id="bg-img-area" onclick="document.getElementById('bg-img-file').click()">
        <img id="bg-img-prev" class="img-upload-preview" style="display:none;" alt="">
        <div id="bg-img-icon" class="img-upload-icon">🖼</div>
        <div id="bg-img-lbl" class="img-upload-label">사진을 탭해서 선택하세요</div>
        <div class="img-upload-hint">JPG, PNG 이미지 파일</div>
      </div>
      <div class="img-prog-wrap" id="bg-img-prog"><div class="img-prog-bar" id="bg-img-bar"></div></div>
      <input type="file" id="bg-img-file" accept="image/*" style="display:none;" onchange="onBgImageSelect(event)">

    </div>

    <!-- 색상 선택 -->
    <div id="color-section" class="ff-wrap" style="display:none;">
      <label class="ff-label" id="color-section-label">카드 배경 색상</label>
      <div class="color-swatches-wrap" id="color-swatches"></div>
    </div>

    <!-- 라이브 미리보기 -->
    <div id="write-preview-wrap">
      <div class="preview-label">미리보기</div>
      <div id="preview-card">
        <div class="card-overlay" id="preview-overlay" style="background:#000;opacity:0.45;"></div>
        <div class="card-body" id="preview-body"></div>
      </div>
    </div>

    <div class="ff-err" id="form-err"></div>
    <button class="lmp-btn" id="submit-btn" onclick="submitEntry()">남기기</button>
  </div>
</div>

<!-- Detail Lightbox -->
<div id="detail-modal" onclick="closeDetail()">
  <div id="detail-card" onclick="event.stopPropagation()"></div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC8uy09XOeEYIs1m3Rga5BMqd7gS7o3roI",
  authDomain: "beyhome-admin.firebaseapp.com",
  projectId: "beyhome-admin",
  storageBucket: "beyhome-admin.firebasestorage.app",
  messagingSenderId: "849320781553",
  appId: "1:849320781553:web:9d844044e85995c0aa2b50"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
const storage = firebase.storage();

const CONFIG_ID = new URLSearchParams(location.search).get('id') || '';

let ctxProjectId = '', ctxUserId = '', ctxUserFields = {}, ctxKeyColors = [];
function _lmpOriginOk(o) {
  if (!o) return true;
  if (o === 'https://lazymaxpotential.kr' || o === 'https://www.lazymaxpotential.kr') return true;
  if (/^https:\/\/[a-z0-9-]+\.vercel\.app$/.test(o)) return true;
  if (/^http:\/\/localhost(:\d+)?$/.test(o)) return true;
  return false;
}
window.addEventListener('message', e => {
  if (e.data?.type !== 'lmp-context') return;
  if (!_lmpOriginOk(e.origin)) return;
  ctxProjectId  = e.data.projectId  || '';
  ctxUserId     = e.data.userId     || '';
  ctxUserFields = e.data.userFields || {};
  ctxKeyColors  = e.data.keyColors  || [];
  if (e.data.blockBg) {
    document.body.style.backgroundColor = e.data.blockBg;
    document.documentElement.style.setProperty('--lmp-block-bg', e.data.blockBg);
  }
  if (e.data.blockBgImage) {
    const fit = e.data.blockBgFit || 'cover';
    const pos = e.data.blockBgPos  || 'center';
    document.body.style.backgroundImage    = `url('${e.data.blockBgImage}')`;
    document.body.style.backgroundSize     = fit;
    document.body.style.backgroundPosition = pos;
    document.body.style.backgroundRepeat   = 'no-repeat';
  }
  if (CONFIG) { buildColorSwatches(); updateWriteBtn(); }
});
window.parent.postMessage({ type: 'lmp-ready' }, '*');

let CONFIG = null;
let ENTRIES = [];
let selectedColor = '';

// Field image state
let pendingImageFile = null;
let pendingImageUrl  = '';

// Bg image state
let bgImgFile = null;
let bgImgLocalUrl = '';
const BG_FIT = 'cover';
const BG_POS = 'center';
const BG_OVERLAY_COLOR = '#000000';
const BG_OVERLAY_OPACITY = 0.4;

let DISPLAY_MODE   = 'scroll';
let SCROLL_COLS    = 2;
let INITIAL_ROWS   = 0;
let LOAD_MORE_TYPE = 'button';
let AUTO_SLIDE     = false;
let SLIDE_INTERVAL = 3000;
let PAGER_TYPE     = 'dots';

let SHOWN_COUNT = 0;
let slideIdx = 0;
let slideTimer = null;
let infiniteObserver = null;


function hasImageField() {
  return !!(CONFIG && (CONFIG.fields || []).some(f => f.type === 'image'));
}

function applyVars(str) {
  return (str || '').replace(/\{\{(\w+)\}\}/g, (_, k) => ctxUserFields[k] || '');
}

function updateWriteBtn() {
  if (!CONFIG) return;
  const label = applyVars(CONFIG.writeLabel || '') || '남기기';
  const btn = document.getElementById('write-btn');
  const modalTitle = document.getElementById('modal-title');
  const submitBtn  = document.getElementById('submit-btn');
  if (btn) btn.textContent = label;
  if (modalTitle) modalTitle.textContent = label;
  if (submitBtn && !submitBtn.disabled) submitBtn.textContent = label;
}

function generateAnonName() {
  const w1 = CONFIG.anonWords1 || [];
  const w2 = CONFIG.anonWords2 || [];
  if (!w1.length && !w2.length) return '익명';
  const p1 = w1.length ? w1[Math.floor(Math.random() * w1.length)] : '';
  const p2 = w2.length ? w2[Math.floor(Math.random() * w2.length)] : '';
  return [p1, p2].filter(Boolean).join(' ') || '익명';
}

function getContrastColor(hex) {
  if (!hex || !hex.startsWith('#') || hex.length < 7) return '#000';
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const lum = 0.2126*r + 0.7152*g + 0.0722*b;
  return lum > 0.45 ? '#000' : '#fff';
}

async function init() {
  if (!CONFIG_ID) { showErr('설정 ID가 없어요. (URL에 ?id=... 필요)'); return; }
  try {
    const doc = await db.collection('cms_guestbook_configs').doc(CONFIG_ID).get();
    if (!doc.exists) { showErr('설정을 찾을 수 없어요.'); return; }
    CONFIG = { id: doc.id, ...doc.data() };

    DISPLAY_MODE   = CONFIG.displayMode   || 'scroll';
    SCROLL_COLS    = Number(CONFIG.scrollCols)    || 2;
    INITIAL_ROWS   = Number(CONFIG.initialRows)   || 0;
    LOAD_MORE_TYPE = CONFIG.loadMoreType  || 'button';
    AUTO_SLIDE     = !!CONFIG.autoSlide;
    SLIDE_INTERVAL = Number(CONFIG.slideInterval) || 3000;
    PAGER_TYPE     = CONFIG.pagerType     || 'dots';
    document.documentElement.style.setProperty('--gallery-card-h', (Number(CONFIG.cardHeight) || 160) + 'px');

    renderWriteForm();
    updateWriteBtn();
    await loadEntries();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('on');
  } catch(e) {
    showErr('불러오기 실패: ' + e.message);
  }
}

function openWriteModal() {
  document.getElementById('done-banner').classList.remove('on');
  document.getElementById('form-err').textContent = '';
  document.getElementById('write-modal').classList.add('on');
}
function closeWriteModal() {
  document.getElementById('write-modal').classList.remove('on');
}

function renderWriteForm() {
  const wrap = document.getElementById('write-fields-wrap');
  wrap.innerHTML = '';
  (CONFIG.fields || []).forEach(f => wrap.appendChild(buildFieldEl(f)));

  const anonRow = document.getElementById('anon-row');
  if (anonRow) anonRow.style.display = (ctxUserId && CONFIG.allowAnonymous) ? '' : 'none';

  // Bg image section
  const bgSection = document.getElementById('bg-image-section');
  if (bgSection) bgSection.style.display = CONFIG.bgImageEnabled ? '' : 'none';

  // Color section
  document.getElementById('color-section').style.display = '';
  buildColorSwatches();

  // Preview wrap
  const previewWrap = document.getElementById('write-preview-wrap');
  if (previewWrap) previewWrap.style.display = CONFIG.bgImageEnabled ? '' : 'none';
  updatePreview();
}

function buildFieldEl(f) {
  const div = document.createElement('div');
  div.className = 'ff-wrap';
  const req = f.required ? '<span class="ff-req"> *</span>' : '';
  const fk = f.id || f.key || ('f_' + Math.random().toString(36).slice(2));
  if (f.type === 'image') {
    div.innerHTML = `
      <label class="ff-label">${esc(f.label)}${req}</label>
      <div class="img-upload-area" id="img-area-${fk}" onclick="document.getElementById('img-file-${fk}').click()">
        <img id="img-prev-${fk}" class="img-upload-preview" style="display:none;" alt="">
        <div id="img-icon-${fk}" class="img-upload-icon">📷</div>
        <div id="img-lbl-${fk}" class="img-upload-label">사진을 탭해서 선택하세요</div>
        <div class="img-upload-hint">JPG, PNG, GIF 등 이미지 파일</div>
      </div>
      <div class="img-prog-wrap" id="img-prog-${fk}"><div class="img-prog-bar" id="img-bar-${fk}"></div></div>
      <input type="file" id="img-file-${fk}" accept="image/*" style="display:none;" onchange="onImageSelect(event,'${fk}')">`;
  } else if (f.type === 'textarea') {
    div.innerHTML = `
      <label class="ff-label" for="field-${fk}">${esc(f.label)}${req}</label>
      <textarea class="ff-textarea" id="field-${fk}" placeholder="${esc(f.placeholder||'')}" oninput="updatePreview()"></textarea>`;
  } else {
    div.innerHTML = `
      <label class="ff-label" for="field-${fk}">${esc(f.label)}${req}</label>
      <input class="ff-inp" id="field-${fk}" type="text" placeholder="${esc(f.placeholder||'')}" oninput="updatePreview()">`;
  }
  return div;
}

function buildColorSwatches() {
  const wrap = document.getElementById('color-swatches');
  const label = document.getElementById('color-section-label');
  if (!wrap) return;
  const hasBgImg = CONFIG?.bgImageEnabled && bgImgLocalUrl;
  if (label) label.textContent = hasBgImg ? '텍스트 색상' : '카드 배경 색상';
  wrap.innerHTML = '';
  const colors = ctxKeyColors.length ? ctxKeyColors : ['#000000','#333333','#555555','#888888','#cccccc','#ffffff'];
  colors.forEach((c, i) => {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'color-swatch' + (i === 0 ? ' selected' : '');
    sw.style.background = c;
    sw.dataset.color = c;
    sw.setAttribute('aria-label', `색상 ${c}`);
    sw.onclick = () => pickColor(c);
    wrap.appendChild(sw);
  });
  if (colors.length) pickColor(selectedColor || colors[0]);
}

function pickColor(c) {
  selectedColor = c;
  document.querySelectorAll('.color-swatch').forEach(sw => {
    sw.classList.toggle('selected', sw.dataset.color === c);
  });
  updatePreview();
}


function onBgImageSelect(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  bgImgFile = file;
  if (bgImgLocalUrl) URL.revokeObjectURL(bgImgLocalUrl);
  bgImgLocalUrl = URL.createObjectURL(file);

  const prevEl = document.getElementById('bg-img-prev');
  const iconEl = document.getElementById('bg-img-icon');
  const lblEl  = document.getElementById('bg-img-lbl');
  const areaEl = document.getElementById('bg-img-area');
  if (prevEl)  { prevEl.src = bgImgLocalUrl; prevEl.style.display = 'block'; }
  if (iconEl)  iconEl.style.display = 'none';
  if (lblEl)   lblEl.textContent = '🖼 이미지 변경하기';
  if (areaEl)  areaEl.classList.add('has-img');

  // Update color label to "텍스트 색상"
  const label = document.getElementById('color-section-label');
  if (label) label.textContent = '텍스트 색상';
  updatePreview();
}

function onImageSelect(event, fieldKey) {
  const file = event.target.files?.[0];
  if (!file) return;
  pendingImageFile = file;
  if (pendingImageUrl) URL.revokeObjectURL(pendingImageUrl);
  pendingImageUrl = URL.createObjectURL(file);
  const prevEl = document.getElementById('img-prev-' + fieldKey);
  const iconEl = document.getElementById('img-icon-' + fieldKey);
  const lblEl  = document.getElementById('img-lbl-'  + fieldKey);
  const areaEl = document.getElementById('img-area-' + fieldKey);
  if (prevEl)  { prevEl.src = pendingImageUrl; prevEl.style.display = 'block'; }
  if (iconEl)  iconEl.style.display = 'none';
  if (lblEl)   lblEl.textContent = '📷 사진 변경하기';
  if (areaEl)  areaEl.classList.add('has-img');
}

function updatePreview() {
  const wrap = document.getElementById('write-preview-wrap');
  if (!wrap || !CONFIG?.bgImageEnabled) return;

  const card = document.getElementById('preview-card');
  const overlay = document.getElementById('preview-overlay');
  const body = document.getElementById('preview-body');
  if (!card || !overlay || !body) return;

  // Get first text field value for preview
  const textFields = (CONFIG.fields || []).filter(f => f.type !== 'image');
  const previewText = textFields.map(f => {
    const el = document.getElementById('field-' + (f.id || f.key));
    return el ? el.value.trim() : '';
  }).filter(Boolean).join(' · ') || '미리보기';

  if (bgImgLocalUrl) {
    card.style.backgroundImage = `url('${bgImgLocalUrl}')`;
    card.style.backgroundSize = BG_FIT;
    card.style.backgroundPosition = BG_POS;
    card.style.backgroundRepeat = 'no-repeat';
    overlay.style.background = BG_OVERLAY_COLOR;
    overlay.style.opacity = BG_OVERLAY_OPACITY;
    overlay.style.display = '';
    const textColor = selectedColor || '#fff';
    body.style.color = textColor;
    body.innerHTML = `<div class="card-field-val">${esc(previewText)}</div>`;
  } else {
    card.style.backgroundImage = '';
    card.style.backgroundSize = '';
    card.style.backgroundPosition = '';
    overlay.style.display = 'none';
    const bgColor = selectedColor || '';
    card.style.background = bgColor;
    const textColor = bgColor ? getContrastColor(bgColor) : '#000';
    body.style.color = textColor;
    body.innerHTML = `<div class="card-field-val">${esc(previewText)}</div>`;
  }
}

async function doUpload(file, path, progWrapId, progBarId) {
  const ref = storage.ref(path);
  const progWrap = progWrapId ? document.getElementById(progWrapId) : null;
  const progBar  = progBarId  ? document.getElementById(progBarId)  : null;
  if (progWrap) progWrap.style.display = 'block';
  const task = ref.put(file);
  task.on('state_changed', snap => {
    const pct = Math.round(snap.bytesTransferred / snap.totalBytes * 100);
    if (progBar) progBar.style.width = pct + '%';
  });
  await task;
  const url = await ref.getDownloadURL();
  if (progWrap) progWrap.style.display = 'none';
  return url;
}

async function submitEntry() {
  const errEl = document.getElementById('form-err');
  const btn   = document.getElementById('submit-btn');
  errEl.textContent = '';
  const fields = CONFIG.fields || [];
  const values = {};
  for (const f of fields) {
    if (f.type === 'image') continue;
    const el = document.getElementById('field-' + (f.id || f.key));
    const val = el ? el.value.trim() : '';
    if (f.required && !val) { errEl.textContent = `"${f.label}" 항목을 입력해주세요.`; return; }
    values[f.id || f.key] = val;
  }
  const imgField = fields.find(f => f.type === 'image');
  if (imgField && imgField.required && !pendingImageFile) {
    errEl.textContent = `"${imgField.label}" 사진을 추가해주세요.`; return;
  }
  if (!selectedColor) {
    errEl.textContent = '색상을 선택해주세요.'; return;
  }
  const lbl = applyVars(CONFIG.writeLabel || '') || '남기기';
  const isAnon = !ctxUserId || (CONFIG.allowAnonymous && !!document.getElementById('anon-check')?.checked);
  const authorName = isAnon ? generateAnonName() : (ctxUserFields?.name || ctxUserFields?.이름 || ctxUserId || '');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>저장 중…';
  try {
    // Upload field image
    let finalImageUrl = '';
    if (imgField && pendingImageFile) {
      const fk = imgField.id || imgField.key;
      const ext = pendingImageFile.name.split('.').pop() || 'jpg';
      const path = `guestbook_entries/${CONFIG_ID}/${ctxUserId||'anon'}_${Date.now()}.${ext}`;
      finalImageUrl = await doUpload(pendingImageFile, path, 'img-prog-' + fk, 'img-bar-' + fk);
    }
    // Upload bg image
    let finalBgImageUrl = '';
    if (CONFIG.bgImageEnabled && bgImgFile) {
      const ext = bgImgFile.name.split('.').pop() || 'jpg';
      const path = `guestbook_entries/${CONFIG_ID}/bg_${ctxUserId||'anon'}_${Date.now()}.${ext}`;
      finalBgImageUrl = await doUpload(bgImgFile, path, 'bg-img-prog', 'bg-img-bar');
    }
    const fieldValues = { ...values };
    if (imgField) fieldValues[imgField.id || imgField.key] = finalImageUrl;
    const entry = {
      fieldValues, authorName, isAnonymous: isAnon,
      userId: ctxUserId, projectId: ctxProjectId, userFields: ctxUserFields,
      approved: !(CONFIG.requireApproval), pinned: false,
      bgColor: selectedColor,
      bgImageUrl: finalBgImageUrl,
      bgImageFit: finalBgImageUrl ? BG_FIT : '',
      bgImagePosition: finalBgImageUrl ? BG_POS : '',
      overlayColor: finalBgImageUrl ? BG_OVERLAY_COLOR : '',
      overlayOpacity: finalBgImageUrl ? BG_OVERLAY_OPACITY : 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    };
    await db.collection('cms_guestbook_entries').doc(CONFIG_ID).collection('entries').add(entry);
    document.getElementById('done-banner').classList.add('on');
    resetForm();
    await loadEntries();
    window.parent.postMessage({ type: 'lmp-tool-complete' }, '*');
    setTimeout(() => closeWriteModal(), 2000);
  } catch(e) {
    errEl.textContent = '저장 실패: ' + e.message;
  } finally {
    btn.textContent = lbl;
    btn.disabled = false;
  }
}

function resetForm() {
  (CONFIG.fields || []).forEach(f => {
    const fk = f.id || f.key;
    if (f.type === 'image') {
      pendingImageFile = null;
      if (pendingImageUrl) { URL.revokeObjectURL(pendingImageUrl); pendingImageUrl = ''; }
      const prevEl = document.getElementById('img-prev-' + fk);
      const iconEl = document.getElementById('img-icon-' + fk);
      const lblEl  = document.getElementById('img-lbl-'  + fk);
      const areaEl = document.getElementById('img-area-' + fk);
      const inpEl  = document.getElementById('img-file-' + fk);
      if (prevEl)  { prevEl.src = ''; prevEl.style.display = 'none'; }
      if (iconEl)  iconEl.style.display = '';
      if (lblEl)   lblEl.textContent = '사진을 탭해서 선택하세요';
      if (areaEl)  areaEl.classList.remove('has-img');
      if (inpEl)   inpEl.value = '';
    } else {
      const el = document.getElementById('field-' + fk);
      if (el) el.value = '';
    }
  });
  // Reset bg image state
  bgImgFile = null;
  if (bgImgLocalUrl) { URL.revokeObjectURL(bgImgLocalUrl); bgImgLocalUrl = ''; }
  const bgPrev = document.getElementById('bg-img-prev');
  const bgIcon = document.getElementById('bg-img-icon');
  const bgLbl  = document.getElementById('bg-img-lbl');
  const bgArea = document.getElementById('bg-img-area');
  const bgInp  = document.getElementById('bg-img-file');
  if (bgPrev)  { bgPrev.src = ''; bgPrev.style.display = 'none'; }
  if (bgIcon)  bgIcon.style.display = '';
  if (bgLbl)   bgLbl.textContent = '사진을 탭해서 선택하세요';
  if (bgArea)  bgArea.classList.remove('has-img');
  if (bgInp)   bgInp.value = '';
  // Rebuild swatches to reset label
  buildColorSwatches();
  // Reset anon
  const anonCheck = document.getElementById('anon-check');
  if (anonCheck) anonCheck.checked = false;
  updatePreview();
}

async function loadEntries() {
  try {
    const snap = await db.collection('cms_guestbook_entries').doc(CONFIG_ID)
      .collection('entries').where('approved','==',true)
      .orderBy('pinned','desc').orderBy('createdAt','desc').limit(200).get();
    ENTRIES = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderGallery();
  } catch(e) {
    try {
      const snap2 = await db.collection('cms_guestbook_entries').doc(CONFIG_ID)
        .collection('entries').orderBy('createdAt','desc').limit(200).get();
      ENTRIES = snap2.docs.map(d => ({ id: d.id, ...d.data() })).filter(e => e.approved !== false);
      renderGallery();
    } catch(e2) { console.error('[loadEntries fallback]', e2); }
  }
}

function renderGallery() {
  const countEl = document.getElementById('cards-count');
  countEl.textContent = ENTRIES.length ? `${ENTRIES.length}개` : '';
  if (DISPLAY_MODE === 'slide') {
    document.getElementById('scroll-view').style.display = 'none';
    document.getElementById('slide-view').style.display = '';
    renderSlideGallery();
  } else {
    document.getElementById('scroll-view').style.display = '';
    document.getElementById('slide-view').style.display = 'none';
    renderScrollGallery();
  }
}

function renderScrollGallery() {
  const grid = document.getElementById('cards-grid');
  if (infiniteObserver) { infiniteObserver.disconnect(); infiniteObserver = null; }
  if (SCROLL_COLS >= 2) grid.classList.add('two-col');
  else grid.classList.remove('two-col');
  if (!ENTRIES.length) {
    grid.innerHTML = '<div class="cards-empty">아직 없어요.<br>첫 번째로 남겨보세요!</div>';
    document.getElementById('load-more-wrap').style.display = 'none';
    return;
  }
  const initialCount = INITIAL_ROWS > 0 ? INITIAL_ROWS * SCROLL_COLS : ENTRIES.length;
  SHOWN_COUNT = Math.min(initialCount, ENTRIES.length);
  grid.innerHTML = ENTRIES.slice(0, SHOWN_COUNT).map(e => buildCardHtml(e)).join('');
  const loadMoreWrap = document.getElementById('load-more-wrap');
  if (SHOWN_COUNT < ENTRIES.length) {
    if (LOAD_MORE_TYPE === 'infinite') {
      loadMoreWrap.style.display = 'none';
      setupInfiniteScroll();
    } else {
      loadMoreWrap.style.display = '';
    }
  } else {
    loadMoreWrap.style.display = 'none';
  }
}

function loadMoreCards() {
  const batchSize = INITIAL_ROWS > 0 ? INITIAL_ROWS * SCROLL_COLS : ENTRIES.length;
  const newCount = Math.min(SHOWN_COUNT + batchSize, ENTRIES.length);
  const grid = document.getElementById('cards-grid');
  grid.insertAdjacentHTML('beforeend', ENTRIES.slice(SHOWN_COUNT, newCount).map(e => buildCardHtml(e)).join(''));
  SHOWN_COUNT = newCount;
  if (SHOWN_COUNT >= ENTRIES.length) {
    document.getElementById('load-more-wrap').style.display = 'none';
    if (infiniteObserver) { infiniteObserver.disconnect(); infiniteObserver = null; }
  }
}

function setupInfiniteScroll() {
  const sentinel = document.getElementById('scroll-sentinel');
  if (!sentinel) return;
  infiniteObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && SHOWN_COUNT < ENTRIES.length) loadMoreCards();
  }, { threshold: 0.1 });
  infiniteObserver.observe(sentinel);
}

function renderSlideGallery() {
  clearAutoSlide();
  const track = document.getElementById('slide-track');
  if (!ENTRIES.length) {
    track.innerHTML = '<div class="slide-item"><div class="cards-empty">아직 없어요.<br>첫 번째로 남겨보세요!</div></div>';
    document.getElementById('slide-pager').innerHTML = '';
    return;
  }
  track.innerHTML = ENTRIES.map(e => `<div class="slide-item">${buildCardHtml(e)}</div>`).join('');
  slideIdx = 0;
  buildSlidePager();
  slideGoTo(0);
  startAutoSlide();
}

function buildSlidePager() {
  const pager = document.getElementById('slide-pager');
  if (PAGER_TYPE === 'dots') {
    pager.className = 'slide-dots';
    pager.innerHTML = ENTRIES.map((_, i) =>
      `<button class="slide-dot${i===0?' on':''}" onclick="slideGoToUser(${i})" aria-label="${i+1}번"></button>`
    ).join('');
  } else if (PAGER_TYPE === 'fraction') {
    pager.className = 'slide-fraction';
    pager.textContent = `1 / ${ENTRIES.length}`;
  } else {
    pager.className = ''; pager.innerHTML = '';
  }
}

function slideGoTo(idx) {
  const count = ENTRIES.length;
  if (!count) return;
  slideIdx = ((idx % count) + count) % count;
  const track = document.getElementById('slide-track');
  if (track) track.style.transform = `translateX(-${slideIdx * 100}%)`;
  updateSlidePager();
}
function slideGoToUser(idx) { clearAutoSlide(); slideGoTo(idx); startAutoSlide(); }
function slidePrev() { clearAutoSlide(); slideGoTo(slideIdx - 1); startAutoSlide(); }
function slideNext() { clearAutoSlide(); slideGoTo(slideIdx + 1); startAutoSlide(); }

function updateSlidePager() {
  const pager = document.getElementById('slide-pager');
  if (!pager) return;
  if (PAGER_TYPE === 'dots') {
    pager.querySelectorAll('.slide-dot').forEach((d, i) => d.classList.toggle('on', i === slideIdx));
  } else if (PAGER_TYPE === 'fraction') {
    pager.textContent = `${slideIdx + 1} / ${ENTRIES.length}`;
  }
}
function startAutoSlide() {
  if (!AUTO_SLIDE || !ENTRIES.length) return;
  slideTimer = setInterval(() => slideGoTo(slideIdx + 1), SLIDE_INTERVAL);
}
function clearAutoSlide() {
  if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
}

function buildCardHtml(entry) {
  const imgField = (CONFIG.fields || []).find(f => f.type === 'image');
  const fieldImgUrl = imgField ? (entry.fieldValues?.[imgField.id || imgField.key] || '') : '';
  const bgImageUrl = entry.bgImageUrl || '';
  const bgColor = entry.bgColor || '';
  const textFields = (CONFIG.fields || []).filter(f => f.type !== 'image');

  const fieldsHtml = textFields.map(f => {
    const fk = f.id || f.key;
    const val = entry.fieldValues?.[fk] || entry.values?.[fk] || '';
    if (!val) return '';
    return `<div class="card-field"><div class="card-field-val">${esc(val)}</div></div>`;
  }).join('');

  const parts = [];
  if (entry.createdAt?.toDate) {
    const d = entry.createdAt.toDate();
    parts.push(`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`);
  }
  if (entry.authorName) parts.push(esc(entry.authorName));
  const metaText = parts.join(' · ');

  if (bgImageUrl) {
    const bgFit = entry.bgImageFit || 'cover';
    const bgSize = bgFit === 'contain' ? 'contain' : bgFit === 'natural' ? 'auto' : 'cover';
    const pos = entry.bgImagePosition || 'center';
    const ovRgb = entry.overlayColor || '#000000';
    const ovOp  = entry.overlayOpacity ?? 0.45;
    const textColor = bgColor || '#ffffff';
    const metaColor = bgColor ? bgColor + 'aa' : 'rgba(255,255,255,.65)';
    return `<div class="gb-card has-img-bg" onclick="openDetail('${entry.id}')"
      style="background-image:url('${esc(bgImageUrl)}');background-size:${bgSize};background-position:${pos};background-repeat:no-repeat;">
      <div class="card-overlay" style="background:${ovRgb};opacity:${ovOp};"></div>
      <div class="card-body" style="position:relative;z-index:1;color:${textColor};">
        ${fieldsHtml}
        ${metaText ? `<div class="card-meta" style="color:${metaColor};">${metaText}</div>` : ''}
      </div>
    </div>`;
  } else if (fieldImgUrl) {
    return `<div class="gb-card" onclick="openDetail('${entry.id}')">
      <div class="card-img-wrap"><img src="${esc(fieldImgUrl)}" alt="" loading="lazy"></div>
      <div class="card-body">${fieldsHtml}${metaText ? `<div class="card-meta">${metaText}</div>` : ''}</div>
    </div>`;
  } else {
    const bgStyle = bgColor ? `background:${bgColor};` : '';
    const textColor = bgColor ? getContrastColor(bgColor) : '#000';
    const textStyle = bgColor ? `color:${textColor};` : '';
    return `<div class="gb-card" onclick="openDetail('${entry.id}')" style="${bgStyle}${textStyle}">
      <div class="card-body">${fieldsHtml}${metaText ? `<div class="card-meta" style="${bgColor?`color:${textColor};opacity:.6;`:''}">` + metaText + '</div>' : ''}</div>
    </div>`;
  }
}

function openDetail(entryId) {
  const entry = ENTRIES.find(e => e.id === entryId);
  if (!entry) return;
  const fields = CONFIG.fields || [];
  const isOwner = ctxUserId && entry.userId === ctxUserId;
  const imgField = fields.find(f => f.type === 'image');
  const fieldImgUrl = imgField ? (entry.fieldValues?.[imgField.id || imgField.key] || '') : '';
  const bgImageUrl = entry.bgImageUrl || '';
  const bgColor = entry.bgColor || '';
  const textFields = fields.filter(f => f.type !== 'image');

  const fieldsHtml = textFields.map(f => {
    const fk = f.id || f.key;
    const val = entry.fieldValues?.[fk] || entry.values?.[fk] || '';
    if (!val) return '';
    return `<div class="card-field"><div class="card-field-val">${esc(val)}</div></div>`;
  }).join('');

  const metaParts = [];
  if (entry.createdAt?.toDate) {
    const d = entry.createdAt.toDate();
    metaParts.push(`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`);
  }
  if (entry.authorName) metaParts.push(esc(entry.authorName));
  const metaHtml = metaParts.length ? `<div class="card-meta">${metaParts.join(' · ')}</div>` : '';
  const delBtn = isOwner ? `<button class="dm-del-btn" onclick="deleteEntry('${entryId}')">삭제하기</button>` : '';

  let html = '';
  if (bgImageUrl) {
    const bgFit = entry.bgImageFit || 'cover';
    const bgSize = bgFit === 'contain' ? 'contain' : bgFit === 'natural' ? 'auto' : 'cover';
    const pos = entry.bgImagePosition || 'center';
    const ovRgb = entry.overlayColor || '#000000';
    const ovOp  = entry.overlayOpacity ?? 0.45;
    const textColor = bgColor || '#ffffff';
    html = `<div class="gb-lightbox-img-bg" style="background-image:url('${esc(bgImageUrl)}');background-size:${bgSize};background-position:${pos};">
      <div class="card-overlay" style="background:${ovRgb};opacity:${ovOp};"></div>
      <div class="gb-lightbox-body" style="color:${textColor};">
        ${fieldsHtml}
        <div class="card-meta" style="color:${textColor};opacity:.65;">${metaParts.join(' · ')}</div>
        ${delBtn}
      </div>
    </div>`;
  } else {
    if (fieldImgUrl) html += `<img class="gb-lightbox-img" src="${esc(fieldImgUrl)}" alt="">`;
    const bodyBg = (!fieldImgUrl && bgColor) ? `background:${bgColor};color:${getContrastColor(bgColor)};` : '';
    html += `<div class="gb-lightbox-body" style="${bodyBg}">${fieldsHtml}${metaHtml}${delBtn}</div>`;
  }

  document.getElementById('detail-card').innerHTML = html;
  document.getElementById('detail-modal').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeDetail() {
  document.getElementById('detail-modal').classList.remove('on');
  document.body.style.overflow = '';
}
async function deleteEntry(entryId) {
  if (!confirm('삭제할까요?')) return;
  try {
    await db.collection('cms_guestbook_entries').doc(CONFIG_ID).collection('entries').doc(entryId).delete();
    closeDetail(); await loadEntries();
  } catch(e) { alert('삭제 실패: ' + e.message); }
}

function showErr(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('err-screen');
  el.textContent = msg; el.classList.add('on');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad(n) { return String(n).padStart(2,'0'); }

init();
</script>
