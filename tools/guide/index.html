<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>계산기</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
:root{--lmp-block-bg:#fff;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:transparent;display:flex;justify-content:center;min-height:100vh;}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--lmp-block-bg);position:relative;display:flex;flex-direction:column;}

/* ── lmp 버튼 ── */
.lmp-btn{flex-shrink:0;padding:10px 18px;background:var(--lmp-block-bg);color:#000;border:2px solid #000;border-radius:0;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;letter-spacing:-.2px;transition:background .15s,color .15s;}
.lmp-btn:hover,.lmp-btn:active,.lmp-btn.active{background:#000;color:var(--lmp-block-bg);}
.lmp-btn.primary{background:#000;color:var(--lmp-block-bg);}
.lmp-btn.primary:hover,.lmp-btn.primary:active{background:var(--lmp-block-bg);color:#000;}
.lmp-btn:disabled{opacity:.35;cursor:default;}
.lmp-btn.danger{color:#c00;border-color:#c00;}
.lmp-btn.danger:hover,.lmp-btn.danger:active{background:#c00;color:var(--lmp-block-bg);}

/* ── 입력 ── */
input[type=number],input[type=text]{font-family:inherit;font-size:16px;font-weight:700;border:2px solid #000;border-radius:0;padding:14px 16px;width:100%;background:var(--lmp-block-bg);color:#000;outline:none;-webkit-appearance:none;}
input:focus{border-color:#000;box-shadow:0 0 0 3px rgba(0,0,0,.08);}

/* ── 헤더 ── */
#view-header{display:flex;align-items:center;padding:14px 16px;border-bottom:2px solid #000;flex-shrink:0;gap:12px;}
#view-header .title{font-size:14px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── 진행 바 ── */
#progress-wrap{height:3px;background:#e8e8e8;flex-shrink:0;}
#progress-bar{height:100%;background:#000;transition:width .3s;}

/* ── 단계 화면 ── */
#step-screen{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#step-body{flex:1;overflow-y:auto;padding:28px 20px 16px;}
.q-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(0,0,0,.35);margin-bottom:14px;}
.q-title{font-size:20px;font-weight:800;line-height:1.4;margin-bottom:8px;word-break:keep-all;}
.q-sub{font-size:12px;color:rgba(0,0,0,.4);font-weight:600;margin-bottom:24px;}

/* ── 질문 헤더 이미지 / 텍스트 ── */
.q-header-img{width:calc(100% + 40px);margin:-28px -20px 0;max-height:260px;object-fit:cover;display:block;}
.q-header-text{font-size:14px;color:rgba(0,0,0,.65);line-height:1.75;font-weight:500;margin-bottom:18px;white-space:pre-wrap;word-break:keep-all;}

/* ── 선택지 (텍스트형) ── */
.choice-options{display:flex;flex-direction:column;gap:8px;margin-top:24px;}
.choice-opt{padding:15px 18px;border:2px solid #000;font-size:14px;font-weight:700;cursor:pointer;background:var(--lmp-block-bg);color:#000;transition:background .12s,color .12s;text-align:left;font-family:inherit;width:100%;letter-spacing:-.2px;display:flex;align-items:center;gap:10px;}
.choice-opt .opt-check{width:18px;height:18px;border:2px solid #000;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:background .12s;}
.choice-opt.selected{background:#000;color:var(--lmp-block-bg);}
.choice-opt.selected .opt-check{background:var(--lmp-block-bg);color:#000;}
.choice-opt:active{opacity:.7;}

/* ── 선택지 (이미지형) ── */
.choice-options-img{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px;}
.choice-opt-img{position:relative;aspect-ratio:3/4;border:2px solid #000;overflow:hidden;cursor:pointer;background:#e8e8e8;padding:0;width:100%;display:block;-webkit-tap-highlight-color:transparent;transition:border-width .12s;}
.choice-opt-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.choice-opt-img .opt-label-bar{position:absolute;top:0;left:0;right:0;padding:8px 10px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;z-index:1;letter-spacing:-.2px;}
.choice-opt-img .opt-check-img{width:16px;height:16px;border:2px solid rgba(255,255,255,.8);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;background:transparent;line-height:1;}
.choice-opt-img.selected{border-width:3px;}
.choice-opt-img.selected .opt-label-bar{background:rgba(0,0,0,.92);}
.choice-opt-img.selected .opt-check-img{background:var(--lmp-block-bg);color:#000;border-color:var(--lmp-block-bg);}

/* ── 숫자 입력 ── */
.numeric-wrap{margin-top:24px;display:flex;align-items:stretch;gap:0;}
.numeric-wrap input{flex:1;border-right:0;}
.numeric-unit{display:flex;align-items:center;padding:0 16px;border:2px solid #000;font-size:14px;font-weight:800;white-space:nowrap;background:#f8f8f8;flex-shrink:0;}

/* ── 하단 네비 ── */
#step-nav{flex-shrink:0;padding:16px 20px;border-top:2px solid #000;display:flex;gap:8px;}

/* ── 결과 화면 ── */
#result-screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
#result-header{flex-shrink:0;padding:16px 20px;border-bottom:2px solid #000;display:flex;align-items:center;justify-content:space-between;}
#result-header .r-title{font-size:13px;font-weight:800;}
#result-header .r-count{font-size:11px;font-weight:700;color:rgba(0,0,0,.4);}
#result-body{flex:1;overflow-y:auto;padding:20px;}
.result-card{border:2px solid #000;margin-bottom:12px;}
.result-card-head{padding:14px 16px 0;border-bottom:0;}
.result-card-title{font-size:15px;font-weight:800;margin-bottom:12px;}
.result-card-divider{height:2px;background:#000;margin:0 -0px;}
.result-card-body{padding:14px 16px;font-size:13px;line-height:1.8;color:rgba(0,0,0,.8);white-space:pre-wrap;word-break:keep-all;}
.result-card-body strong{font-weight:800;color:#000;}
#result-footer{flex-shrink:0;padding:16px 20px;border-top:2px solid #000;}

/* ── 로딩 / 에러 ── */
#loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
#loading p{font-size:13px;font-weight:700;color:rgba(0,0,0,.4);}
.error-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;gap:8px;}
.error-wrap .error-icon{font-size:32px;margin-bottom:4px;}
.error-wrap .error-msg{font-size:14px;font-weight:700;color:#000;}
.error-wrap .error-sub{font-size:12px;color:rgba(0,0,0,.4);}

/* ── 빌더 안내 (mode=builder 직접 접근 시) ── */
.builder-redirect{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px 24px;text-align:center;}
.builder-redirect p{font-size:13px;color:rgba(0,0,0,.5);}
</style>
</head>
<body>
<div id="app">
  <div id="loading"><p>불러오는 중…</p></div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyC8uy09XOeEYIs1m3Rga5BMqd7gS7o3roI",
  authDomain:"beyhome-admin.firebaseapp.com",
  projectId:"beyhome-admin",
  storageBucket:"beyhome-admin.firebasestorage.app",
  messagingSenderId:"849320781553",
  appId:"1:849320781553:web:9d844044e85995c0aa2b50"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
const auth = firebase.auth();
const FORMS_REF = () => db.collection('game_configs').doc('guide').collection('forms');

const params = new URLSearchParams(location.search);
const FORM_ID = params.get('id');

/* lmp-context: blockBg 수신 → CSS 변수 설정 */
window.addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  if (e.data?.type !== 'lmp-context') return;
  if (e.data.blockBg) document.documentElement.style.setProperty('--lmp-block-bg', e.data.blockBg);
});
window.parent.postMessage({ type: 'lmp-ready' }, location.origin);

/* ────────────────────────────────────────────
   초기화
──────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', async () => {
  if(!FORM_ID) {
    showBuilderRedirect();
    return;
  }
  /* 익명 로그인으로 Firestore 읽기 권한 확보 */
  try {
    if(!auth.currentUser) await auth.signInAnonymously();
  } catch(_) { /* 익명 로그인 실패해도 시도 계속 */ }
  await initViewer(FORM_ID);
});

/* ────────────────────────────────────────────
   수식 계산 엔진
──────────────────────────────────────────── */
function evalTemplate(template, vars) {
  return template.replace(/\{\{([^}]+)\}\}/g, (_, expr) => {
    try {
      let e = expr;
      Object.keys(vars).sort((a,b) => b.length - a.length).forEach(k => {
        e = e.replace(new RegExp('\\b' + k + '\\b', 'g'), String(vars[k] ?? 0));
      });
      e = e.replace(/\bceil\s*\(/g,'Math.ceil(')
           .replace(/\bfloor\s*\(/g,'Math.floor(')
           .replace(/\bround\s*\(/g,'Math.round(');
      if(!/^[\d\s\+\-\*\/\%\(\)\.,Mathceilflorroundth]+$/.test(e.replace(/\bMath\.(ceil|floor|round)\b/g,'')))
        return '[계산오류]';
      const r = Function('"use strict";return (' + e + ')')();
      if(!isFinite(r)) return '[계산불가]';
      return Number.isInteger(r) ? String(r) : r.toFixed(2);
    } catch { return '[계산오류]'; }
  });
}

function renderMd(text) {
  return text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ────────────────────────────────────────────
   뷰어
──────────────────────────────────────────── */
let vs = {
  form: null,
  stepIdx: 0,
  answers: {},
  inputBlocks: [],
};

async function initViewer(formId) {
  try {
    const snap = await FORMS_REF().doc(formId).get();
    if(!snap.exists) {
      showError('계산기를 찾을 수 없어요.', '링크가 올바른지 확인해주세요.');
      return;
    }
    vs.form = snap.data();
    vs.inputBlocks = (vs.form.blocks||[]).filter(b => b.type==='choice' || b.type==='numeric');
    vs.stepIdx = 0;
    vs.answers = {};
    if(!vs.inputBlocks.length && !(vs.form.blocks||[]).filter(b=>b.type==='result').length) {
      showError('아직 블록이 없는 계산기예요.', '관리자 페이지에서 블록을 추가해주세요.');
      return;
    }
    renderViewer();
  } catch(e) {
    const isPermission = e.code === 'permission-denied' || (e.message||'').includes('permissions');
    showError(
      isPermission ? '접근 권한이 없어요.' : '불러오기 실패: ' + e.message,
      isPermission ? 'Firestore 보안 규칙에서 game_configs 하위 컬렉션 읽기를 허용해주세요.' : ''
    );
  }
}

function renderViewer() {
  const app = document.getElementById('app');
  const title = esc(vs.form.title || '계산기');
  app.innerHTML = `
    <div id="view-header">
      <span class="title">${title}</span>
    </div>
    <div id="progress-wrap"><div id="progress-bar" style="width:0%"></div></div>
    <div id="step-screen">
      <div id="step-body"></div>
      <div id="step-nav">
        <button class="lmp-btn" id="btn-prev" onclick="vPrev()" style="display:none;">← 이전</button>
        <button class="lmp-btn primary" id="btn-next" onclick="vNext()" style="flex:1;">다음 →</button>
      </div>
    </div>
    <div id="result-screen"></div>`;
  renderStep();
}

function renderStep() {
  const total = vs.inputBlocks.length;
  const idx = vs.stepIdx;
  const pct = total ? Math.round((idx / total) * 100) : 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('btn-prev').style.display = idx > 0 ? '' : 'none';

  if(idx >= total) { showResults(); return; }

  const b = vs.inputBlocks[idx];
  const body = document.getElementById('step-body');
  const stepLabel = `${idx+1} / ${total}`;

  if(b.type === 'choice') {
    const sel = vs.answers[b.id] || [];
    const allHaveImg = (b.options||[]).length > 0 && (b.options||[]).every(o=>o.imageUrl);
    const headerImgHTML = b.imageUrl
      ? `<img class="q-header-img" src="${esc(b.imageUrl)}" alt="" onerror="this.style.display='none'">`
      : '';
    const topPadding = b.imageUrl ? 'padding-top:16px;' : '';
    const optionsHTML = allHaveImg
      ? `<div class="choice-options-img">
          ${(b.options||[]).map(o => `
            <button class="choice-opt-img${sel.includes(o.id)?' selected':''}" onclick="selectOpt('${b.id}','${o.id}',${!!b.multiple})">
              <img src="${esc(o.imageUrl||'')}" alt="" onerror="this.style.opacity='.3'">
              <div class="opt-label-bar">
                <span class="opt-check-img">${sel.includes(o.id)?'✓':''}</span>
                ${esc(o.label)}
              </div>
            </button>`).join('')}
         </div>`
      : `<div class="choice-options">
          ${(b.options||[]).map(o => `
            <button class="choice-opt${sel.includes(o.id)?' selected':''}" onclick="selectOpt('${b.id}','${o.id}',${!!b.multiple})">
              <span class="opt-check">${sel.includes(o.id)?'✓':''}</span>
              ${esc(o.label)}
            </button>`).join('')}
         </div>`;
    body.innerHTML = `
      ${headerImgHTML}
      <div style="${topPadding}">
        <div class="q-label">${stepLabel}</div>
        <div class="q-title">${esc(b.question)}</div>
        ${b.multiple ? '<div class="q-sub">복수 선택 가능</div>' : ''}
        ${b.headerText ? `<div class="q-header-text">${esc(b.headerText)}</div>` : ''}
      </div>
      ${optionsHTML}`;
  }

  if(b.type === 'numeric') {
    const val = vs.answers[b.id] ?? '';
    const headerImgHTML = b.imageUrl
      ? `<img class="q-header-img" src="${esc(b.imageUrl)}" alt="" onerror="this.style.display='none'">`
      : '';
    const topPadding = b.imageUrl ? 'padding-top:16px;' : '';
    body.innerHTML = `
      ${headerImgHTML}
      <div style="${topPadding}">
        <div class="q-label">${stepLabel}</div>
        <div class="q-title">${esc(b.question)}</div>
        ${b.headerText ? `<div class="q-header-text">${esc(b.headerText)}</div>` : ''}
      </div>
      <div class="numeric-wrap">
        <input type="number" id="num-inp" value="${esc(String(val))}" placeholder="0"
          ${b.min!=null?`min="${b.min}"`:''}${b.max!=null?` max="${b.max}"`:''}
          oninput="vs.answers['${b.id}']=this.value===''?'':Number(this.value)"
          autofocus>
        ${b.unit ? `<span class="numeric-unit">${esc(b.unit)}</span>` : ''}
      </div>`;
    /* iOS 자동 포커스 */
    setTimeout(()=>{ const el=document.getElementById('num-inp'); if(el) el.focus(); }, 100);
  }

  document.getElementById('btn-next').textContent = idx === total-1 ? '결과 보기 →' : '다음 →';
}

function selectOpt(blockId, optId, multiple) {
  if(!vs.answers[blockId]) vs.answers[blockId] = [];
  const arr = vs.answers[blockId];
  if(multiple) {
    const i = arr.indexOf(optId); i>=0 ? arr.splice(i,1) : arr.push(optId);
  } else {
    vs.answers[blockId] = [optId];
  }
  renderStep();
}

function vNext() {
  if(vs.stepIdx < vs.inputBlocks.length) vs.stepIdx++;
  renderStep();
}

function vPrev() {
  if(vs.stepIdx > 0) vs.stepIdx--;
  renderStep();
}

/* ── 결과 화면 ── */
function showResults() {
  window.parent.postMessage({ type: 'lmp-tool-complete' }, location.origin);
  /* 태그·변수 집계 */
  const tags = new Set();
  const numVars = {};
  (vs.form.blocks||[]).forEach(b => {
    if(b.type==='choice') {
      (vs.answers[b.id]||[]).forEach(optId => {
        const opt = (b.options||[]).find(o=>o.id===optId);
        if(opt) (opt.tags||[]).forEach(t=>tags.add(t));
      });
    }
    if(b.type==='numeric' && b.variable) {
      const v = vs.answers[b.id];
      if(v!==''&&v!=null) numVars[b.variable] = Number(v)||0;
    }
  });

  /* 조건 맞는 결과 카드 필터 */
  const cards = (vs.form.blocks||[]).filter(b => {
    if(b.type!=='result') return false;
    const c = b.condition;
    if(!c||!c.tags||!c.tags.length) return true;
    return c.operator==='OR' ? c.tags.some(t=>tags.has(t)) : c.tags.every(t=>tags.has(t));
  });

  document.getElementById('step-screen').style.display = 'none';
  const resultEl = document.getElementById('result-screen');
  resultEl.style.display = 'flex';

  const cardsHTML = cards.length
    ? cards.map(b => {
        const body = renderMd(esc(evalTemplate(b.content||'', numVars)));
        return `<div class="result-card">
          <div class="result-card-head"><div class="result-card-title">${esc(b.title)}</div></div>
          <div class="result-card-divider"></div>
          <div class="result-card-body">${body}</div>
        </div>`;
      }).join('')
    : `<div style="text-align:center;padding:40px 0;font-size:13px;font-weight:700;color:rgba(0,0,0,.35);">해당하는 결과 카드가 없어요.</div>`;

  resultEl.innerHTML = `
    <div id="result-header">
      <span class="r-title">결과</span>
      <span class="r-count">카드 ${cards.length}개</span>
    </div>
    <div id="result-body">${cardsHTML}</div>
    <div id="result-footer">
      <button class="lmp-btn" onclick="restart()" style="width:100%;">← 다시 하기</button>
    </div>`;
}

function restart() {
  vs.stepIdx = 0;
  vs.answers = {};
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('step-screen').style.display = '';
  renderStep();
}

/* ── 유틸 ── */
function showError(msg, sub) {
  document.getElementById('app').innerHTML = `
    <div class="error-wrap">
      <div class="error-icon">!</div>
      <div class="error-msg">${esc(msg)}</div>
      ${sub ? `<div class="error-sub">${esc(sub)}</div>` : ''}
    </div>`;
}

function showBuilderRedirect() {
  document.getElementById('app').innerHTML = `
    <div class="builder-redirect">
      <p>계산기 ID가 없어요.<br>관리자 페이지에서 계산기를 만들고 미리보기 링크를 사용해주세요.</p>
      <a href="/admin" class="lmp-btn" style="text-decoration:none;">관리자 페이지 →</a>
    </div>`;
}
</script>
</body>
</html>
