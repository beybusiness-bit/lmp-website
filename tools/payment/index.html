<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>결제</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--lmp-block-bg:#fff;--lmp-input-bg:transparent;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:transparent;color:#000;}

.lmp-btn{display:block;width:100%;padding:14px 18px;background:#000;color:var(--lmp-block-bg);border:2px solid #000;border-radius:0;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.2px;transition:background .15s,color .15s;}
.lmp-btn:hover,.lmp-btn:active{background:var(--lmp-block-bg);color:#000;}
.lmp-btn:disabled{opacity:.35;cursor:default;}

#app{padding:24px 20px;}
#loading,#err-screen{padding:40px 20px;text-align:center;font-size:14px;font-weight:600;}
#loading{color:rgba(0,0,0,.5);}
#err-screen{display:none;color:#c00;}
#err-screen.on{display:block;}

.pay-head{margin-bottom:24px;}
.pay-title{font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.4;margin-bottom:6px;}
.pay-product{font-size:14px;font-weight:600;color:rgba(0,0,0,.7);line-height:1.5;margin-bottom:12px;}
.pay-amount{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px;}
.pay-amount .won{font-size:18px;font-weight:700;margin-left:2px;}
.pay-desc{font-size:13px;line-height:1.7;color:rgba(0,0,0,.6);margin-top:14px;padding:12px 14px;border:1.5px solid rgba(0,0,0,.12);background:rgba(0,0,0,.02);}

#pay-result{display:none;text-align:center;padding:30px 16px;}
#pay-result.on{display:block;}
.pay-result-icon{font-size:48px;margin-bottom:12px;}
.pay-result-title{font-size:17px;font-weight:800;margin-bottom:10px;letter-spacing:-.3px;}
.pay-result-msg{font-size:13px;line-height:1.6;color:rgba(0,0,0,.7);margin-bottom:18px;}
.pay-receipt{margin-top:18px;padding:14px;border:1.5px solid rgba(0,0,0,.15);text-align:left;font-size:12px;line-height:1.7;color:rgba(0,0,0,.65);}
.pay-receipt b{font-weight:700;color:#000;}

#status-msg{display:none;padding:40px 20px;text-align:center;font-size:14px;color:rgba(0,0,0,.55);font-weight:600;}
#status-msg.on{display:block;}

/* 결제 전 확인 화면 */
#pay-confirm{display:none;padding:0;}
#pay-confirm.on{display:block;}
.pc-summary{border:2px solid #000;padding:16px;margin-bottom:18px;}
.pc-summary-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.08);}
.pc-summary-row:last-child{border-bottom:none;padding-top:10px;font-weight:900;font-size:16px;}
.pc-summary-label{color:rgba(0,0,0,.55);font-weight:600;}
.pc-notice{background:rgba(0,0,0,.04);border-left:3px solid #000;padding:12px 14px;font-size:12px;line-height:1.7;color:rgba(0,0,0,.65);margin-bottom:18px;}
.pc-agree-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;cursor:pointer;}
.pc-agree-row input[type=checkbox]{width:18px;height:18px;flex-shrink:0;margin-top:1px;cursor:pointer;accent-color:#000;}
.pc-agree-label{font-size:13px;font-weight:600;line-height:1.5;color:#000;}
.pc-back{background:transparent;border:2px solid rgba(0,0,0,.25);color:rgba(0,0,0,.55);width:100%;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;}
.pc-back:active{background:rgba(0,0,0,.05);}
</style>
</head>
<body>
<div id="loading">불러오는 중…</div>
<div id="err-screen"></div>
<div id="status-msg"></div>
<div id="app" style="display:none;">
  <div id="pay-screen">
    <div class="pay-head">
      <div class="pay-title" id="p-title"></div>
      <div class="pay-amount"><span id="p-amount">0</span><span class="won">원</span></div>
      <div class="pay-desc" id="p-desc" style="display:none;"></div>
    </div>
    <button class="lmp-btn" id="pay-btn">결제하기</button>
  </div>

  <!-- 결제 전 최종 확인 화면 -->
  <div id="pay-confirm">
    <div class="pc-summary" id="pc-summary"></div>
    <div class="pc-notice">
      본 상품은 디지털 콘텐츠로, 결제 완료 및 서비스 이용 즉시 전자상거래법 제17조에 따라 청약철회가 제한됩니다.
      문의: <span id="pc-email" style="font-weight:700;"></span>
    </div>
    <label class="pc-agree-row">
      <input type="checkbox" id="pc-agree">
      <span class="pc-agree-label">위 내용을 확인하였으며, 청약철회가 불가함에 동의합니다.</span>
    </label>
    <button class="lmp-btn" id="pc-ok-btn" disabled>결제 진행하기</button>
    <button class="pc-back" id="pc-back-btn">← 돌아가기</button>
  </div>

  <div id="pay-result">
    <div class="pay-result-icon" id="r-icon">✅</div>
    <div class="pay-result-title" id="r-title"></div>
    <div class="pay-result-msg" id="r-msg"></div>
    <div class="pay-receipt" id="r-receipt" style="display:none;"></div>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC8uy09XOeEYIs1m3Rga5BMqd7gS7o3roI",
  authDomain: "beyhome-admin.firebaseapp.com",
  projectId: "beyhome-admin",
  storageBucket: "beyhome-admin.firebasestorage.app",
  messagingSenderId: "849320781553",
  appId: "1:849320781553:web:9d844044e85995c0aa2b50"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

const urlParams = new URLSearchParams(location.search);
const CONFIG_ID       = urlParams.get('id') || '';
const RESULT          = urlParams.get('result') || '';
const TRANSACTION_ID  = urlParams.get('transactionId') || '';
const AMOUNT_FROM_URL = urlParams.get('amount') || '';
const CARD_NAME       = urlParams.get('cardName') || '';
const AUTH_DATETIME   = urlParams.get('authDatetime') || '';
const AUTH_NUMBER     = urlParams.get('authNumber') || '';
const FAIL_MSG        = urlParams.get('message') || '';
// projectId/userId relayed back from server after payment confirmation
const URL_PROJECT_ID  = urlParams.get('projectId') || '';
const URL_USER_ID     = urlParams.get('userId') || '';

let CONFIG = null;
let MERCHANT_ID = '';
let IS_TEST = false;
let ctxProjectId = URL_PROJECT_ID;
let ctxUserId    = URL_USER_ID;
let ctxUserFields = {};

let ctxReceived = false;
let resolveCtx;
const ctxPromise = new Promise(res => { resolveCtx = res; });

window.addEventListener('message', e => {
  if (e.data?.type !== 'lmp-context') return;
  ctxProjectId  = e.data.projectId  || ctxProjectId;
  ctxUserId     = e.data.userId     || ctxUserId;
  ctxUserFields = e.data.userFields || {};
  if (e.data.blockBg) { document.documentElement.style.setProperty('--lmp-block-bg', e.data.blockBg); document.documentElement.style.setProperty('--lmp-input-bg', e.data.blockBg); }
  if (!ctxReceived) { ctxReceived = true; resolveCtx(); }
});

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function applyVars(str) {
  if (!str) return '';
  return str.replace(/\{\{(\w+)\}\}/g, (_, key) => {
    const v = ctxUserFields[key];
    return v != null ? String(v) : '{{' + key + '}}';
  });
}
function setStatus(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.classList.add('on');
}
function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('err-screen');
  el.textContent = msg;
  el.classList.add('on');
}

async function loadConfig() {
  if (!CONFIG_ID) { showError('결제 설정 ID가 없어요. 관리자에게 문의해주세요.'); return false; }
  try {
    const doc = await db.collection('cms_payment_configs').doc(CONFIG_ID).get();
    if (!doc.exists) { showError('결제 설정을 찾을 수 없어요.'); return false; }
    CONFIG = doc.data();
    const [paySettings, siteSettings] = await Promise.all([
      db.collection('cms_admin_settings').doc('payment').get(),
      db.collection('cms_admin_settings').doc('site').get(),
    ]);
    if (paySettings.exists) {
      MERCHANT_ID = paySettings.data().payupMerchantId || '';
      IS_TEST     = !!(paySettings.data().payupTestMode);
    }
    if (siteSettings.exists) {
      window._siteEmail = siteSettings.data().footerEmail || '';
    }
    return true;
  } catch (e) {
    showError('설정을 불러오지 못했어요: ' + (e.message || ''));
    return false;
  }
}

function loadSdk() {
  return new Promise((resolve, reject) => {
    const src = IS_TEST
      ? 'https://standard.testpayup.co.kr/assets/js/payup_standard_dev-1.0.js'
      : 'https://standard.payup.co.kr/assets/js/payup_standard-1.0.js';
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('페이업 SDK 로드 실패'));
    document.head.appendChild(s);
  });
}

async function init() {
  await Promise.race([ctxPromise, new Promise(r => setTimeout(r, 1500))]);

  const ok = await loadConfig();
  if (!ok) return;

  // 결제 실패 결과
  if (RESULT === 'fail') {
    showResult('fail', '결제가 실패했어요', FAIL_MSG || '결제를 다시 시도해주세요.', null);
    return;
  }

  // 서버 승인 완료 후 리다이렉트 돌아온 경우 — Firestore 기록 후 성공 화면 표시
  if (RESULT === 'success' && TRANSACTION_ID) {
    setStatus('결제 완료 처리 중…');
    await recordPayment({
      transactionId: TRANSACTION_ID,
      amount: AMOUNT_FROM_URL,
      cardName: CARD_NAME,
      authDatetime: AUTH_DATETIME,
      authNumber: AUTH_NUMBER,
    });
    window.parent.postMessage({ type: 'lmp-tool-complete' }, '*');
    showResult('success', '결제가 완료되었어요',
      CONFIG.successMessage || '결제하신 권한이 부여되었어요.',
      { amount: AMOUNT_FROM_URL, orderName: CONFIG.productName, method: CARD_NAME, approvedAt: AUTH_DATETIME });
    return;
  }

  // 이미 결제했는지 확인 (로그인된 사용자만)
  if (ctxUserId && ctxProjectId) {
    try {
      const u = await db.collection('cms_users_' + ctxProjectId).doc(ctxUserId).get();
      const paidConfigs = u.exists ? (u.data().paidConfigs || {}) : {};
      if (paidConfigs[CONFIG_ID]) {
        showResult('already', '이미 결제 완료된 상품이에요',
          CONFIG.successMessage || '결제하신 권한이 이미 부여되어 있어요.',
          { amount: paidConfigs[CONFIG_ID].amount, orderName: CONFIG.productName });
        window.parent.postMessage({ type: 'lmp-tool-complete' }, '*');
        return;
      }
    } catch (e) { console.warn('paid check failed:', e); }
  }

  // 결제창 렌더
  await renderPayScreen();
}

async function renderPayScreen() {
  if (!MERCHANT_ID) { showError('관리자가 페이업 가맹점 ID를 설정해야 해요.'); return; }
  if (!CONFIG.amount || CONFIG.amount < 100) { showError('결제 금액이 올바르지 않아요. (최소 100원)'); return; }

  document.getElementById('p-title').textContent   = applyVars(CONFIG.title || '결제');
  document.getElementById('p-amount').textContent  = Number(CONFIG.amount).toLocaleString();
  if (CONFIG.description) {
    const d = document.getElementById('p-desc');
    d.innerHTML = applyVars(CONFIG.description);
    d.style.display = 'block';
  }

  try {
    await loadSdk();
  } catch (e) {
    showError('결제 모듈을 불러오지 못했어요: ' + (e.message || ''));
    return;
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('pay-btn').onclick = onPayBtnClick;

  // 확인 화면 이벤트
  const agree = document.getElementById('pc-agree');
  const okBtn = document.getElementById('pc-ok-btn');
  agree.onchange = () => { okBtn.disabled = !agree.checked; };
  okBtn.onclick  = onPayClick;
  document.getElementById('pc-back-btn').onclick = () => {
    document.getElementById('pay-screen').style.display = 'block';
    document.getElementById('pay-confirm').classList.remove('on');
  };
}

function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768;
}

function onPayBtnClick() {
  // 최종 확인 화면 표시
  const amount = Number(CONFIG.amount).toLocaleString();
  const rows = [
    ['상품명', CONFIG.productName || CONFIG.title || '-'],
    ['결제 금액', amount + '원'],
  ];
  document.getElementById('pc-summary').innerHTML =
    rows.map(([l,v]) => `<div class="pc-summary-row"><span class="pc-summary-label">${l}</span><span>${v}</span></div>`).join('');

  // 이메일 문의처 (site settings에서 읽거나 빈 문자열)
  document.getElementById('pc-email').textContent = window._siteEmail || '관리자에게 문의해주세요';

  document.getElementById('pc-agree').checked = false;
  document.getElementById('pc-ok-btn').disabled = true;
  document.getElementById('pay-screen').style.display = 'none';
  document.getElementById('pay-confirm').classList.add('on');
}

async function onPayClick() {
  const btn = document.getElementById('pc-ok-btn');
  btn.disabled = true;
  btn.textContent = '결제창 여는 중…';

  const orderNumber = 'ord_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  const userName = ctxUserFields?.name || ctxUserFields?.이름 || '고객';

  // 서버 승인 엔드포인트 URL (id, projectId, userId를 쿼리로 전달)
  const confirmBase = new URL('/api/confirm-payup', location.origin);
  confirmBase.searchParams.set('id', CONFIG_ID);
  if (ctxProjectId) confirmBase.searchParams.set('projectId', ctxProjectId);
  if (ctxUserId)    confirmBase.searchParams.set('userId',    ctxUserId);

  const data = {
    merchantId:  MERCHANT_ID,
    itemName:    CONFIG.productName || CONFIG.title || '결제',
    amount:      String(CONFIG.amount),
    userName,
    orderNumber,
  };
  if (isMobile()) data.returnUrl = confirmBase.toString();

  // PC: 인증 완료 시 payupPaymentSubmit 콜백이 호출됨 — 전역으로 노출
  window._payupConfirmUrl  = confirmBase.toString();
  window._payupOrderNumber = orderNumber;

  try {
    goPayupPay(data);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '결제하기';
    alert('결제 요청 실패: ' + (e?.message || e));
  }
}

// PC 인증 완료 콜백 — SDK가 호출 (함수명 변경 불가)
function payupPaymentSubmit(payForm) {
  const form = document.getElementById(payForm) || document.getElementById('PayupPaymentStandardForm');
  if (!form) return;
  // 서버로 configId / projectId / userId 전달용 hidden input 추가
  [['configId', CONFIG_ID], ['projectId', ctxProjectId], ['userId', ctxUserId]].forEach(([n, v]) => {
    const inp = document.createElement('input');
    inp.type = 'hidden'; inp.name = n; inp.value = v || '';
    form.appendChild(inp);
  });
  form.method = 'POST';
  form.action = window._payupConfirmUrl || ('/api/confirm-payup?id=' + CONFIG_ID);
  form.submit();
}

// PC 결제창 닫기 콜백 — SDK가 호출 (함수명 변경 불가)
function payupPaymentClose() {
  const btn = document.getElementById('pc-ok-btn');
  if (btn) {
    btn.disabled = !document.getElementById('pc-agree')?.checked;
    btn.textContent = '결제 진행하기';
  }
}

async function recordPayment(d) {
  try {
    await db.collection('cms_payment_records').doc(d.transactionId).set({
      transactionId: d.transactionId,
      orderName:     CONFIG.productName || CONFIG.title || '',
      amount:        Number(d.amount),
      cardName:      d.cardName     || '',
      authNumber:    d.authNumber   || '',
      authDatetime:  d.authDatetime || '',
      configId:      CONFIG_ID,
      configTitle:   CONFIG.title || '',
      tier:          CONFIG.tier  || '',
      projectId:     ctxProjectId,
      userId:        ctxUserId,
      userFields:    ctxUserFields || {},
      pg:            'payup',
      createdAt:     firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
  } catch (e) { console.error('record write failed:', e); }

  if (ctxUserId && ctxProjectId) {
    try {
      const update = {
        [`paidConfigs.${CONFIG_ID}`]: {
          paidAt:        firebase.firestore.FieldValue.serverTimestamp(),
          amount:        Number(d.amount),
          tier:          CONFIG.tier || '',
          transactionId: d.transactionId,
        },
      };
      if (CONFIG.tier) update.paidTiers = firebase.firestore.FieldValue.arrayUnion(CONFIG.tier);
      await db.collection('cms_users_' + ctxProjectId).doc(ctxUserId).update(update);
    } catch (e) { console.error('user update failed:', e); }
  }
}

function showResult(kind, title, msg, receipt) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('status-msg').classList.remove('on');
  document.getElementById('app').style.display = 'block';
  document.getElementById('pay-screen').style.display = 'none';
  document.getElementById('pay-result').classList.add('on');
  document.getElementById('r-icon').textContent  = kind === 'success' ? '✅' : kind === 'already' ? '✓' : '⚠️';
  document.getElementById('r-title').textContent = title;
  document.getElementById('r-msg').innerHTML   = applyVars(msg);
  if (receipt) {
    const r = document.getElementById('r-receipt');
    const lines = [];
    if (receipt.orderName)  lines.push(`<div><b>${esc(receipt.orderName)}</b></div>`);
    if (receipt.amount != null) lines.push(`<div>금액: ${Number(receipt.amount).toLocaleString()}원</div>`);
    if (receipt.method)     lines.push(`<div>결제카드: ${esc(receipt.method)}</div>`);
    if (receipt.approvedAt) {
      const dt = String(receipt.approvedAt);
      // YYYYMMDDHHMMSS → YYYY-MM-DD HH:MM
      const fmt = dt.length >= 12
        ? `${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)} ${dt.slice(8,10)}:${dt.slice(10,12)}`
        : dt;
      lines.push(`<div>승인: ${esc(fmt)}</div>`);
    }
    r.innerHTML = lines.join('');
    r.style.display = 'block';
  }
}

window.parent.postMessage({ type: 'lmp-ready' }, '*');
init();
</script>
</body>
</html>
