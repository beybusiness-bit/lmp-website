<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>결제</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--lmp-block-bg:#fff;--lmp-input-bg:transparent;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:transparent;color:#000;}

.lmp-btn{display:block;width:100%;padding:14px 18px;background:#000;color:var(--lmp-block-bg);border:2px solid #000;border-radius:0;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.2px;transition:background .15s,color .15s;}
.lmp-btn:hover,.lmp-btn:active{background:var(--lmp-block-bg);color:#000;}
.lmp-btn:disabled{opacity:.35;cursor:default;}

#app{padding:24px 20px;}
#loading,#err-screen{padding:40px 20px;text-align:center;font-size:14px;font-weight:600;}
#loading{color:rgba(0,0,0,.5);}
#err-screen{display:none;color:#c00;}
#err-screen.on{display:block;}

.pay-head{margin-bottom:20px;}
.pay-title{font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.4;margin-bottom:6px;}
.pay-amount{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px;}
.pay-amount .won{font-size:18px;font-weight:700;margin-left:2px;}
.pay-desc{font-size:13px;line-height:1.7;color:rgba(0,0,0,.6);margin-top:14px;padding:12px 14px;border:1.5px solid rgba(0,0,0,.12);background:rgba(0,0,0,.02);}

/* 옵션 선택 */
.opt-item{border:2px solid rgba(0,0,0,.15);padding:14px 16px;display:flex;align-items:center;cursor:pointer;transition:border-color .15s,background .15s;}
.opt-item+.opt-item{margin-top:10px;}
.opt-item:active{border-color:rgba(0,0,0,.5);}
.opt-item.sel{border-color:#000;background:rgba(0,0,0,.04);}
.opt-sel-mark{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.2);flex-shrink:0;margin-right:12px;display:flex;align-items:center;justify-content:center;font-size:10px;transition:border-color .15s,background .15s;}
.opt-item.sel .opt-sel-mark{border-color:#000;background:#000;color:#fff;}
.opt-item-label{font-size:15px;font-weight:700;letter-spacing:-.2px;flex:1;}
.opt-item-price{font-size:15px;font-weight:900;white-space:nowrap;margin-left:8px;color:rgba(0,0,0,.75);}
.opt-item-img{width:52px;height:52px;object-fit:cover;flex-shrink:0;margin-right:12px;}
.pay-desc img{max-width:100%;height:auto;display:block;margin:8px 0;}

/* 주관식 질문 */
.qs-field{margin-bottom:16px;}
.qs-field-label{font-size:13px;font-weight:700;margin-bottom:6px;letter-spacing:-.2px;display:block;}
.qs-field input,.qs-field textarea{width:100%;padding:10px 12px;border:2px solid rgba(0,0,0,.15);font-size:14px;font-family:inherit;background:var(--lmp-input-bg,transparent);outline:none;}
.qs-field input:focus,.qs-field textarea:focus{border-color:#000;}
.qs-field textarea{resize:vertical;min-height:72px;line-height:1.5;}

#pay-result{display:none;text-align:center;padding:30px 16px;}
#pay-result.on{display:block;}
.pay-result-icon{font-size:48px;margin-bottom:12px;}
.pay-result-title{font-size:17px;font-weight:800;margin-bottom:10px;letter-spacing:-.3px;}
.pay-result-msg{font-size:13px;line-height:1.6;color:rgba(0,0,0,.7);margin-bottom:18px;}
.pay-receipt{margin-top:18px;padding:14px;border:1.5px solid rgba(0,0,0,.15);text-align:left;font-size:12px;line-height:1.7;color:rgba(0,0,0,.65);}
.pay-receipt b{font-weight:700;color:#000;}

#status-msg{display:none;padding:40px 20px;text-align:center;font-size:14px;color:rgba(0,0,0,.55);font-weight:600;}
#status-msg.on{display:block;}

/* 결제 전 확인 화면 */
#pay-confirm{display:none;padding:0;}
#pay-confirm.on{display:block;}
.pc-summary{border:2px solid #000;padding:16px;margin-bottom:18px;}
.pc-summary-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.08);gap:12px;}
.pc-summary-row:last-child{border-bottom:none;padding-top:10px;font-weight:900;font-size:16px;}
.pc-summary-label{color:rgba(0,0,0,.55);font-weight:600;flex-shrink:0;}
.pc-summary-value{text-align:right;word-break:break-all;}
.pc-notice{background:rgba(0,0,0,.04);border-left:3px solid #000;padding:12px 14px;font-size:12px;line-height:1.7;color:rgba(0,0,0,.65);margin-bottom:18px;}
.pc-agree-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;cursor:pointer;}
.pc-agree-row input[type=checkbox]{width:18px;height:18px;flex-shrink:0;margin-top:1px;cursor:pointer;accent-color:#000;}
.pc-agree-label{font-size:13px;font-weight:600;line-height:1.5;color:#000;}
.pc-back{background:transparent;border:2px solid rgba(0,0,0,.25);color:rgba(0,0,0,.55);width:100%;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;}
.pc-back:active{background:rgba(0,0,0,.05);}

/* 수량 선택 */
#qty-row{display:none;border:1.5px solid rgba(0,0,0,.15);padding:12px 16px;margin-bottom:16px;}
.qty-inner{display:flex;align-items:center;justify-content:space-between;}
.qty-label{font-size:14px;font-weight:700;}
.qty-ctrl{display:flex;align-items:center;gap:10px;}
.qty-btn{width:32px;height:32px;border:2px solid #000;background:none;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-family:inherit;}
.qty-btn:disabled{opacity:.25;cursor:default;}
#qty-display{font-size:20px;font-weight:900;min-width:32px;text-align:center;}
#qty-unit-price{font-size:11px;color:rgba(0,0,0,.45);margin-top:4px;}

/* 결제 내역 */
#pay-history{display:none;padding:0;}
#pay-history.on{display:block;}
.hist-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.hist-head-title{font-size:16px;font-weight:800;letter-spacing:-.3px;}
.hist-back{background:none;border:none;font-size:13px;font-weight:700;cursor:pointer;color:rgba(0,0,0,.5);padding:0;}
.hist-item{border:1.5px solid rgba(0,0,0,.12);padding:14px;margin-bottom:10px;}
.hist-item-name{font-size:14px;font-weight:700;margin-bottom:4px;}
.hist-item-amount{font-size:20px;font-weight:900;letter-spacing:-.3px;margin-bottom:6px;}
.hist-item-meta{font-size:11px;color:rgba(0,0,0,.45);line-height:1.6;}
.hist-empty{text-align:center;padding:40px 0;font-size:13px;color:rgba(0,0,0,.4);font-weight:600;}
.hist-link-btn{display:block;width:100%;margin-top:16px;padding:12px;border:2px solid rgba(0,0,0,.2);background:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:rgba(0,0,0,.6);}
.hist-link-btn:active{background:rgba(0,0,0,.04);}
</style>
</head>
<body>
<div id="payup_layer"></div>
<div id="bg_layer"></div>
<div id="loading">불러오는 중…</div>
<div id="err-screen"></div>
<div id="status-msg"></div>
<div id="app" style="display:none;">
  <div id="pay-screen">
    <div class="pay-head">
      <div class="pay-title" id="p-title"></div>
      <div class="pay-amount"><span id="p-amount">0</span><span class="won">원</span></div>
      <div id="pay-opts-hint" style="display:none;font-size:11px;color:rgba(0,0,0,.45);margin-top:2px;margin-bottom:4px;">선택 옵션에 따라 금액이 결정됩니다</div>
      <div class="pay-desc" id="p-desc" style="display:none;"></div>
    </div>
    <div id="qty-row">
      <div class="qty-inner">
        <span class="qty-label">수량</span>
        <div class="qty-ctrl">
          <button class="qty-btn" id="qty-minus" onclick="changeQty(-1)">−</button>
          <span id="qty-display">1</span>
          <button class="qty-btn" id="qty-plus"  onclick="changeQty(1)">+</button>
        </div>
      </div>
      <div id="qty-unit-price"></div>
      <div id="stock-remaining-info" style="display:none;font-size:12px;color:rgba(0,0,0,.55);font-weight:600;margin-top:6px;"><span id="stock-remaining-text"></span></div>
    </div>
    <div id="stock-info-no-qty" style="display:none;font-size:12px;color:rgba(0,0,0,.55);font-weight:600;margin-bottom:12px;"><span id="stock-info-no-qty-text"></span></div>
    <button class="lmp-btn" id="pay-btn">결제하기</button>
  </div>

  <!-- 옵션 선택 화면 -->
  <div id="pay-options" style="display:none;">
    <div class="pay-head">
      <div class="pay-title" id="opts-title"></div>
      <div style="font-size:13px;color:rgba(0,0,0,.5);margin-top:2px;">원하는 옵션을 선택해주세요</div>
    </div>
    <div id="opts-list" style="margin-bottom:20px;"></div>
    <button class="lmp-btn" id="opts-next-btn" disabled>선택 완료</button>
    <button class="pc-back" id="opts-back-btn">← 돌아가기</button>
  </div>

  <!-- 주관식 질문 화면 -->
  <div id="pay-questions" style="display:none;">
    <div class="pay-head">
      <div class="pay-title">추가 정보 입력</div>
      <div style="font-size:13px;color:rgba(0,0,0,.5);margin-top:2px;">결제 전 아래 내용을 알려주세요</div>
    </div>
    <div id="qs-form" style="margin-bottom:20px;"></div>
    <button class="lmp-btn" id="qs-next-btn">다음</button>
    <button class="pc-back" id="qs-back-btn">← 돌아가기</button>
  </div>

  <!-- 결제 전 최종 확인 화면 -->
  <div id="pay-confirm">
    <div class="pc-summary" id="pc-summary"></div>
    <div class="pc-notice">
      본 상품은 디지털 콘텐츠로, 결제 완료 및 서비스 이용 즉시 전자상거래법 제17조에 따라 청약철회가 제한됩니다.
      문의: <span id="pc-email" style="font-weight:700;"></span>
    </div>
    <label class="pc-agree-row">
      <input type="checkbox" id="pc-agree">
      <span class="pc-agree-label">위 내용을 확인하였으며, 이에 동의합니다.</span>
    </label>
    <button class="lmp-btn" id="pc-ok-btn" disabled>결제 진행하기</button>
    <button class="pc-back" id="pc-back-btn">← 돌아가기</button>
  </div>

  <div id="pay-result">
    <div class="pay-result-icon" id="r-icon">✅</div>
    <div class="pay-result-title" id="r-title"></div>
    <div class="pay-result-msg" id="r-msg"></div>
    <div class="pay-receipt" id="r-receipt" style="display:none;"></div>
    <button class="hist-link-btn" id="r-hist-btn" style="display:none;" onclick="showHistory()">내 결제 내역 보기</button>
    <button class="hist-link-btn" id="r-retry-btn" style="display:none;" onclick="retryPayment()">↩ 프로젝트로 돌아가기</button>
  </div>

  <!-- 결제 내역 화면 -->
  <div id="pay-history">
    <div class="hist-head">
      <div class="hist-head-title">내 결제 내역</div>
      <button class="hist-back" onclick="hideHistory()">← 닫기</button>
    </div>
    <div id="hist-list"></div>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC8uy09XOeEYIs1m3Rga5BMqd7gS7o3roI",
  authDomain: "beyhome-admin.firebaseapp.com",
  projectId: "beyhome-admin",
  storageBucket: "beyhome-admin.firebasestorage.app",
  messagingSenderId: "849320781553",
  appId: "1:849320781553:web:9d844044e85995c0aa2b50"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

const urlParams = new URLSearchParams(location.search);
const CONFIG_ID       = urlParams.get('id') || '';
const RESULT          = urlParams.get('result') || '';
const TRANSACTION_ID  = urlParams.get('transactionId') || '';
const AMOUNT_FROM_URL = urlParams.get('amount') || '';
const CARD_NAME       = urlParams.get('cardName') || '';
const AUTH_DATETIME   = urlParams.get('authDatetime') || '';
const AUTH_NUMBER     = urlParams.get('authNumber') || '';
const FAIL_MSG        = urlParams.get('message') || '';
const URL_PROJECT_ID  = urlParams.get('projectId') || '';
const URL_USER_ID     = urlParams.get('userId') || '';

let CONFIG = null;
let MERCHANT_ID = '';
let IS_TEST = false;
let SMS_WEBHOOK_URL = '';
let SMS_PHONE_FIELD = '';
let ctxProjectId = URL_PROJECT_ID;
let ctxUserId    = URL_USER_ID;
let ctxUserFields = {};

let ctxReceived = false;
let resolveCtx;
const ctxPromise = new Promise(res => { resolveCtx = res; });

let selectedOption = null;  // { label, price, tier?, stockRemaining? } | null
let questionAnswers = {};   // { [label]: answer }
let selectedQty = 1;
let qtyMaxAllowed = null;   // per-user remaining (null = unlimited)
let _waitingForLogin = false;

window.addEventListener('message', e => {
  if (e.data?.type !== 'lmp-context') return;
  ctxProjectId  = e.data.projectId  || ctxProjectId;
  ctxUserId     = e.data.userId     || ctxUserId;
  ctxUserFields = e.data.userFields || {};
  if (e.data.blockBg) { document.documentElement.style.setProperty('--lmp-block-bg', e.data.blockBg); document.documentElement.style.setProperty('--lmp-input-bg', e.data.blockBg); }
  if (!ctxReceived) { ctxReceived = true; resolveCtx(); }
  if (_waitingForLogin && ctxUserId) { _waitingForLogin = false; onPayClick(); }
});

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function applyVars(str) {
  if (!str) return '';
  return str.replace(/\{\{(\w+)\}\}/g, (_, key) => {
    const v = ctxUserFields[key];
    return v != null ? String(v) : '{{' + key + '}}';
  });
}
function setStatus(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.classList.add('on');
}
function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('err-screen');
  el.textContent = msg;
  el.classList.add('on');
}

async function loadConfig() {
  if (!CONFIG_ID) { showError('결제 설정 ID가 없어요. 관리자에게 문의해주세요.'); return false; }
  try {
    const doc = await db.collection('cms_payment_configs').doc(CONFIG_ID).get();
    if (!doc.exists) { showError('결제 설정을 찾을 수 없어요.'); return false; }
    CONFIG = doc.data();
    const [paySettings, siteSettings] = await Promise.all([
      db.collection('cms_admin_settings').doc('payment').get(),
      db.collection('cms_admin_settings').doc('site').get(),
    ]);
    if (paySettings.exists) {
      const ps = paySettings.data();
      MERCHANT_ID     = ps.payupMerchantId || '';
      IS_TEST         = !!(ps.payupTestMode);
      SMS_WEBHOOK_URL = ps.smsWebhookUrl   || '';
      SMS_PHONE_FIELD = ps.smsPhoneField   || '';
    }
    if (siteSettings.exists) {
      window._siteEmail = siteSettings.data().footerEmail || '';
    }
    return true;
  } catch (e) {
    showError('설정을 불러오지 못했어요: ' + (e.message || ''));
    return false;
  }
}

function loadSdk() {
  return new Promise((resolve, reject) => {
    const src = IS_TEST
      ? 'https://standard.testpayup.co.kr/assets/js/payup_standard_dev-1.0.js'
      : 'https://standard.payup.co.kr/assets/js/payup_standard-1.0.js';
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('페이업 SDK 로드 실패'));
    document.head.appendChild(s);
  });
}

async function init() {
  await Promise.race([ctxPromise, new Promise(r => setTimeout(r, 1500))]);

  const ok = await loadConfig();
  if (!ok) return;

  if (RESULT === 'fail') {
    showResult('fail', '결제가 실패했어요', FAIL_MSG || '결제를 다시 시도해주세요.', null);
    return;
  }

  if (RESULT === 'success' && TRANSACTION_ID) {
    try {
      selectedOption  = JSON.parse(sessionStorage.getItem('py_selectedOption') || 'null');
      questionAnswers = JSON.parse(sessionStorage.getItem('py_questionAnswers') || '{}');
      selectedQty     = parseInt(sessionStorage.getItem('py_selectedQty') || '1') || 1;
      sessionStorage.removeItem('py_selectedOption');
      sessionStorage.removeItem('py_questionAnswers');
      sessionStorage.removeItem('py_selectedQty');
    } catch(e) {}

    setStatus('결제 완료 처리 중…');
    await recordPayment({
      transactionId: TRANSACTION_ID,
      amount:        AMOUNT_FROM_URL,
      cardName:      CARD_NAME,
      authDatetime:  AUTH_DATETIME,
      authNumber:    AUTH_NUMBER,
    });
    fireSmsWebhook(AMOUNT_FROM_URL, CONFIG.productName || CONFIG.title || '', selectedQty);
    window.parent.postMessage({ type: 'lmp-tool-complete' }, '*');
    // 팝업으로 열린 경우 opener(플레이어 최상위)에도 신호 전달
    try { if (window.opener) window.opener.postMessage({ type: 'lmp-tool-complete' }, '*'); } catch(e) {}
    showResult('success', '결제가 완료되었어요',
      CONFIG.successMessage || '결제하신 권한이 부여되었어요.',
      { amount: AMOUNT_FROM_URL, orderName: CONFIG.productName, method: CARD_NAME,
        approvedAt: AUTH_DATETIME, selectedOption: selectedOption?.label || '' });
    // 스탠드얼론(iframe 밖) 환경에서는 3초 후 플레이어로 자동 이동
    if (ctxProjectId && window.parent === window) {
      setTimeout(() => { location.href = '/' + ctxProjectId + '/'; }, 3000);
    }
    return;
  }

  // 글로벌 품절 체크 (옵션 없는 상품만 — 옵션 있으면 옵션별로 처리)
  const hasOpts = (CONFIG.options || []).length > 0;
  if (CONFIG.stockEnabled && !hasOpts && CONFIG.stockRemaining != null && CONFIG.stockRemaining <= 0) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('pay-screen').style.display = 'block';
    document.getElementById('p-title').textContent = CONFIG.title || '결제';
    document.getElementById('p-amount').textContent = '0';
    const btn = document.getElementById('pay-btn');
    btn.textContent = '품절되었습니다';
    btn.disabled = true;
    if (CONFIG.description) {
      const d = document.getElementById('p-desc');
      d.innerHTML = applyVars(CONFIG.description);
      d.style.display = 'block';
    }
    return;
  }

  if (ctxUserId && ctxProjectId) {
    try {
      const u = await db.collection('cms_users_' + ctxProjectId).doc(ctxUserId).get();
      const paidConfigs = u.exists ? (u.data().paidConfigs || {}) : {};
      if (paidConfigs[CONFIG_ID]) {
        if (!CONFIG.qtyEnabled) {
          showResult('already', '이미 결제 완료된 상품이에요',
            CONFIG.successMessage || '결제하신 권한이 이미 부여되어 있어요.',
            { amount: paidConfigs[CONFIG_ID].amount, orderName: CONFIG.productName,
              selectedOption: paidConfigs[CONFIG_ID].selectedOption || '' });
          window.parent.postMessage({ type: 'lmp-tool-complete' }, '*');
          return;
        }
        if (CONFIG.qtyPerUser) {
          const alreadyBought = paidConfigs[CONFIG_ID].totalQty || 0;
          const remaining = CONFIG.qtyPerUser - alreadyBought;
          if (remaining <= 0) {
            showResult('already', '구매 한도에 도달했어요',
              `이 상품은 1인당 최대 ${CONFIG.qtyPerUser}개까지 구매할 수 있어요. (이미 ${alreadyBought}개 구매)`,
              null);
            window.parent.postMessage({ type: 'lmp-tool-complete' }, '*');
            return;
          }
          qtyMaxAllowed = remaining;
        }
      }
    } catch (e) { console.warn('paid check failed:', e); }
  }

  await renderPayScreen();
}

async function renderPayScreen() {
  if (!MERCHANT_ID) { showError('관리자가 페이업 가맹점 ID를 설정해야 해요.'); return; }
  if (!CONFIG.amount || CONFIG.amount < 100) { showError('결제 금액이 올바르지 않아요. (최소 100원)'); return; }

  document.getElementById('p-title').textContent = applyVars(CONFIG.title || '결제');

  const opts = CONFIG.options || [];
  if (opts.length) {
    document.getElementById('p-amount').textContent = '0';
    document.getElementById('pay-opts-hint').style.display = 'none';
    renderInlineOptions(opts);
    document.getElementById('pay-btn').textContent = '결제하기';
    document.getElementById('pay-btn').disabled = true;
  } else {
    document.getElementById('p-amount').textContent = Number(CONFIG.amount).toLocaleString();
  }

  if (CONFIG.description) {
    const d = document.getElementById('p-desc');
    d.innerHTML = applyVars(CONFIG.description);
    d.style.display = 'block';
  }

  try {
    await loadSdk();
  } catch (e) {
    showError('결제 모듈을 불러오지 못했어요: ' + (e.message || ''));
    return;
  }

  if (CONFIG.qtyEnabled) {
    const qMin = CONFIG.qtyMin || 1;
    const qMax = qtyMaxAllowed !== null
      ? (CONFIG.qtyMax ? Math.min(CONFIG.qtyMax, qtyMaxAllowed) : qtyMaxAllowed)
      : (CONFIG.qtyMax || null);
    selectedQty = qMin;
    document.getElementById('qty-display').textContent = selectedQty;
    document.getElementById('qty-row').style.display = 'block';
    updateQtyButtons(qMin, qMax);
    updateQtyUnitPrice();
    document.getElementById('qty-row').dataset.min = qMin;
    document.getElementById('qty-row').dataset.max = qMax || '';
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('pay-btn').onclick = onPayBtnClick;
  updateStockDisplay();

  const agree = document.getElementById('pc-agree');
  const okBtn = document.getElementById('pc-ok-btn');
  agree.onchange = () => { okBtn.disabled = !agree.checked; };
  okBtn.onclick  = onPayClick;
  document.getElementById('pc-back-btn').onclick = goBackFromConfirm;
}

function isOptSoldOut(o) {
  const rem = o.stockRemaining ?? o.stockTotal;
  return CONFIG.stockEnabled && rem != null && rem <= 0;
}

function renderInlineOptions(opts) {
  const existing = document.getElementById('inline-opts-container');
  if (existing) existing.remove();
  const container = document.createElement('div');
  container.id = 'inline-opts-container';
  container.style.cssText = 'margin-bottom:16px;';
  container.innerHTML = opts.map((o, i) => {
    const price = o.price != null ? o.price : CONFIG.amount;
    const imgHtml = o.imageUrl ? `<img class="opt-item-img" src="${esc(o.imageUrl)}">` : '';
    const isSel = selectedOption?.label === o.label;
    const soldOut = isOptSoldOut(o);
    const optRemaining = o.stockRemaining ?? o.stockTotal;
    const stockLabel = CONFIG.stockEnabled && !soldOut && optRemaining != null
      && CONFIG.stockDisplayEnabled
      && (CONFIG.stockDisplayThreshold == null || optRemaining <= CONFIG.stockDisplayThreshold)
      ? `<span style="font-size:10px;color:rgba(200,60,0,.85);margin-left:6px;font-weight:700;">${optRemaining}개 남음</span>` : '';
    const soldOutLabel = soldOut ? `<span style="font-size:11px;color:rgba(0,0,0,.35);margin-left:6px;">품절</span>` : '';
    const dimStyle = soldOut ? 'opacity:.4;pointer-events:none;' : '';
    return `<div class="opt-item${isSel?' sel':''}" data-idx="${i}" onclick="${soldOut?'':('selectInlineOption('+i+')')}" style="margin-bottom:10px;${dimStyle}">
      ${imgHtml}<div class="opt-sel-mark">${isSel?'✓':''}</div>
      <div style="flex:1;min-width:0;"><span class="opt-item-label">${esc(o.label || ('옵션 ' + (i + 1)))}</span>${soldOutLabel}${stockLabel}</div>
      <span class="opt-item-price">${Number(price).toLocaleString()}원</span>
    </div>`;
  }).join('');
  const payBtn = document.getElementById('pay-btn');
  payBtn.parentNode.insertBefore(container, payBtn);
}

function selectInlineOption(idx) {
  const o = CONFIG.options[idx];
  if (isOptSoldOut(o)) return;
  selectedOption = { label: o.label, price: o.price != null ? o.price : CONFIG.amount, tier: o.tier || '', stockRemaining: o.stockRemaining ?? o.stockTotal };
  document.querySelectorAll('#inline-opts-container .opt-item').forEach((el, i) => {
    el.classList.toggle('sel', i === idx);
    const mark = el.querySelector('.opt-sel-mark');
    if (mark) mark.textContent = i === idx ? '✓' : '';
  });
  document.getElementById('p-amount').textContent = Number(selectedOption.price).toLocaleString();
  document.getElementById('pay-opts-hint').style.display = 'none';
  document.getElementById('pay-btn').disabled = false;
  if (CONFIG.qtyEnabled) updateQtyUnitPrice();
  updateStockDisplay();
}

function changeQty(delta) {
  const row = document.getElementById('qty-row');
  const qMin = parseInt(row.dataset.min) || 1;
  const qMax = row.dataset.max ? parseInt(row.dataset.max) : null;
  selectedQty = Math.max(qMin, selectedQty + delta);
  if (qMax) selectedQty = Math.min(qMax, selectedQty);
  document.getElementById('qty-display').textContent = selectedQty;
  updateQtyButtons(qMin, qMax);
  updateQtyUnitPrice();
  updateStockDisplay();
}
function updateQtyButtons(qMin, qMax) {
  document.getElementById('qty-minus').disabled = selectedQty <= qMin;
  document.getElementById('qty-plus').disabled  = qMax !== null && selectedQty >= qMax;
}
function updateQtyUnitPrice() {
  const unitEl = document.getElementById('qty-unit-price');
  if (!unitEl || selectedQty <= 1) { if(unitEl) unitEl.textContent = ''; return; }
  const unitPrice = selectedOption ? selectedOption.price : CONFIG.amount;
  const total = unitPrice * selectedQty;
  unitEl.textContent = `단가 ${Number(unitPrice).toLocaleString()}원 × ${selectedQty} = 합계 ${Number(total).toLocaleString()}원`;
}
function updateStockDisplay() {
  if (!CONFIG.stockEnabled || !CONFIG.stockDisplayEnabled) {
    document.getElementById('stock-remaining-info').style.display = 'none';
    document.getElementById('stock-info-no-qty').style.display = 'none';
    return;
  }
  const opts = CONFIG.options || [];
  let remaining = null;
  if (opts.length) {
    remaining = selectedOption?.stockRemaining ?? null;
  } else {
    remaining = CONFIG.stockRemaining ?? CONFIG.stockTotal ?? null;
  }
  if (remaining === null) {
    document.getElementById('stock-remaining-info').style.display = 'none';
    document.getElementById('stock-info-no-qty').style.display = 'none';
    return;
  }
  const threshold = CONFIG.stockDisplayThreshold;
  const shouldShow = threshold == null || remaining <= threshold;
  const txt = `${remaining}개 남음`;
  if (CONFIG.qtyEnabled) {
    const el = document.getElementById('stock-remaining-info');
    const textEl = document.getElementById('stock-remaining-text');
    if (el && textEl) { textEl.textContent = txt; el.style.display = shouldShow ? '' : 'none'; }
    document.getElementById('stock-info-no-qty').style.display = 'none';
  } else {
    const el = document.getElementById('stock-info-no-qty');
    const textEl = document.getElementById('stock-info-no-qty-text');
    if (el && textEl) { textEl.textContent = txt; el.style.display = shouldShow ? '' : 'none'; }
    document.getElementById('stock-remaining-info').style.display = 'none';
  }
}

function goBackFromConfirm() {
  document.getElementById('pay-confirm').classList.remove('on');
  const qs   = CONFIG.questions || [];
  if (qs.length) {
    renderQuestionsScreen('from-screen');
  } else {
    document.getElementById('pay-screen').style.display = 'block';
  }
}

function renderOptionsScreen() {
  const opts = CONFIG.options || [];
  document.getElementById('opts-title').textContent = applyVars(CONFIG.title || '옵션 선택');

  const listEl = document.getElementById('opts-list');
  listEl.innerHTML = opts.map((o, i) => {
    const price = o.price != null ? o.price : CONFIG.amount;
    return `<div class="opt-item" data-idx="${i}" onclick="selectOption(${i})">
      <div class="opt-sel-mark">✓</div>
      <span class="opt-item-label">${esc(o.label || ('옵션 ' + (i + 1)))}</span>
      <span class="opt-item-price">${Number(price).toLocaleString()}원</span>
    </div>`;
  }).join('');

  if (selectedOption) {
    const idx = opts.findIndex(o => o.label === selectedOption.label);
    if (idx >= 0) {
      listEl.querySelectorAll('.opt-item')[idx]?.classList.add('sel');
      document.getElementById('opts-next-btn').disabled = false;
    }
  } else {
    document.getElementById('opts-next-btn').disabled = true;
  }

  document.getElementById('opts-next-btn').onclick = () => {
    if (!selectedOption) return;
    if ((CONFIG.questions || []).length) {
      renderQuestionsScreen('from-options');
    } else {
      onPayBtnClick();
    }
  };
  document.getElementById('opts-back-btn').onclick = () => {
    document.getElementById('pay-options').style.display = 'none';
    document.getElementById('pay-screen').style.display = 'block';
  };

  document.getElementById('pay-screen').style.display = 'none';
  document.getElementById('pay-questions').style.display = 'none';
  document.getElementById('pay-confirm').classList.remove('on');
  document.getElementById('pay-options').style.display = 'block';
}

function selectOption(idx) {
  const o = CONFIG.options[idx];
  selectedOption = { label: o.label, price: o.price != null ? o.price : CONFIG.amount };
  document.querySelectorAll('.opt-item').forEach((el, i) => el.classList.toggle('sel', i === idx));
  document.getElementById('opts-next-btn').disabled = false;
}

function renderQuestionsScreen(from) {
  const qs = CONFIG.questions || [];
  const form = document.getElementById('qs-form');
  form.innerHTML = qs.map((q, i) => {
    const reqMark = q.required !== false ? '<span style="color:#c00;margin-left:2px;">*</span>' : '';
    const existingVal = questionAnswers[q.label] || '';
    const inp = q.type === 'textarea'
      ? `<textarea class="qs-input" data-idx="${i}" rows="3">${esc(existingVal)}</textarea>`
      : `<input class="qs-input" data-idx="${i}" type="text" value="${esc(existingVal)}">`;
    return `<div class="qs-field"><span class="qs-field-label">${esc(q.label)}${reqMark}</span>${inp}</div>`;
  }).join('');

  document.getElementById('qs-next-btn').onclick = () => {
    const missing = qs.some((q, i) => {
      if (q.required === false) return false;
      return !(form.querySelector(`.qs-input[data-idx="${i}"]`)?.value.trim());
    });
    if (missing) { alert('필수 항목을 모두 입력해주세요.'); return; }
    questionAnswers = {};
    qs.forEach((q, i) => {
      const el = form.querySelector(`.qs-input[data-idx="${i}"]`);
      questionAnswers[q.label] = el?.value.trim() || '';
    });
    onPayBtnClick();
  };

  document.getElementById('qs-back-btn').onclick = () => {
    document.getElementById('pay-questions').style.display = 'none';
    document.getElementById('pay-screen').style.display = 'block';
  };

  document.getElementById('pay-screen').style.display = 'none';
  document.getElementById('pay-options').style.display = 'none';
  document.getElementById('pay-confirm').classList.remove('on');
  document.getElementById('pay-questions').style.display = 'block';
}

function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768;
}

function onPayBtnClick() {
  const opts = CONFIG.options   || [];
  const qs   = CONFIG.questions || [];

  if (opts.length && !selectedOption)                        { return; }  // inline opts — button disabled until selected
  if (qs.length && !Object.keys(questionAnswers).length)     { renderQuestionsScreen('from-screen'); return; }

  const unitPrice = selectedOption ? selectedOption.price : CONFIG.amount;
  const effectiveAmount = unitPrice * selectedQty;
  const rows = [];
  if (selectedOption) rows.push(['선택 옵션', selectedOption.label]);
  rows.push(['상품명', CONFIG.productName || CONFIG.title || '-']);
  Object.entries(questionAnswers).forEach(([label, answer]) => { if (answer) rows.push([label, answer]); });
  if (CONFIG.qtyEnabled && selectedQty > 1) {
    rows.push(['수량', `${selectedQty}개`]);
    rows.push(['단가', Number(unitPrice).toLocaleString() + '원']);
  }
  rows.push(['결제 금액', Number(effectiveAmount).toLocaleString() + '원']);

  document.getElementById('pc-summary').innerHTML =
    rows.map(([l, v]) => `<div class="pc-summary-row"><span class="pc-summary-label">${esc(l)}</span><span class="pc-summary-value">${esc(v)}</span></div>`).join('');

  document.getElementById('pc-email').textContent = window._siteEmail || '관리자에게 문의해주세요';
  document.getElementById('pc-agree').checked = false;
  document.getElementById('pc-ok-btn').disabled = true;

  document.getElementById('pay-screen').style.display = 'none';
  document.getElementById('pay-options').style.display = 'none';
  document.getElementById('pay-questions').style.display = 'none';
  document.getElementById('pay-confirm').classList.add('on');
}

async function onPayClick() {
  if (!ctxUserId) {
    _waitingForLogin = true;
    window.parent.postMessage({ type: 'lmp-request-login', reason: '결제하려면 로그인이 필요해요.' }, '*');
    return;
  }

  const btn = document.getElementById('pc-ok-btn');
  btn.disabled = true;
  btn.textContent = '결제창 여는 중…';

  const unitPrice = selectedOption ? selectedOption.price : CONFIG.amount;
  const effectiveAmount = unitPrice * selectedQty;
  const orderNumber = 'ord_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  const userName = ctxUserFields?.name || ctxUserFields?.이름 || '고객';

  sessionStorage.setItem('py_selectedOption',  JSON.stringify(selectedOption));
  sessionStorage.setItem('py_questionAnswers', JSON.stringify(questionAnswers));
  sessionStorage.setItem('py_selectedQty',     String(selectedQty));
  sessionStorage.setItem('py_orderNumber',     orderNumber);
  sessionStorage.setItem('py_amount',          String(effectiveAmount));

  const confirmBase = new URL('/api/confirm-payup', location.origin);
  confirmBase.searchParams.set('id',          CONFIG_ID);
  confirmBase.searchParams.set('orderNumber', orderNumber);
  if (ctxProjectId) confirmBase.searchParams.set('projectId', ctxProjectId);
  if (ctxUserId)    confirmBase.searchParams.set('userId',    ctxUserId);

  const data = {
    merchantId:  MERCHANT_ID,
    itemName:    CONFIG.productName || CONFIG.title || '결제',
    amount:      String(effectiveAmount),
    userName,
    orderNumber,
  };
  data.returnUrl = confirmBase.toString();

  window._payupConfirmUrl  = confirmBase.toString();
  window._payupOrderNumber = orderNumber;

  window._payupSubmitCalled = false;
  try {
    goPayupPay(data);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '결제 진행하기';
    alert('결제 요청 실패: ' + (e?.message || e));
    return;
  }
  // 60초 후에도 콜백이 없으면 조용히 버튼 복원 (결제창 열기 실패 감지)
  setTimeout(() => {
    if (!window._payupSubmitCalled && btn.disabled) {
      btn.disabled = false;
      btn.textContent = '결제 진행하기';
    }
  }, 60000);
}

function payupPaymentSubmit(formId) {
  window._payupSubmitCalled = true;
  const form = document.getElementById(formId) || document.getElementById('PayupPaymentStandardForm');
  if (form) {
    // SDK가 form.action을 설정하지 못했을 때 직접 보완
    const curHref = location.href.split('?')[0];
    if (!form.action || form.action === curHref || form.action === '') {
      form.action = window._payupConfirmUrl;
      if (!form.method) form.method = 'POST';
    }
    form.submit();
  }
}

function payupPaymentClose() {
  // PayUp 결제창이 닫혔을 때 (취소 또는 오류)
  const btn = document.getElementById('pc-ok-btn');
  if (btn) {
    btn.disabled = false;
    btn.textContent = '결제 진행하기';
  }
  // 동의 체크박스 초기화 후 최종확인 화면으로 복원 (재시도 가능)
  const agree = document.getElementById('pc-agree');
  if (agree) agree.checked = false;
  if (btn) btn.disabled = true;
  document.getElementById('pay-confirm').classList.remove('on');
  document.getElementById('pay-screen').style.display = 'block';
}

async function recordPayment(d) {
  try {
    await db.collection('cms_payment_records').doc(d.transactionId).set({
      transactionId:   d.transactionId,
      orderName:       CONFIG.productName || CONFIG.title || '',
      amount:          Number(d.amount),
      cardName:        d.cardName     || '',
      authNumber:      d.authNumber   || '',
      authDatetime:    d.authDatetime || '',
      configId:        CONFIG_ID,
      configTitle:     CONFIG.title || '',
      tier:            selectedOption?.tier || CONFIG.tier || '',
      projectId:       ctxProjectId,
      userId:          ctxUserId,
      userFields:      ctxUserFields || {},
      selectedOption:  selectedOption  || null,
      questionAnswers: Object.keys(questionAnswers).length ? questionAnswers : null,
      qty:             selectedQty,
      pg:              'payup',
      createdAt:       firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
  } catch (e) { console.error('record write failed:', e); }

  if (ctxUserId && ctxProjectId) {
    try {
      const p = `paidConfigs.${CONFIG_ID}`;
      const update = {
        [`${p}.paidAt`]:          firebase.firestore.FieldValue.serverTimestamp(),
        [`${p}.amount`]:          Number(d.amount),
        [`${p}.tier`]:            selectedOption?.tier || CONFIG.tier || '',
        [`${p}.transactionId`]:   d.transactionId,
        [`${p}.selectedOption`]:  selectedOption?.label || '',
        [`${p}.questionAnswers`]: questionAnswers || {},
        [`${p}.lastQty`]:         selectedQty,
        [`${p}.totalQty`]:        firebase.firestore.FieldValue.increment(selectedQty),
      };
      const effectiveTier = selectedOption?.tier || CONFIG.tier || '';
      if (effectiveTier) update.paidTiers = firebase.firestore.FieldValue.arrayUnion(effectiveTier);
      await db.collection('cms_users_' + ctxProjectId).doc(ctxUserId).update(update);
    } catch (e) { console.error('user update failed:', e); }
  }

  // 재고 차감 (트랜잭션)
  if (CONFIG.stockEnabled) {
    try {
      const configRef = db.collection('cms_payment_configs').doc(CONFIG_ID);
      if (selectedOption) {
        // 옵션별 재고 차감
        await db.runTransaction(async tx => {
          const snap = await tx.get(configRef);
          const options = [...(snap.data()?.options || [])];
          const idx = options.findIndex(o => o.label === selectedOption.label);
          const optRem = options[idx]?.stockRemaining ?? options[idx]?.stockTotal;
          if (idx >= 0 && optRem != null) {
            options[idx].stockRemaining = Math.max(0, optRem - selectedQty);
            tx.update(configRef, { options });
          }
        });
      } else {
        // 글로벌 재고 차감
        await db.runTransaction(async tx => {
          const snap = await tx.get(configRef);
          const rem = snap.data()?.stockRemaining ?? snap.data()?.stockTotal ?? 0;
          tx.update(configRef, { stockRemaining: Math.max(0, rem - selectedQty) });
        });
      }
    } catch(e) { console.error('stock decrement error:', e); }
  }
}

function showResult(kind, title, msg, receipt) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('status-msg').classList.remove('on');
  document.getElementById('app').style.display = 'block';
  document.getElementById('pay-screen').style.display = 'none';
  document.getElementById('pay-options').style.display = 'none';
  document.getElementById('pay-questions').style.display = 'none';
  document.getElementById('pay-confirm').classList.remove('on');
  document.getElementById('pay-history').classList.remove('on');
  document.getElementById('pay-result').classList.add('on');
  document.getElementById('r-icon').textContent  = kind === 'success' ? '✅' : kind === 'already' ? '✓' : '⚠️';
  document.getElementById('r-title').textContent = title;
  document.getElementById('r-msg').innerHTML     = applyVars(msg);
  const histBtn = document.getElementById('r-hist-btn');
  if (histBtn) histBtn.style.display = (kind !== 'fail' && ctxProjectId) ? 'block' : 'none';
  const retryBtn = document.getElementById('r-retry-btn');
  if (retryBtn) retryBtn.style.display = (kind === 'fail' || kind === 'success') ? 'block' : 'none';
  if (receipt) {
    const r = document.getElementById('r-receipt');
    const lines = [];
    if (receipt.selectedOption) lines.push(`<div>선택 옵션: <b>${esc(receipt.selectedOption)}</b></div>`);
    if (receipt.orderName)  lines.push(`<div><b>${esc(receipt.orderName)}</b></div>`);
    if (receipt.amount != null) lines.push(`<div>금액: ${Number(receipt.amount).toLocaleString()}원</div>`);
    if (receipt.method)     lines.push(`<div>결제카드: ${esc(receipt.method)}</div>`);
    if (receipt.approvedAt) {
      const dt = String(receipt.approvedAt);
      const fmt = dt.length >= 12
        ? `${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)} ${dt.slice(8,10)}:${dt.slice(10,12)}`
        : dt;
      lines.push(`<div>승인: ${esc(fmt)}</div>`);
    }
    r.innerHTML = lines.join('');
    r.style.display = 'block';
  }
}

function fireSmsWebhook(amount, productName, qty) {
  if (!SMS_WEBHOOK_URL) return;
  const phoneKey = SMS_PHONE_FIELD || '연락처';
  const phone = ctxUserFields[phoneKey] || ctxUserFields['phone'] || ctxUserFields['전화번호'] || '';
  fetch(SMS_WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      phone,
      name:        ctxUserFields['이름'] || ctxUserFields['name'] || '고객',
      amount:      Number(amount),
      productName: productName,
      qty:         qty,
      projectId:   ctxProjectId,
    }),
  }).catch(e => console.warn('webhook:', e));
}

function retryPayment() {
  if (ctxProjectId) {
    location.href = '/' + ctxProjectId + '/';
    return;
  }
  location.href = location.pathname + '?id=' + encodeURIComponent(CONFIG_ID);
}

async function showHistory() {
  document.getElementById('pay-result').classList.remove('on');
  document.getElementById('pay-history').classList.add('on');
  const listEl = document.getElementById('hist-list');
  if (!ctxUserId) {
    listEl.innerHTML = '<div class="hist-empty">로그인 후 내역을 확인할 수 있어요.</div>';
    return;
  }
  listEl.innerHTML = '<div class="hist-empty">불러오는 중…</div>';
  try {
    const snap = await db.collection('cms_payment_records')
      .where('projectId', '==', ctxProjectId)
      .where('userId', '==', ctxUserId)
      .limit(20)
      .get();
    const docs = [...snap.docs].sort((a, b) => {
      const at = a.data().createdAt?.toMillis?.() || 0;
      const bt = b.data().createdAt?.toMillis?.() || 0;
      return bt - at;
    });
    if (docs.length === 0) {
      listEl.innerHTML = '<div class="hist-empty">결제 내역이 없어요.</div>';
      return;
    }
    listEl.innerHTML = docs.map(doc => {
      const r = doc.data();
      const dt = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' }) : '';
      const optLine = r.selectedOption?.label ? `<div>옵션: ${esc(r.selectedOption.label)}</div>` : '';
      const qtyLine = r.qty > 1 ? `<div>수량: ${r.qty}개</div>` : '';
      return `<div class="hist-item">
        <div class="hist-item-name">${esc(r.orderName || r.configTitle || '-')}</div>
        <div class="hist-item-amount">${Number(r.amount).toLocaleString()}원</div>
        <div class="hist-item-meta">${optLine}${qtyLine}<div>${esc(r.cardName || r.pg || '')}${dt ? ' · ' + dt : ''}</div></div>
      </div>`;
    }).join('');
  } catch(e) {
    listEl.innerHTML = `<div class="hist-empty">불러오기 실패: ${esc(e.message)}</div>`;
  }
}

function hideHistory() {
  document.getElementById('pay-history').classList.remove('on');
  document.getElementById('pay-result').classList.add('on');
}

window.parent.postMessage({ type: 'lmp-ready' }, '*');
init();
</script>
</body>
