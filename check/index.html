<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>체커 — 미션 확인</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f0f0f0;min-height:100vh;display:flex;justify-content:center;}
#app{width:100%;max-width:430px;min-height:100vh;background:#fff;display:flex;flex-direction:column;}
@media(max-width:430px){body{background:#fff;}}

/* Header */
.chk-header{background:#000;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.chk-title{font-size:15px;font-weight:900;flex:1;}
.chk-role-badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.15);padding:3px 8px;border-radius:10px;white-space:nowrap;}
.chk-logout{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;cursor:pointer;font-family:inherit;}

/* State views */
.state-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
.spinner{width:28px;height:28px;border:3px solid rgba(0,0,0,.1);border-top-color:#000;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Login */
.login-wrap{flex:1;display:flex;flex-direction:column;padding:32px 20px 40px;}
.login-logo{font-size:22px;font-weight:900;margin-bottom:4px;}
.login-sub{font-size:13px;color:rgba(0,0,0,.45);margin-bottom:32px;line-height:1.5;}
.fi-lbl{font-size:11px;font-weight:800;color:rgba(0,0,0,.45);letter-spacing:.5px;margin-bottom:8px;margin-top:20px;}
.fi-lbl:first-of-type{margin-top:0;}
.fi{width:100%;background:transparent;border:none;border-bottom:2px solid #000;font-size:17px;font-weight:600;color:#000;padding:10px 0;outline:none;font-family:inherit;}
.fi::placeholder{color:rgba(0,0,0,.25);font-weight:400;}
.login-btn{margin-top:28px;width:100%;padding:15px;background:#000;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.login-btn:disabled{opacity:.4;cursor:not-allowed;}
.login-err{font-size:12px;color:#c00;margin-top:10px;min-height:16px;text-align:center;}

/* Scanner */
.scanner-wrap{flex:1;display:flex;flex-direction:column;padding:20px 20px 40px;}
.scan-hint{font-size:13px;color:rgba(0,0,0,.5);text-align:center;margin-bottom:20px;line-height:1.6;}
.scan-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;background:#000;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:2px;}
.scan-btn:disabled{opacity:.4;cursor:not-allowed;}
.scan-btn.scanning{background:#c00;}
#video-wrap{display:none;margin-top:16px;position:relative;border-radius:4px;overflow:hidden;background:#000;}
#video-wrap video{width:100%;display:block;}
.scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.scan-frame{width:200px;height:200px;border:3px solid rgba(255,255,255,.8);border-radius:4px;position:relative;}
.scan-corner{position:absolute;width:20px;height:20px;border-color:#fff;border-style:solid;}
.scan-corner.tl{top:-2px;left:-2px;border-width:3px 0 0 3px;}
.scan-corner.tr{top:-2px;right:-2px;border-width:3px 3px 0 0;}
.scan-corner.bl{bottom:-2px;left:-2px;border-width:0 0 3px 3px;}
.scan-corner.br{bottom:-2px;right:-2px;border-width:0 3px 3px 0;}
.scan-stop-btn{margin-top:10px;width:100%;padding:12px;background:transparent;border:2px solid rgba(0,0,0,.3);color:rgba(0,0,0,.6);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:2px;}

/* Password fallback */
.pw-section{margin-top:24px;border-top:1px solid rgba(0,0,0,.1);padding-top:20px;}
.pw-toggle{font-size:12px;color:rgba(0,0,0,.45);text-align:center;cursor:pointer;text-decoration:underline;padding:4px 0;}
.pw-form{display:none;margin-top:16px;}
.pw-row{display:flex;gap:8px;align-items:flex-end;}
.pw-inp{flex:1;background:transparent;border:none;border-bottom:1.5px solid rgba(0,0,0,.3);font-size:15px;color:#000;padding:8px 0;outline:none;font-family:inherit;}
.pw-btn{padding:9px 14px;background:#000;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.pw-err{font-size:11px;color:#c00;margin-top:6px;}

/* Result feedback */
.result-wrap{display:none;margin-top:16px;padding:16px;border-radius:4px;text-align:center;}
.result-wrap.ok{background:rgba(0,180,80,.1);border:1.5px solid rgba(0,180,80,.3);}
.result-wrap.err{background:rgba(204,0,0,.08);border:1.5px solid rgba(204,0,0,.25);}
.result-icon{font-size:32px;margin-bottom:6px;}
.result-title{font-size:16px;font-weight:800;margin-bottom:4px;}
.result-sub{font-size:12px;color:rgba(0,0,0,.5);line-height:1.5;}

/* History */
.history-wrap{margin-top:24px;}
.history-title{font-size:11px;font-weight:800;color:rgba(0,0,0,.35);letter-spacing:.5px;margin-bottom:10px;}
.history-list{display:flex;flex-direction:column;gap:8px;}
.history-item{display:flex;gap:10px;padding:10px 12px;background:#fafafa;border:1px solid rgba(0,0,0,.08);border-radius:4px;font-size:12px;align-items:flex-start;}
.hi-icon{font-size:18px;flex-shrink:0;}
.hi-info{flex:1;}
.hi-name{font-weight:700;margin-bottom:2px;}
.hi-block{color:rgba(0,0,0,.5);}
.hi-time{font-size:11px;color:rgba(0,0,0,.3);margin-left:auto;white-space:nowrap;}

/* Label picker */
.lp-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.lp-sheet{width:100%;max-width:430px;background:#fff;border-radius:14px 14px 0 0;padding:20px 20px 44px;}
.lp-title{font-size:14px;font-weight:800;text-align:center;margin-bottom:16px;}
.lp-btn{display:block;width:100%;padding:14px;border:none;background:#000;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:4px;margin-bottom:8px;}
.lp-btn.sec{background:#fff;color:#000;border:2px solid #000;}
.lp-cancel{display:block;width:100%;padding:12px;background:transparent;border:none;color:rgba(0,0,0,.45);font-size:13px;cursor:pointer;font-family:inherit;margin-top:4px;}
.lp-divider{font-size:11px;color:rgba(0,0,0,.3);text-align:center;margin:10px 0;}
.lp-custom-row{display:flex;gap:8px;align-items:center;}
.lp-custom-inp{flex:1;background:transparent;border:none;border-bottom:1.5px solid rgba(0,0,0,.3);font-size:15px;color:#000;padding:8px 0;outline:none;font-family:inherit;}
.lp-custom-ok{padding:9px 14px;background:#000;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div id="app">

  <!-- 로딩 -->
  <div class="state-view" id="loading-view">
    <div class="spinner"></div>
    <div style="font-size:13px;color:rgba(0,0,0,.4);">불러오는 중…</div>
  </div>

  <!-- 프로젝트 없음 -->
  <div class="state-view" id="no-project-view" style="display:none;">
    <div style="font-size:40px;margin-bottom:16px;">🔍</div>
    <div style="font-size:16px;font-weight:800;margin-bottom:8px;">프로젝트를 찾을 수 없어요</div>
    <div style="font-size:13px;color:rgba(0,0,0,.45);">URL을 확인해주세요.</div>
  </div>

  <!-- 로그인 -->
  <div id="login-view" style="display:none;">
    <div class="login-wrap">
      <div class="login-logo">🔍 체커 로그인</div>
      <div class="login-sub" id="login-sub">체커 권한이 있는 계정으로 로그인하세요.</div>
      <div id="login-fields"></div>
      <button class="login-btn" id="login-btn" onclick="doLogin()">로그인</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </div>

  <!-- 헤더 + 스캐너 (로그인 후) -->
  <div id="checker-view" style="display:none;flex:1;flex-direction:column;">
    <div class="chk-header">
      <div class="chk-title">🔍 미션 확인</div>
      <div class="chk-role-badge" id="role-badge"></div>
      <button class="chk-logout" onclick="doLogout()">로그아웃</button>
    </div>

    <div class="scanner-wrap">
      <div class="scan-hint">사용자의 미션 QR을 스캔하면<br>해당 미션에 확인 배지가 즉시 표시됩니다.</div>

      <button class="scan-btn" id="scan-btn" onclick="toggleScan()">
        📷&nbsp; QR 스캔 시작
      </button>

      <div id="video-wrap">
        <video id="scan-video" autoplay playsinline muted></video>
        <div class="scan-overlay">
          <div class="scan-frame">
            <div class="scan-corner tl"></div><div class="scan-corner tr"></div>
            <div class="scan-corner bl"></div><div class="scan-corner br"></div>
          </div>
        </div>
        <canvas id="scan-canvas" style="display:none;"></canvas>
      </div>
      <button class="scan-stop-btn" id="scan-stop-btn" onclick="stopScan()" style="display:none;">■ 스캔 중단</button>

      <!-- 비밀번호 폴백 -->
      <div class="pw-section">
        <div class="pw-toggle" onclick="togglePwForm()">QR 스캔 대신 코드 직접 입력</div>
        <div class="pw-form" id="pw-form">
          <div style="font-size:11px;color:rgba(0,0,0,.45);margin-bottom:10px;">사용자의 미션 QR에 담긴 코드를 직접 입력하세요.</div>
          <div class="pw-row">
            <input class="pw-inp" id="pw-code-inp" placeholder="projectId:userId:blockId"
              onkeydown="if(event.key==='Enter')processCode(document.getElementById('pw-code-inp').value)">
            <button class="pw-btn" onclick="processCode(document.getElementById('pw-code-inp').value)">확인</button>
          </div>
          <div class="pw-err" id="pw-err"></div>
        </div>
      </div>

      <!-- 결과 피드백 -->
      <div class="result-wrap" id="result-wrap">
        <div class="result-icon" id="result-icon"></div>
        <div class="result-title" id="result-title"></div>
        <div class="result-sub" id="result-sub"></div>
      </div>

      <!-- 최근 확인 이력 -->
      <div class="history-wrap" id="history-wrap" style="display:none;">
        <div class="history-title">이번 세션 확인 이력</div>
        <div class="history-list" id="history-list"></div>
      </div>
    </div>
  </div>

</div>

<!-- 문구 선택 모달 (복수 confirmLabels) -->
<div class="lp-backdrop" id="lp-backdrop" style="display:none;">
  <div class="lp-sheet">
    <div class="lp-title">확인 배지 문구 선택</div>
    <div id="lp-list"></div>
    <div class="lp-divider">— 또는 직접 입력 —</div>
    <div class="lp-custom-row">
      <input class="lp-custom-inp" id="lp-custom-inp" placeholder="문구 직접 입력"
        onkeydown="if(event.key==='Enter')_confirmLabelPickerCustom()">
      <button class="lp-custom-ok" onclick="_confirmLabelPickerCustom()">확인</button>
    </div>
    <button class="lp-cancel" onclick="_cancelLabelPicker()">취소</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyC8uy09XOeEYIs1m3Rga5BMqd7gS7o3roI",
  authDomain:"beyhome-admin.firebaseapp.com",
  projectId:"beyhome-admin",
  storageBucket:"beyhome-admin.firebasestorage.app",
  messagingSenderId:"849320781553",
  appId:"1:849320781553:web:9d844044e85995c0aa2b50"
});
const db = firebase.firestore();

/* ── URL에서 projectId 추출 ── */
// /check/{projectId} 또는 /check/?p={projectId}
const _path = window.location.pathname.replace(/\/$/, '').split('/');
const PROJECT_ID = _path[_path.length - 1] !== 'check'
  ? _path[_path.length - 1]
  : (new URLSearchParams(location.search).get('p') || '');

let projectData = null;
let authFields = [];
let AUTH_COLLECTION = '';
let checkerSession = null; // { userId, userName, roleId, roleName }
let scanActive = false;
let scanStream = null;
let scanRaf = null;
const checkHistory = [];

/* ── Init ── */
async function init() {
  if (!PROJECT_ID) { showView('no-project'); return; }

  // 세션 복원
  const saved = _getSavedSession();
  if (saved) {
    checkerSession = saved;
  }

  try {
    const doc = await db.collection('cms_projects').doc(PROJECT_ID).get();
    if (!doc.exists) { showView('no-project'); return; }
    projectData = doc.data();
    authFields = projectData.authFields || [{ key: 'phone', label: '전화번호', type: 'tel' }];
    AUTH_COLLECTION = 'cms_users_' + PROJECT_ID;

    if (checkerSession) {
      showCheckerView();
    } else {
      buildLoginForm();
      showView('login');
    }
  } catch(e) {
    showView('no-project');
  }
}

/* ── 로그인 폼 구성 ── */
function buildLoginForm() {
  const sub = document.getElementById('login-sub');
  sub.textContent = (projectData?.authTitle || '로그인') + ' — 체커 권한이 있는 계정으로 로그인하세요.';

  // authKeyField 하나만 입력받음
  const keyName = projectData?.authKeyField || authFields[0]?.key;
  const f = authFields.find(a => a.key === keyName) || authFields[0];
  const container = document.getElementById('login-fields');
  container.innerHTML = f ? `
    <div class="fi-lbl">${f.label || f.key}</div>
    <input class="fi" id="lf-${f.key}" type="${f.type === 'tel' ? 'tel' : 'text'}"
      placeholder="${f.placeholder || ''}"
      ${f.type === 'tel' ? 'maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/,\'\')"' : ''}
      onkeydown="if(event.key===\'Enter\')doLogin()">
  ` : '';
}

/* ── 로그인 처리 ── */
async function doLogin() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.textContent = '';
  btn.disabled = true; btn.textContent = '확인 중…';

  // authKeyField 하나로만 조회
  const keyName = projectData?.authKeyField || authFields[0]?.key;
  const keyField = authFields.find(a => a.key === keyName) || authFields[0];
  const val = document.getElementById('lf-' + keyField?.key)?.value.trim() || '';
  const query = db.collection(AUTH_COLLECTION).where(keyField.key, '==', val);

  try {
    const snap = await query.limit(1).get();
    if (snap.empty) {
      err.textContent = '일치하는 계정을 찾을 수 없어요.';
      btn.disabled = false; btn.textContent = '로그인';
      return;
    }
    const userDoc = snap.docs[0];
    const userData = userDoc.data();
    const checkerRoleId = userData.checkerRoleId;
    if (!checkerRoleId) {
      err.textContent = '체커 권한이 없는 계정이에요.';
      btn.disabled = false; btn.textContent = '로그인';
      return;
    }
    const roles = projectData.checkerRoles || [];
    const role = roles.find(r => r.id === checkerRoleId);
    const roleName = role?.name || checkerRoleId;

    // 이름 필드 찾기 (첫 번째 non-phone 필드 또는 첫 번째 필드)
    const nameField = authFields.find(f => f.key !== 'phone' && f.key !== 'tel') || authFields[0];
    const userName = userData[nameField?.key] || userDoc.id;

    const confirmLabels = role?.confirmLabels || (role?.confirmLabel ? [role.confirmLabel] : []);
    checkerSession = { userId: userDoc.id, userName, roleId: checkerRoleId, roleName, confirmLabels };
    _saveSession(checkerSession);
    showCheckerView();
  } catch(e) {
    err.textContent = '오류: ' + e.message;
    btn.disabled = false; btn.textContent = '로그인';
  }
}

/* ── 체커 화면 ── */
function showCheckerView() {
  document.getElementById('role-badge').textContent = checkerSession.roleName;
  showView('checker');
}

function doLogout() {
  checkerSession = null;
  _clearSession();
  stopScan();
  buildLoginForm();
  showView('login');
}

/* ── QR 스캔 ── */
async function toggleScan() {
  if (scanActive) { stopScan(); return; }

  const videoWrap = document.getElementById('video-wrap');
  const btn = document.getElementById('scan-btn');
  const stopBtn = document.getElementById('scan-stop-btn');

  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 640 } }
    });
    const video = document.getElementById('scan-video');
    video.srcObject = scanStream;
    videoWrap.style.display = 'block';
    stopBtn.style.display = 'block';
    btn.innerHTML = '⏹&nbsp; 스캔 중…';
    btn.classList.add('scanning');
    scanActive = true;
    hideResult();
    requestAnimationFrame(scanFrame);
  } catch(e) {
    showResult('err', '❌', '카메라 접근 실패', '브라우저 설정에서 카메라 권한을 허용해주세요.');
  }
}

function stopScan() {
  scanActive = false;
  if (scanRaf) { cancelAnimationFrame(scanRaf); scanRaf = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  document.getElementById('video-wrap').style.display = 'none';
  document.getElementById('scan-stop-btn').style.display = 'none';
  const btn = document.getElementById('scan-btn');
  btn.innerHTML = '📷&nbsp; QR 스캔 시작';
  btn.classList.remove('scanning');
}

function scanFrame() {
  if (!scanActive) return;
  const video = document.getElementById('scan-video');
  const canvas = document.getElementById('scan-canvas');
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    if (code?.data) {
      processCode(code.data);
      return; // 스캔 성공 시 멈춤
    }
  }
  scanRaf = requestAnimationFrame(scanFrame);
}

/* ── QR 코드 처리 ── */
async function processCode(raw) {
  stopScan();
  hideResult();
  document.getElementById('pw-err').textContent = '';

  const parts = (raw || '').split(':');
  if (parts.length !== 3) {
    showResult('err', '❌', '인식 실패', '올바른 미션 QR이 아닙니다.');
    return;
  }
  const [qrProjectId, userId, blockId] = parts;

  if (qrProjectId !== PROJECT_ID) {
    showResult('err', '❌', '프로젝트 불일치', '다른 프로젝트의 QR입니다.');
    return;
  }

  const userRef = db.collection(AUTH_COLLECTION).doc(userId);
  try {
    const userDoc = await userRef.get();
    if (!userDoc.exists) {
      showResult('err', '❌', '사용자 없음', '존재하지 않는 사용자입니다.');
      return;
    }
    const userData = userDoc.data();
    const nameField = authFields.find(f => f.key !== 'phone') || authFields[0];
    const displayName = userData[nameField?.key] || userId;

    // 이미 체크한 경우
    const existing = (userData.externalChecks?.[blockId] || []);
    const alreadyByMe = existing.some(c => c.roleId === checkerSession.roleId);
    if (alreadyByMe) {
      showResult('ok', '✅', '이미 확인됨', `${displayName} 님은 이미 "${checkerSession.roleName}" 확인이 완료됐어요.`);
      return;
    }

    // 문구 결정 — 복수면 선택 모달
    const labels = checkerSession.confirmLabels || [];
    if (labels.length > 1) {
      _showLabelPicker(labels, { userRef, blockId, userData, displayName });
    } else {
      await _writeExternalCheck(userRef, blockId, userData, labels[0] || checkerSession.roleName, displayName);
    }
  } catch(e) {
    showResult('err', '❌', '오류 발생', e.message);
  }
}

let _pendingCheck = null;
function _showLabelPicker(labels, pending) {
  _pendingCheck = pending;
  document.getElementById('lp-list').innerHTML = labels.map((l, i) =>
    `<button class="lp-btn" onclick="_confirmLabelPicker(${i})">${l.replace(/</g,'&lt;')}</button>`
  ).join('');
  document.getElementById('lp-custom-inp').value = '';
  document.getElementById('lp-backdrop').style.display = 'flex';
}
function _cancelLabelPicker() {
  document.getElementById('lp-backdrop').style.display = 'none';
  _pendingCheck = null;
}
async function _confirmLabelPicker(i) {
  const label = (checkerSession.confirmLabels || [])[i] || checkerSession.roleName;
  document.getElementById('lp-backdrop').style.display = 'none';
  if (_pendingCheck) await _writeExternalCheck(_pendingCheck.userRef, _pendingCheck.blockId, _pendingCheck.userData, label, _pendingCheck.displayName);
  _pendingCheck = null;
}
async function _confirmLabelPickerCustom() {
  const label = document.getElementById('lp-custom-inp').value.trim() || checkerSession.roleName;
  document.getElementById('lp-backdrop').style.display = 'none';
  if (_pendingCheck) await _writeExternalCheck(_pendingCheck.userRef, _pendingCheck.blockId, _pendingCheck.userData, label, _pendingCheck.displayName);
  _pendingCheck = null;
}
async function _writeExternalCheck(userRef, blockId, userData, confirmLabel, displayName) {
  try {
    await userRef.update({
      [`externalChecks.${blockId}`]: firebase.firestore.FieldValue.arrayUnion({
        roleId: checkerSession.roleId,
        roleName: checkerSession.roleName,
        confirmLabel,
        checkerUserId: checkerSession.userId,
        checkedAt: new Date()
      })
    });
    showResult('ok', '✅', '확인 완료!', `${displayName} 님의 미션에 "${confirmLabel}" 배지가 추가됐어요.`);
    addHistory(displayName, blockId);
  } catch(e) {
    showResult('err', '❌', '오류 발생', e.message);
  }
}

/* ── 결과 표시 ── */
function showResult(type, icon, title, sub) {
  const wrap = document.getElementById('result-wrap');
  wrap.className = 'result-wrap ' + type;
  document.getElementById('result-icon').textContent = icon;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent = sub;
  wrap.style.display = 'block';
  wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function hideResult() {
  document.getElementById('result-wrap').style.display = 'none';
}

/* ── 이력 ── */
function addHistory(userName, blockId) {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  checkHistory.unshift({ userName, blockId, timeStr });
  const wrap = document.getElementById('history-wrap');
  const list = document.getElementById('history-list');
  wrap.style.display = '';
  list.innerHTML = checkHistory.slice(0, 10).map(h => `
    <div class="history-item">
      <div class="hi-icon">✅</div>
      <div class="hi-info">
        <div class="hi-name">${h.userName}</div>
        <div class="hi-block">블록: ${h.blockId.slice(0,8)}…</div>
      </div>
      <div class="hi-time">${h.timeStr}</div>
    </div>
  `).join('');
}

/* ── 비밀번호 폼 토글 ── */
function togglePwForm() {
  const f = document.getElementById('pw-form');
  f.style.display = f.style.display === 'block' ? 'none' : 'block';
}

/* ── 유틸 ── */
function showView(name) {
  const map = { loading: 'loading-view', 'no-project': 'no-project-view', login: 'login-view', checker: 'checker-view' };
  Object.entries(map).forEach(([k, id]) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (k === 'checker') el.style.display = k === name ? 'flex' : 'none';
    else el.style.display = k === name ? '' : 'none';
  });
}
function _sessionKey() { return 'lmp-checker-' + PROJECT_ID; }
function _saveSession(s) { try { sessionStorage.setItem(_sessionKey(), JSON.stringify(s)); } catch(_) {} }
function _getSavedSession() { try { return JSON.parse(sessionStorage.getItem(_sessionKey()) || 'null'); } catch(_) { return null; } }
function _clearSession() { try { sessionStorage.removeItem(_sessionKey()); } catch(_) {} }

init();
</script>
