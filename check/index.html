<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>체커 — 미션 확인</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f0f0f0;min-height:100vh;display:flex;justify-content:center;}
#app{width:100%;max-width:430px;min-height:100vh;background:#fff;display:flex;flex-direction:column;}
@media(max-width:430px){body{background:#fff;}}

/* Header */
.chk-header{background:#000;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.chk-title{font-size:15px;font-weight:900;flex:1;}
.chk-role-badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.15);padding:3px 8px;border-radius:10px;white-space:nowrap;}
.chk-logout{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;cursor:pointer;font-family:inherit;}

/* Mode tabs */
.chk-tabs{display:flex;border-bottom:1.5px solid rgba(0,0,0,.1);flex-shrink:0;}
.chk-tab{flex:1;padding:11px 0;background:transparent;border:none;font-size:13px;font-weight:700;color:rgba(0,0,0,.35);cursor:pointer;font-family:inherit;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:.15s;}
.chk-tab.active{color:#000;border-bottom-color:#000;}

/* State views */
.state-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
.spinner{width:28px;height:28px;border:3px solid rgba(0,0,0,.1);border-top-color:#000;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Login */
.login-wrap{flex:1;display:flex;flex-direction:column;padding:32px 20px 40px;}
.login-logo{font-size:22px;font-weight:900;margin-bottom:4px;}
.login-sub{font-size:13px;color:rgba(0,0,0,.45);margin-bottom:32px;line-height:1.5;}
.fi-lbl{font-size:11px;font-weight:800;color:rgba(0,0,0,.45);letter-spacing:.5px;margin-bottom:8px;margin-top:20px;}
.fi-lbl:first-of-type{margin-top:0;}
.fi{width:100%;background:transparent;border:none;border-bottom:2px solid #000;font-size:17px;font-weight:600;color:#000;padding:10px 0;outline:none;font-family:inherit;}
.fi::placeholder{color:rgba(0,0,0,.25);font-weight:400;}
.login-btn{margin-top:28px;width:100%;padding:15px;background:#000;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.login-btn:disabled{opacity:.4;cursor:not-allowed;}
.login-err{font-size:12px;color:#c00;margin-top:10px;min-height:16px;text-align:center;}

/* ── 스캔 모드 ── */
.scan-mode-wrap{flex:1;display:flex;flex-direction:column;padding:20px 20px 40px;}
.scan-hint{font-size:13px;color:rgba(0,0,0,.5);text-align:center;margin-bottom:20px;line-height:1.6;}
.scan-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;background:#000;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:2px;}
.scan-btn.scanning{background:#c00;}
#video-wrap{display:none;margin-top:16px;position:relative;border-radius:4px;overflow:hidden;background:#000;}
#video-wrap video{width:100%;display:block;}
.scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.scan-frame{width:200px;height:200px;border:3px solid rgba(255,255,255,.8);border-radius:4px;position:relative;}
.scan-corner{position:absolute;width:20px;height:20px;border-color:#fff;border-style:solid;}
.scan-corner.tl{top:-2px;left:-2px;border-width:3px 0 0 3px;}
.scan-corner.tr{top:-2px;right:-2px;border-width:3px 3px 0 0;}
.scan-corner.bl{bottom:-2px;left:-2px;border-width:0 0 3px 3px;}
.scan-corner.br{bottom:-2px;right:-2px;border-width:0 3px 3px 0;}
.scan-stop-btn{margin-top:10px;width:100%;padding:12px;background:transparent;border:2px solid rgba(0,0,0,.3);color:rgba(0,0,0,.6);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:2px;}
.pw-section{margin-top:24px;border-top:1px solid rgba(0,0,0,.1);padding-top:20px;}
.pw-toggle{font-size:12px;color:rgba(0,0,0,.45);text-align:center;cursor:pointer;text-decoration:underline;padding:4px 0;}
.pw-form{display:none;margin-top:16px;}
.pw-row{display:flex;gap:8px;align-items:flex-end;}
.pw-inp{flex:1;background:transparent;border:none;border-bottom:1.5px solid rgba(0,0,0,.3);font-size:15px;color:#000;padding:8px 0;outline:none;font-family:inherit;}
.pw-btn{padding:9px 14px;background:#000;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.pw-err{font-size:11px;color:#c00;margin-top:6px;}
.result-wrap{display:none;margin-top:16px;padding:16px;border-radius:4px;text-align:center;}
.result-wrap.ok{background:rgba(0,180,80,.1);border:1.5px solid rgba(0,180,80,.3);}
.result-wrap.err{background:rgba(204,0,0,.08);border:1.5px solid rgba(204,0,0,.25);}
.result-wrap.warn{background:rgba(220,130,0,.1);border:1.5px solid rgba(220,130,0,.35);}
.result-icon{font-size:32px;margin-bottom:6px;}
.result-title{font-size:16px;font-weight:800;margin-bottom:4px;}
.result-sub{font-size:12px;color:rgba(0,0,0,.5);line-height:1.5;}
.history-wrap{margin-top:24px;}
.history-title{font-size:11px;font-weight:800;color:rgba(0,0,0,.35);letter-spacing:.5px;margin-bottom:10px;}
.history-list{display:flex;flex-direction:column;gap:8px;}
.history-item{display:flex;gap:10px;padding:10px 12px;background:#fafafa;border:1px solid rgba(0,0,0,.08);border-radius:4px;font-size:12px;align-items:flex-start;}
.hi-icon{font-size:18px;flex-shrink:0;}
.hi-info{flex:1;}
.hi-name{font-weight:700;margin-bottom:2px;}
.hi-block{color:rgba(0,0,0,.5);}
.hi-time{font-size:11px;color:rgba(0,0,0,.3);margin-left:auto;white-space:nowrap;}

/* ── 목록 모드 ── */
.lst-mode-wrap{flex:1;display:flex;flex-direction:column;padding:16px 16px 120px;overflow-y:auto;}
.lst-selects{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.lst-sel{width:100%;padding:10px 12px;border:1.5px solid rgba(0,0,0,.2);border-radius:6px;font-size:14px;font-weight:600;font-family:inherit;background:#fff;color:#000;appearance:none;}
.lst-sel:disabled{opacity:.4;}
.lst-search-row{display:flex;gap:8px;margin-bottom:6px;}
.lst-search{flex:1;padding:10px 12px;border:1.5px solid rgba(0,0,0,.2);border-radius:6px;font-size:14px;font-family:inherit;background:#fff;outline:none;}
.lst-search:focus{border-color:#000;}
.lst-load-btn{padding:10px 16px;background:#000;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:6px;white-space:nowrap;}
.lst-count{font-size:11px;color:rgba(0,0,0,.35);margin-bottom:10px;}
.lst-sel-all{font-size:11px;color:rgba(0,0,0,.5);cursor:pointer;text-decoration:underline;float:right;}
.lst-list{display:flex;flex-direction:column;gap:6px;}
.lst-item{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:2px solid #eee;border-radius:8px;cursor:pointer;transition:all .12s;user-select:none;-webkit-user-select:none;}
.lst-item.sel{border-color:#000;background:#fafafa;}
.lst-item.ext-done{opacity:.5;cursor:default;}
.lst-chk{width:20px;height:20px;border:2px solid #ccc;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:2px;}
.lst-chk.checked{background:#000;border-color:#000;color:#fff;}
.lst-info{flex:1;min-width:0;}
.lst-name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.lst-name{font-size:14px;font-weight:700;}
.lst-phone{font-size:12px;color:rgba(0,0,0,.4);}
.lst-status-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.lst-user-done{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;}
.lst-user-done.yes{background:rgba(0,180,80,.12);color:rgb(0,120,50);}
.lst-user-done.no{background:#f0f0f0;color:rgba(0,0,0,.4);}
.lst-ext-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:#eee;color:rgba(0,0,0,.55);}
.lst-ext-badge.mine{background:#000;color:#fff;}
.lst-empty{padding:30px;text-align:center;color:rgba(0,0,0,.35);font-size:13px;}

/* 목록 모드 액션 바 (하단 고정) */
.lst-action-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1.5px solid rgba(0,0,0,.1);padding:12px 16px 32px;z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,.08);}
.lst-action-label-title{font-size:10px;font-weight:800;color:rgba(0,0,0,.4);letter-spacing:.6px;margin-bottom:7px;}
.lst-action-label-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.lst-action-label-btn{padding:6px 14px;border:2px solid #ddd;background:#fff;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.lst-action-label-btn.sel{border-color:#000;background:#000;color:#fff;}
.lst-action-confirm-btn{width:100%;padding:14px;background:#000;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:4px;}
.lst-action-confirm-btn:disabled{opacity:.3;cursor:not-allowed;}

/* ── QR 확인 패널 (단순 확인용) ── */
.cp-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
.cp-sheet{width:100%;max-width:430px;background:#fff;border-radius:14px 14px 0 0;padding:20px 20px 44px;}
.cp-drag{width:36px;height:4px;background:rgba(0,0,0,.15);border-radius:2px;margin:0 auto 18px;}
.cp-user{font-size:20px;font-weight:800;margin-bottom:4px;}
.cp-block{font-size:13px;color:rgba(0,0,0,.45);margin-bottom:16px;line-height:1.5;}
.cp-already{font-size:13px;color:#c70;background:rgba(200,120,0,.08);border:1.5px solid rgba(200,120,0,.25);padding:10px 12px;border-radius:6px;margin-bottom:14px;line-height:1.5;}
.cp-label-title{font-size:10px;font-weight:800;color:rgba(0,0,0,.4);letter-spacing:.6px;margin-bottom:8px;}
.cp-label-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.cp-label-btn{padding:8px 16px;border:2px solid #ddd;background:#fff;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.cp-label-btn.sel{border-color:#000;background:#000;color:#fff;}
.cp-confirm{width:100%;padding:15px;background:#000;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:4px;margin-bottom:8px;}
.cp-cancel{display:block;width:100%;padding:11px;background:transparent;border:none;color:rgba(0,0,0,.4);font-size:13px;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div id="app">

  <div class="state-view" id="loading-view">
    <div class="spinner"></div>
    <div style="font-size:13px;color:rgba(0,0,0,.4);">불러오는 중…</div>
  </div>

  <div class="state-view" id="no-project-view" style="display:none;">
    <div style="font-size:40px;margin-bottom:16px;">🔍</div>
    <div style="font-size:16px;font-weight:800;margin-bottom:8px;">프로젝트를 찾을 수 없어요</div>
    <div style="font-size:13px;color:rgba(0,0,0,.45);">URL을 확인해주세요.</div>
  </div>

  <div id="login-view" style="display:none;">
    <div class="login-wrap">
      <div class="login-logo">🔍 체커 로그인</div>
      <div class="login-sub" id="login-sub">체커 권한이 있는 계정으로 로그인하세요.</div>
      <div id="login-fields"></div>
      <button class="login-btn" id="login-btn" onclick="doLogin()">로그인</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </div>

  <div id="checker-view" style="display:none;flex:1;flex-direction:column;">
    <div class="chk-header">
      <div class="chk-title">🔍 미션 확인</div>
      <div class="chk-role-badge" id="role-badge"></div>
      <button class="chk-logout" onclick="doLogout()">로그아웃</button>
    </div>

    <div class="chk-tabs">
      <button class="chk-tab active" id="tab-scan" onclick="setCheckerTab('scan')">📷 QR 스캔</button>
      <button class="chk-tab" id="tab-list" onclick="setCheckerTab('list')">📋 목록 조회</button>
    </div>

    <!-- QR 스캔 모드 -->
    <div id="mode-scan" class="scan-mode-wrap">
      <div class="scan-hint">사용자의 미션 QR을 스캔하면<br>확인 패널이 열립니다.</div>
      <button class="scan-btn" id="scan-btn" onclick="toggleScan()">📷&nbsp; QR 스캔 시작</button>
      <div id="video-wrap">
        <video id="scan-video" autoplay playsinline muted></video>
        <div class="scan-overlay">
          <div class="scan-frame">
            <div class="scan-corner tl"></div><div class="scan-corner tr"></div>
            <div class="scan-corner bl"></div><div class="scan-corner br"></div>
          </div>
        </div>
        <canvas id="scan-canvas" style="display:none;"></canvas>
      </div>
      <button class="scan-stop-btn" id="scan-stop-btn" onclick="stopScan()" style="display:none;">■ 스캔 중단</button>

      <div class="pw-section">
        <div class="pw-toggle" onclick="togglePwForm()">QR 스캔 대신 코드 직접 입력</div>
        <div class="pw-form" id="pw-form">
          <div style="font-size:11px;color:rgba(0,0,0,.45);margin-bottom:10px;">사용자의 미션 QR에 담긴 코드를 직접 입력하세요.</div>
          <div class="pw-row">
            <input class="pw-inp" id="pw-code-inp" placeholder="projectId:userId:blockId"
              onkeydown="if(event.key==='Enter')processCode(this.value)">
            <button class="pw-btn" onclick="processCode(document.getElementById('pw-code-inp').value)">확인</button>
          </div>
          <div class="pw-err" id="pw-err"></div>
        </div>
      </div>

      <div class="result-wrap" id="result-wrap">
        <div class="result-icon" id="result-icon"></div>
        <div class="result-title" id="result-title"></div>
        <div class="result-sub" id="result-sub"></div>
      </div>

      <div class="history-wrap" id="history-wrap" style="display:none;">
        <div class="history-title">이번 세션 확인 이력</div>
        <div class="history-list" id="history-list"></div>
      </div>
    </div>

    <!-- 목록 조회 모드 -->
    <div id="mode-list" class="lst-mode-wrap" style="display:none;">
      <div class="lst-selects">
        <select class="lst-sel" id="lst-stage-sel" onchange="_onLstStageChange()">
          <option value="">스테이지 선택…</option>
        </select>
        <select class="lst-sel" id="lst-block-sel" disabled onchange="_onLstBlockChange()">
          <option value="">블록 선택…</option>
        </select>
      </div>
      <div class="lst-search-row">
        <input class="lst-search" id="lst-search" placeholder="전화번호 뒷 4자리 검색" oninput="_filterLst()">
        <button class="lst-load-btn" onclick="_reloadLst()">새로고침</button>
      </div>
      <div id="lst-count" class="lst-count"></div>
      <div id="lst-list" class="lst-list">
        <div class="lst-empty">스테이지와 블록을 선택하면<br>목록이 표시됩니다.</div>
      </div>
    </div>
  </div>

</div>

<!-- 목록 모드 액션 바 -->
<div class="lst-action-bar" id="lst-action-bar" style="display:none;">
  <div id="lst-action-label-wrap" style="display:none;">
    <div class="lst-action-label-title">확인 배지 문구</div>
    <div class="lst-action-label-btns" id="lst-action-label-btns"></div>
  </div>
  <button class="lst-action-confirm-btn" id="lst-action-confirm-btn" onclick="_bulkCheck()">확인 처리</button>
</div>

<!-- QR 확인 패널 -->
<div class="cp-backdrop" id="cp-backdrop" style="display:none;" onclick="_cpBackdropClick(event)">
  <div class="cp-sheet">
    <div class="cp-drag"></div>
    <div class="cp-user" id="cp-user"></div>
    <div class="cp-block" id="cp-block"></div>
    <div class="cp-already" id="cp-already" style="display:none;"></div>
    <div id="cp-label-wrap" style="display:none;">
      <div class="cp-label-title">확인 배지 문구</div>
      <div class="cp-label-btns" id="cp-label-btns"></div>
    </div>
    <button class="cp-confirm" id="cp-confirm-btn" onclick="_cpConfirm()">이 미션 확인 완료</button>
    <button class="cp-cancel" onclick="_cpClose()">취소</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyC8uy09XOeEYIs1m3Rga5BMqd7gS7o3roI",
  authDomain:"beyhome-admin.firebaseapp.com",
  projectId:"beyhome-admin",
  storageBucket:"beyhome-admin.firebasestorage.app",
  messagingSenderId:"849320781553",
  appId:"1:849320781553:web:9d844044e85995c0aa2b50"
});
const db = firebase.firestore();

const _path = window.location.pathname.replace(/\/$/, '').split('/');
const PROJECT_ID = _path[_path.length - 1] !== 'check'
  ? _path[_path.length - 1]
  : (new URLSearchParams(location.search).get('p') || '');

let projectData = null;
let authFields = [];
let AUTH_COLLECTION = '';
let checkerSession = null;
let scanActive = false;
let scanStream = null;
let scanRaf = null;
const checkHistory = [];

/* ── Init ── */
async function init() {
  if (!PROJECT_ID) { showView('no-project'); return; }
  const saved = _getSavedSession();
  if (saved) checkerSession = saved;
  try {
    const doc = await db.collection('cms_projects').doc(PROJECT_ID).get();
    if (!doc.exists) { showView('no-project'); return; }
    projectData = doc.data();
    authFields = projectData.authFields || [{ key: 'phone', label: '전화번호', type: 'tel' }];
    AUTH_COLLECTION = 'cms_users_' + PROJECT_ID;
    if (checkerSession) { showCheckerView(); }
    else { buildLoginForm(); showView('login'); }
  } catch(e) { showView('no-project'); }
}

function buildLoginForm() {
  document.getElementById('login-sub').textContent =
    (projectData?.authTitle || '로그인') + ' — 체커 권한이 있는 계정으로 로그인하세요.';
  const keyName = projectData?.authKeyField || authFields[0]?.key;
  const f = authFields.find(a => a.key === keyName) || authFields[0];
  document.getElementById('login-fields').innerHTML = f ? `
    <div class="fi-lbl">${f.label || f.key}</div>
    <input class="fi" id="lf-${f.key}" type="${f.type === 'tel' ? 'tel' : 'text'}"
      placeholder="${f.placeholder || ''}"
      ${f.type === 'tel' ? 'maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/,\'\')"' : ''}
      onkeydown="if(event.key===\'Enter\')doLogin()">` : '';
}

async function doLogin() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.textContent = '';
  btn.disabled = true; btn.textContent = '확인 중…';
  const keyName = projectData?.authKeyField || authFields[0]?.key;
  const keyField = authFields.find(a => a.key === keyName) || authFields[0];
  const val = document.getElementById('lf-' + keyField?.key)?.value.trim() || '';
  try {
    const snap = await db.collection(AUTH_COLLECTION).where(keyField.key, '==', val).limit(1).get();
    if (snap.empty) { err.textContent = '일치하는 계정을 찾을 수 없어요.'; btn.disabled = false; btn.textContent = '로그인'; return; }
    const userDoc = snap.docs[0];
    const userData = userDoc.data();
    const checkerRoleId = userData.checkerRoleId;
    if (!checkerRoleId) { err.textContent = '체커 권한이 없는 계정이에요.'; btn.disabled = false; btn.textContent = '로그인'; return; }
    const role = (projectData.checkerRoles || []).find(r => r.id === checkerRoleId);
    const roleName = role?.name || checkerRoleId;
    const nameField = authFields.find(f => f.key !== 'phone' && f.key !== 'tel') || authFields[0];
    const userName = userData[nameField?.key] || userDoc.id;
    const confirmLabels = role?.confirmLabels || (role?.confirmLabel ? [role.confirmLabel] : []);
    checkerSession = { userId: userDoc.id, userName, roleId: checkerRoleId, roleName, confirmLabels };
    _saveSession(checkerSession);
    showCheckerView();
  } catch(e) { err.textContent = '오류: ' + e.message; btn.disabled = false; btn.textContent = '로그인'; }
}

  document.getElementById('role-badge').textContent = checkerSession.roleName;

}

function setCheckerTab(tab) {

/* ── QR 스캔 ── */
async function toggleScan() {
  if (scanActive) { stopScan(); return; }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 640 } }
    });
    const video = document.getElementById('scan-video');
    video.srcObject = scanStream;
    document.getElementById('video-wrap').style.display = 'block';
    document.getElementById('scan-stop-btn').style.display = 'block';
    const btn = document.getElementById('scan-btn');
    btn.innerHTML = '⏹&nbsp; 스캔 중…'; btn.classList.add('scanning');
    scanActive = true; hideResult();
    requestAnimationFrame(scanFrame);
  } catch(e) { showResult('err', '❌', '카메라 접근 실패', '브라우저 설정에서 카메라 권한을 허용해주세요.'); }
}

function stopScan() {
  scanActive = false;
  if (scanRaf) { cancelAnimationFrame(scanRaf); scanRaf = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  document.getElementById('video-wrap').style.display = 'none';
  document.getElementById('scan-stop-btn').style.display = 'none';
  const btn = document.getElementById('scan-btn');
  btn.innerHTML = '📷&nbsp; QR 스캔 시작'; btn.classList.remove('scanning');
}

function scanFrame() {
  if (!scanActive) return;
  const video = document.getElementById('scan-video');
  const canvas = document.getElementById('scan-canvas');
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    if (code?.data) { processCode(code.data); return; }
  }
  scanRaf = requestAnimationFrame(scanFrame);
}

/* ── QR / 코드 처리 ── */
async function processCode(raw) {
  stopScan();
  hideResult();
  document.getElementById('pw-err').textContent = '';

  if ((raw || '').startsWith('RAFFLE:')) { await processRaffleCode(raw); return; }

  const parts = (raw || '').split(':');
  if (parts.length !== 3) { showResult('err', '❌', '인식 실패', '올바른 미션 QR이 아닙니다.'); return; }
  const [qrProjectId, userId, blockId] = parts;
  if (qrProjectId !== PROJECT_ID) { showResult('err', '❌', '프로젝트 불일치', '다른 프로젝트의 QR입니다.'); return; }

  try {
    const userDoc = await db.collection(AUTH_COLLECTION).doc(userId).get();
    if (!userDoc.exists) { showResult('err', '❌', '사용자 없음', '존재하지 않는 사용자입니다.'); return; }
    const userData = userDoc.data();
    const nameField = authFields.find(f => f.key !== 'phone') || authFields[0];
    const displayName = userData[nameField?.key] || userId;
    _openCpPanel(userDoc.ref, userData, displayName, blockId);
  } catch(e) { showResult('err', '❌', '오류 발생', e.message); }
}

  const listEl = document.getElementById('lst-list');

async function _reloadLst() {
  if (!_lstBlockId) return;
  _lstAllUsers = null; _lstSelectedUsers = new Set();
  _updateLstActionBar();
  await _loadLstUsers();
}

function _filterLst() {
  if (!_lstAllUsers) return;
  const q = document.getElementById('lst-search').value.trim();
  const phoneKey = (authFields.find(f => f.type === 'tel') || authFields.find(f => f.key === 'phone'))?.key || 'phone';
  let users = _lstAllUsers;
  if (q) {
    users = users.filter(u => {
      const phone = String(u[phoneKey] || '');
      return phone.slice(-4) === q || phone.includes(q);
    });
  }
  _lstFilteredUsers = users;
  _renderLstUsers(users);
}

function _renderLstUsers(users) {
  const listEl = document.getElementById('lst-list');
  const countEl = document.getElementById('lst-count');
  const stageId = _lstStageId;
  const blockId = _lstBlockId;

  if (!users.length) {
    listEl.innerHTML = '<div class="lst-empty">검색 결과가 없어요.</div>';
    countEl.textContent = '';
    _updateLstActionBar();
    return;
  }

  const phoneKey = (authFields.find(f => f.type === 'tel') || authFields.find(f => f.key === 'phone'))?.key || 'phone';
  const nameKey = authFields.find(f => f.type !== 'tel' && f.key !== 'phone')?.key;

  // 정렬: 사용자 완료 → 미완료
  const sorted = [...users].sort((a, b) => {
    const ac = (a.stageProgress?.[stageId] || []).includes(blockId);
    const bc = (b.stageProgress?.[stageId] || []).includes(blockId);
    return (ac === bc) ? 0 : ac ? -1 : 1;
  });

  const doneCount = sorted.filter(u => (u.stageProgress?.[stageId] || []).includes(blockId)).length;
  countEl.textContent = `전체 ${users.length}명 · 사용자 완료 ${doneCount}명`;

  let html = '';
  for (const u of sorted) {
    const phone = String(u[phoneKey] || '');
    const phoneMasked = phone.length >= 4 ? phone.slice(0, -4).replace(/./g, '*') + phone.slice(-4) : phone;
    const name = (nameKey ? u[nameKey] : null) || u._id;
    const userDone = (u.stageProgress?.[stageId] || []).includes(blockId);
    const extChecks = u.externalChecks?.[blockId] || [];
    const extByMe = extChecks.some(c => c.roleId === checkerSession.roleId);
    const isSelected = _lstSelectedUsers.has(u._id);

    const extBadges = extChecks.map(c =>
      `<span class="lst-ext-badge${c.roleId===checkerSession.roleId?' mine':''}">${String(c.confirmLabel||c.roleName||'확인').replace(/</g,'&lt;')}</span>`
    ).join('');

    html += `
      <div class="lst-item${isSelected?' sel':''}${extByMe?' ext-done':''}"
           data-uid="${u._id}" onclick="_lstToggle('${u._id}',${extByMe})">
        <div class="lst-chk${isSelected?' checked':''}" id="lstchk-${u._id}">${isSelected?'✓':''}</div>
        <div class="lst-info">
          <div class="lst-name-row">
            <span class="lst-name">${String(name).replace(/</g,'&lt;')}</span>
            <span class="lst-phone">${phoneMasked}</span>
          </div>
          <div class="lst-status-row">
            <span class="lst-user-done ${userDone?'yes':'no'}">${userDone?'✓ 사용자 완료':'✗ 미완료'}</span>
            ${extBadges}
          </div>
        </div>
      </div>`;
  }
  listEl.innerHTML = html;
  _updateLstActionBar();
}

function _lstToggle(userId, alreadyByMe) {
  if (alreadyByMe) return;
  if (_lstSelectedUsers.has(userId)) _lstSelectedUsers.delete(userId);
  else _lstSelectedUsers.add(userId);
  const item = document.querySelector(`.lst-item[data-uid="${userId}"]`);
  const chk = document.getElementById('lstchk-' + userId);
  const sel = _lstSelectedUsers.has(userId);
  if (item) item.classList.toggle('sel', sel);
  if (chk) { chk.classList.toggle('checked', sel); chk.textContent = sel ? '✓' : ''; }
  _updateLstActionBar();
}

function _lstSelectAllPending() {
  if (!_lstFilteredUsers.length) return;
  const stageId = _lstStageId; const blockId = _lstBlockId;
  for (const u of _lstFilteredUsers) {
    const extByMe = (u.externalChecks?.[blockId] || []).some(c => c.roleId === checkerSession.roleId);
    if (!extByMe) _lstSelectedUsers.add(u._id);
  }
  _filterLst();
}

function _updateLstActionBar() {
  const bar = document.getElementById('lst-action-bar');
  if (document.getElementById('mode-list').style.display === 'none') { bar.style.display = 'none'; return; }
  const n = _lstSelectedUsers.size;
  bar.style.display = n > 0 ? '' : 'none';
  if (n === 0) return;

  const labels = checkerSession.confirmLabels || [];
  if (!_lstSelectedLabel) _lstSelectedLabel = labels[0] || checkerSession.roleName;

  const labelWrap = document.getElementById('lst-action-label-wrap');
  if (labels.length >= 2) {
    document.getElementById('lst-action-label-btns').innerHTML = labels.map((l, i) => {
      const isSel = _lstSelectedLabel === l;
      return `<button class="lst-action-label-btn${isSel?' sel':''}" onclick="_lstPickLabel(${i})">${l.replace(/</g,'&lt;')}</button>`;
    }).join('');
    labelWrap.style.display = '';
  } else {
    labelWrap.style.display = 'none';
  }

  const btn = document.getElementById('lst-action-confirm-btn');
  btn.textContent = `${n}명 외부 확인 처리`;
  btn.disabled = false;
}

function _lstPickLabel(idx) {
  const labels = checkerSession.confirmLabels || [];
  _lstSelectedLabel = labels[idx] || checkerSession.roleName;
  document.querySelectorAll('.lst-action-label-btn').forEach((b, j) => b.classList.toggle('sel', j === idx));
}

async function _bulkCheck() {
  const n = _lstSelectedUsers.size;
  if (!n) return;
  const label = _lstSelectedLabel || checkerSession.roleName;
  const btn = document.getElementById('lst-action-confirm-btn');
  btn.disabled = true; btn.textContent = '처리 중…';

  try {
    const batch = db.batch();
    for (const userId of _lstSelectedUsers) {
      const ref = db.collection(AUTH_COLLECTION).doc(userId);
      batch.update(ref, {
        [`externalChecks.${_lstBlockId}`]: firebase.firestore.FieldValue.arrayUnion({
          roleId: checkerSession.roleId,
          roleName: checkerSession.roleName,
          confirmLabel: label,
          checkerUserId: checkerSession.userId,
          checkedAt: new Date()
        })
      });

    _lstAllUsers = null; _lstSelectedUsers = new Set();
    _updateLstActionBar();

    document.getElementById('result-wrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch(e) {
    btn.disabled = false; _updateLstActionBar();
    alert('오류: ' + e.message);
  }
}

/* 블록 레이블 찾기 */
function _findBlockLabel(blockId) {
  for (const [, blocks] of Object.entries(_lstStageBlocksCache)) {
    const b = blocks.find(b => b.id === blockId);
    if (b) return (b.textContent ? b.textContent.replace(/<[^>]*>/g,'').trim().slice(0,30) : null) || blockId;
  }
  return blockId.slice(0, 12) + '…';
}

/* ── 뽑기 티켓 처리 ── */
async function processRaffleCode(raw) {
  const segs = raw.split(':');
  if (segs.length < 4) { showResult('err', '❌', '인식 실패', '올바른 뽑기 QR이 아닙니다.'); return; }
  const [, raffleId, qrProjectId, userId] = segs;
  const userRef = db.collection('cms_users_' + qrProjectId).doc(userId);
  const entryRef = db.collection('cms_raffle_records').doc(raffleId).collection('entries').doc(userId);
  try {
    const [userDoc, entryDoc] = await Promise.all([userRef.get(), entryRef.get()]);
    if (!entryDoc.exists) { showResult('err', '❌', '당첨 기록 없음', '이 사용자의 뽑기 당첨 기록이 없어요.'); return; }
    const entry = entryDoc.data();
    const userData = userDoc.exists ? userDoc.data() : {};
    const nf = authFields && authFields[0];
    const displayName = nf ? (userData[nf.key] || userId) : userId;
    const itemName = entry.itemName || '?';
    if (entry.used) {
      showResult('warn', '⚠️', '이미 사용됨', `${displayName} 님의 「${itemName}」 티켓은 이미 사용됐어요.`);
      return;
    }
    if (confirm(`${displayName} 님의 「${itemName}」 티켓을 사용 처리하시겠어요?`)) {
      await entryRef.update({ used: true, usedAt: firebase.firestore.FieldValue.serverTimestamp(), usedByRole: checkerSession.roleName || '' });
      await userRef.update({ [`raffleResults.${raffleId}.used`]: true });
      showResult('ok', '✅', '티켓 사용 완료!', `${displayName} 님의 「${itemName}」 티켓을 사용 처리했어요.`);
    } else {
      showResult('ok', '🎟️', '미사용 티켓', `${displayName} 님은 「${itemName}」에 당첨됐고 아직 사용하지 않았어요.`);
    }
  } catch(e) { showResult('err', '❌', '오류 발생', e.message); }
}

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent = sub;
  wrap.style.display = 'block';

}

function addHistory(userName, blockId) {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  checkHistory.unshift({ userName, blockId, timeStr });
  const wrap = document.getElementById('history-wrap');

      <div class="hi-info"><div class="hi-name">${h.userName}</div><div class="hi-block">블록: ${h.blockId.slice(0,8)}…</div></div>
      <div class="hi-time">${h.timeStr}</div>
    </div>`).join('');
}

function _sessionKey() { return 'lmp-checker-' + PROJECT_ID; }
function _saveSession(s) { try { sessionStorage.setItem(_sessionKey(), JSON.stringify(s)); } catch(_) {} }
function _getSavedSession() { try { return JSON.parse(sessionStorage.getItem(_sessionKey()) || 'null'); } catch(_) { return null; } }
function _clearSession() { try { sessionStorage.removeItem(_sessionKey()); } catch(_) {} }

init();
</script>
