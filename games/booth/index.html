<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>내 부스 꾸미기</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;}

/* ── 상단 툴바 ── */
#toolbar{width:100%;max-width:480px;background:#111;display:flex;align-items:center;gap:6px;padding:8px 10px;z-index:100;flex-shrink:0;overflow-x:auto;}
#toolbar::-webkit-scrollbar{display:none;}
.tool-btn{flex-shrink:0;padding:6px 12px;background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s;}
.tool-btn.active,.tool-btn:hover{background:rgba(255,255,255,.3);}
.tool-sep{flex-shrink:0;width:1px;height:20px;background:rgba(255,255,255,.2);}

/* ── 캔버스 영역 ── */
#canvas-wrap{position:relative;width:100%;max-width:480px;flex:1;overflow:hidden;background:#000;touch-action:none;}
#bg-canvas,#draw-canvas,#items-layer{position:absolute;top:0;left:0;width:100%;height:100%;}
#bg-canvas{z-index:1;}
#items-layer{z-index:2;pointer-events:none;}
#draw-canvas{z-index:3;}
#items-layer.interactive{pointer-events:auto;}

/* ── 데코 아이템 ── */
.deco-item{position:absolute;cursor:move;user-select:none;touch-action:none;}
.deco-item.selected .item-handles{display:block;}
.deco-item.selected{outline:2px dashed rgba(255,255,255,.8);}
.item-handles{display:none;position:absolute;inset:-10px;}
.handle{position:absolute;width:18px;height:18px;background:#fff;border:2px solid #333;border-radius:50%;cursor:pointer;}
.handle.tl{top:0;left:0;transform:translate(-50%,-50%);}
.handle.tr{top:0;right:0;transform:translate(50%,-50%);}
.handle.bl{bottom:0;left:0;transform:translate(-50%,50%);}
.handle.br{bottom:0;right:0;transform:translate(50%,50%);cursor:se-resize;}
.handle.rot{top:-28px;left:50%;transform:translateX(-50%);cursor:grab;background:#4af;}
.item-del{position:absolute;top:-10px;right:-10px;width:22px;height:22px;background:#f44;border-radius:50%;border:none;color:#fff;font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;z-index:10;}
.deco-item.selected .item-del{display:flex;}
.deco-item canvas,.deco-item img{display:block;width:100%;height:100%;}

/* 프레임 클립 */
.frame-circle{border-radius:50%;overflow:hidden;}
.frame-square{border-radius:0;overflow:hidden;}
.frame-round{border-radius:16px;overflow:hidden;}
.frame-triangle .frame-inner{clip-path:polygon(50% 0%,100% 100%,0% 100%);overflow:hidden;width:100%;height:100%;}
.frame-heart .frame-inner{clip-path:path('M50,85 C50,85 5,55 5,28 C5,14 14,5 28,5 C36,5 44,10 50,18 C56,10 64,5 72,5 C86,5 95,14 95,28 C95,55 50,85 50,85 Z');overflow:hidden;width:100%;height:100%;}
.frame-star .frame-inner{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);overflow:hidden;width:100%;height:100%;}
.frame-squirt .frame-inner{clip-path:polygon(25% 0%,75% 0%,100% 25%,100% 75%,75% 100%,25% 100%,0% 75%,0% 25%);overflow:hidden;width:100%;height:100%;}

/* ── 하단 패널 ── */
#bottom-panel{width:100%;max-width:480px;background:#111;padding:8px 10px;z-index:100;flex-shrink:0;}

/* 선택 없을 때 */
#panel-default{display:flex;gap:6px;justify-content:center;}
/* 이미지 선택됐을 때 */
#panel-image{display:none;flex-direction:column;gap:8px;}
/* 드로잉 모드 */
#panel-draw{display:none;flex-direction:column;gap:8px;}

.panel-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.panel-label{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;}
.panel-btn{padding:5px 10px;background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:16px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.panel-btn.active,.panel-btn:hover{background:rgba(255,255,255,.3);}
.frame-btn{width:34px;height:34px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;border-radius:4px;}
.frame-btn.active,.frame-btn:hover{border-color:#fff;}

/* 색상 피커 영역 */
.color-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.color-swatch{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;flex-shrink:0;}
.color-swatch.active{border-color:#fff;transform:scale(1.2);}
#draw-color-input{width:32px;height:32px;border:none;border-radius:50%;cursor:pointer;background:none;padding:0;}
#draw-size-range{flex:1;min-width:80px;accent-color:#fff;}

/* 슬라이더 */
input[type=range]{accent-color:#fff;height:4px;}

/* ── 배경 선택 모달 ── */
#bg-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center;}
#bg-modal.on{display:flex;}
#bg-modal-inner{background:#222;border-radius:12px;padding:16px;max-width:400px;width:90%;max-height:80vh;display:flex;flex-direction:column;gap:12px;}
#bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow-y:auto;}
.bg-thumb{aspect-ratio:4/3;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;}
.bg-thumb:hover,.bg-thumb.active{border-color:#fff;}
.bg-thumb img{width:100%;height:100%;object-fit:cover;}
.bg-thumb .bg-label{font-size:10px;color:#fff;text-align:center;padding:4px;background:rgba(0,0,0,.5);}

/* ── 완성 모달 ── */
#export-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px;}
#export-modal.on{display:flex;}
#export-canvas{max-width:360px;max-height:60vh;border-radius:8px;}
.export-btns{display:flex;gap:10px;}
.exp-btn{padding:10px 20px;border:none;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}

/* ── 로딩 ── */
#loading{position:fixed;inset:0;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:999;}
#loading p{color:#fff;font-size:14px;}

/* ── 배경 없을 때 안내 ── */
#no-bg-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:rgba(255,255,255,.4);font-size:13px;z-index:0;pointer-events:none;}
</style>
</head>
<body>

<div id="loading"><p>불러오는 중…</p></div>

<!-- 상단 툴바 -->
<div id="toolbar">
  <button class="tool-btn" id="btn-bg" onclick="openBgModal()">🏕 배경</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="btn-img" onclick="triggerImageUpload()">🖼 이미지 추가</button>
  <button class="tool-btn" id="btn-draw" onclick="toggleDrawMode()">✏️ 그리기</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="btn-export" onclick="openExport()" style="background:rgba(255,200,0,.2);color:#ffd700;">💾 완성</button>
  <input type="file" id="img-file-input" accept="image/*" style="display:none;" onchange="onImageFileSelected(event)">
</div>

<!-- 캔버스 영역 -->
<div id="canvas-wrap">
  <div id="no-bg-msg">
    <span style="font-size:32px;">🏕</span>
    <span>배경을 선택해 주세요</span>
  </div>
  <canvas id="bg-canvas"></canvas>
  <div id="items-layer"></div>
  <canvas id="draw-canvas"></canvas>
</div>

<!-- 하단 패널 -->
<div id="bottom-panel">
  <!-- 기본 상태 -->
  <div id="panel-default">
    <span style="font-size:12px;color:rgba(255,255,255,.3);">아이템을 탭하면 편집할 수 있어요</span>
  </div>
  <!-- 이미지/드로잉 선택 상태 -->
  <div id="panel-image">
    <div class="panel-row">
      <span class="panel-label">크기</span>
      <input type="range" id="img-size-range" min="20" max="400" value="120" style="flex:1;" oninput="onItemSizeChange(this.value)">
    </div>
    <div class="panel-row">
      <span class="panel-label">프레임</span>
      <button class="frame-btn active" data-frame="" onclick="setFrame(this,'')">□</button>
      <button class="frame-btn" data-frame="frame-circle" onclick="setFrame(this,'frame-circle')">○</button>
      <button class="frame-btn" data-frame="frame-round" onclick="setFrame(this,'frame-round')">▢</button>
      <button class="frame-btn" data-frame="frame-triangle" onclick="setFrame(this,'frame-triangle')">△</button>
      <button class="frame-btn" data-frame="frame-heart" onclick="setFrame(this,'frame-heart')">♥</button>
      <button class="frame-btn" data-frame="frame-star" onclick="setFrame(this,'frame-star')">★</button>
      <button class="frame-btn" data-frame="frame-squirt" onclick="setFrame(this,'frame-squirt')">⬡</button>
    </div>
    <div class="panel-row" style="justify-content:flex-end;">
      <button class="panel-btn" onclick="deleteSelectedItem()" style="background:rgba(244,68,58,.3);color:#f44;">삭제</button>
      <button class="panel-btn" onclick="deselectAll()">완료</button>
    </div>
  </div>
  <!-- 그리기 모드 -->
  <div id="panel-draw">
    <div class="panel-row">
      <span class="panel-label">굵기</span>
      <input type="range" id="draw-size-range" min="2" max="40" value="8" style="flex:1;">
      <span id="draw-size-val" style="color:#fff;font-size:11px;min-width:20px;">8</span>
    </div>
    <div class="panel-row">
      <span class="panel-label">색상</span>
      <div class="color-row" id="draw-color-row">
        <input type="color" id="draw-color-input" value="#ffffff" title="색상 직접 선택">
        <!-- 키컬러 스와치는 JS에서 동적 추가 -->
      </div>
    </div>
    <div class="panel-row" style="justify-content:flex-end;">
      <button class="panel-btn" onclick="undoLastStroke()">↩ 되돌리기</button>
      <button class="panel-btn" onclick="finishDrawing()" style="background:rgba(100,200,100,.3);color:#9f9;">완성 → 이미지로</button>
      <button class="panel-btn" onclick="cancelDrawMode()">취소</button>
    </div>
  </div>
</div>

<!-- 배경 선택 모달 -->
<div id="bg-modal">
  <div id="bg-modal-inner">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="color:#fff;font-size:14px;font-weight:700;">배경 선택</span>
      <button onclick="closeBgModal()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;">✕</button>
    </div>
    <div id="bg-grid"><p style="color:rgba(255,255,255,.4);font-size:12px;">배경 불러오는 중…</p></div>
  </div>
</div>

<!-- 완성/내보내기 모달 -->
<div id="export-modal">
  <canvas id="export-canvas"></canvas>
  <div class="export-btns">
    <button class="exp-btn" onclick="downloadExport()" style="background:#ffd700;color:#000;">⬇ 다운로드</button>
    <button class="exp-btn" onclick="shareExport()" style="background:rgba(255,255,255,.15);color:#fff;">공유</button>
    <button class="exp-btn" onclick="closeExport()" style="background:rgba(255,255,255,.1);color:#fff;">닫기</button>
  </div>
</div>

<script>
// ── Firebase 초기화 ──
const FB_CFG = {
  apiKey:"AIzaSyC8uy09XOeEYIs1m3Rga5BMqd7gS7o3roI",
  authDomain:"beyhome-admin.firebaseapp.com",
  projectId:"beyhome-admin",
  storageBucket:"beyhome-admin.firebasestorage.app",
  messagingSenderId:"849320781553",
  appId:"1:849320781553:web:9d844044e85995c0aa2b50"
};
firebase.initializeApp(FB_CFG);
const db = firebase.firestore();

// ── 앱 상태 ──
let canvasW = 0, canvasH = 0;
let bgImage = null;
let backgrounds = []; // [{type, label, url}]
let items = [];       // 데코 아이템 목록
let selectedItem = null;
let drawMode = false;
let drawColor = '#ffffff';
let drawSize = 8;
let strokeHistory = []; // 각 스트로크 = ImageData snapshot
let keyColors = [];    // 프로젝트 키컬러 (postMessage로 수신)
let userBoothType = ''; // 부스 종류 (postMessage로 수신)
let isDrawing = false;
let lastX = 0, lastY = 0;

const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const drawCanvas = document.getElementById('draw-canvas');
const drawCtx = drawCanvas.getContext('2d');
const itemsLayer = document.getElementById('items-layer');
const canvasWrap = document.getElementById('canvas-wrap');

// ── 초기화 ──
async function init() {
  resizeCanvases();
  await loadBackgrounds();
  setupDrawEvents();
  document.getElementById('draw-size-range').addEventListener('input', e => {
    drawSize = +e.target.value;
    document.getElementById('draw-size-val').textContent = drawSize;
  });
  document.getElementById('draw-color-input').addEventListener('input', e => {
    setDrawColor(e.target.value);
  });
  document.getElementById('loading').style.display = 'none';
  window.addEventListener('resize', resizeCanvases);
}

function resizeCanvases() {
  const wrap = canvasWrap.getBoundingClientRect();
  canvasW = Math.round(wrap.width);
  canvasH = Math.round(wrap.height);
  [bgCanvas, drawCanvas].forEach(c => { c.width = canvasW; c.height = canvasH; });
  if(bgImage) drawBg();
}

// ── 배경 로드 (Firestore) ──
async function loadBackgrounds() {
  try {
    const doc = await db.collection('game_configs').doc('booth').get();
    if(doc.exists) {
      backgrounds = doc.data().backgrounds || [];
      if(userBoothType) autoSelectBg();
    }
  } catch(e) {}
}

function renderBgGrid() {
  const grid = document.getElementById('bg-grid');
  if(!backgrounds.length) {
    grid.innerHTML = '<p style="color:rgba(255,255,255,.4);font-size:12px;grid-column:1/-1;">등록된 배경이 없어요. 관리자가 배경을 추가해 주세요.</p>';
    return;
  }
  grid.innerHTML = backgrounds.map((b,i)=>`
    <div class="bg-thumb ${bgImage && backgrounds.indexOf(b)===backgrounds.findIndex(x=>x.url===bgImage._src)?'active':''}" onclick="selectBg(${i})">
      <img src="${b.url}" loading="lazy">
      <div class="bg-label">${b.label||b.type||'배경'+(i+1)}</div>
    </div>`).join('');
}

function autoSelectBg() {
  const match = backgrounds.findIndex(b => b.type === userBoothType);
  if(match >= 0) selectBg(match, true);
}

function selectBg(i, silent=false) {
  const b = backgrounds[i];
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    bgImage = img;
    bgImage._src = b.url;
    document.getElementById('no-bg-msg').style.display = 'none';
    drawBg();
    if(!silent) closeBgModal();
  };
  img.src = b.url;
}

function drawBg() {
  if(!bgImage) return;
  bgCtx.clearRect(0,0,canvasW,canvasH);
  // cover 방식
  const iw = bgImage.naturalWidth, ih = bgImage.naturalHeight;
  const scale = Math.max(canvasW/iw, canvasH/ih);
  const dw = iw*scale, dh = ih*scale;
  const dx = (canvasW-dw)/2, dy = (canvasH-dh)/2;
  bgCtx.drawImage(bgImage, dx, dy, dw, dh);
}

function openBgModal() { renderBgGrid(); document.getElementById('bg-modal').classList.add('on'); }
function closeBgModal() { document.getElementById('bg-modal').classList.remove('on'); }

// ── 이미지 추가 ──
function triggerImageUpload() {
  if(drawMode) cancelDrawMode();
  document.getElementById('img-file-input').click();
}

function onImageFileSelected(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => addImageItem(img, ev.target.result);
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function addImageItem(imgEl, src) {
  const size = Math.min(canvasW * 0.4, 150);
  const x = canvasW/2 - size/2;
  const y = canvasH/2 - size/2;
  const item = { id: Date.now(), type:'image', src, x, y, w: size, h: size, rot:0, frame:'' };
  items.push(item);
  renderItems();
  selectItemById(item.id);
}

// ── 아이템 렌더링 ──
function renderItems() {
  itemsLayer.innerHTML = '';
  itemsLayer.classList.add('interactive');
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'deco-item' + (selectedItem?.id===item.id?' selected':'');
    el.dataset.id = item.id;
    el.style.cssText = `left:${item.x}px;top:${item.y}px;width:${item.w}px;height:${item.h}px;transform:rotate(${item.rot||0}deg);`;

    // 프레임 설정
    const frameClass = item.frame || '';
    const needsInner = ['frame-triangle','frame-heart','frame-star','frame-squirt'].includes(frameClass);
    if(needsInner) {
      el.innerHTML = `<div class="frame-inner" style="width:100%;height:100%;"><img src="${item.src}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>`;
      el.classList.add(frameClass);
    } else {
      el.innerHTML = `<img src="${item.src}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
      if(frameClass) el.classList.add(frameClass);
    }

    // 핸들
    el.innerHTML += `
      <div class="item-handles">
        <div class="handle rot" data-action="rot"></div>
        <div class="handle br" data-action="resize"></div>
      </div>
      <button class="item-del" onclick="deleteItemById(${item.id})">✕</button>`;

    setupItemEvents(el, item);
    itemsLayer.appendChild(el);
  });
}

function setupItemEvents(el, item) {
  // 탭으로 선택
  el.addEventListener('pointerdown', e => {
    if(e.target.dataset.action) return;
    if(e.target.classList.contains('item-del')) return;
    e.stopPropagation();
    selectItemById(item.id);
    startDragItem(e, item);
  });
  // 회전 핸들
  const rotHandle = el.querySelector('[data-action="rot"]');
  if(rotHandle) rotHandle.addEventListener('pointerdown', e => { e.stopPropagation(); startRotItem(e, item, el); });
  // 리사이즈 핸들
  const resHandle = el.querySelector('[data-action="resize"]');
  if(resHandle) resHandle.addEventListener('pointerdown', e => { e.stopPropagation(); startResizeItem(e, item); });
}

// ── 드래그 이동 ──
function startDragItem(e, item) {
  const startX = e.clientX - item.x;
  const startY = e.clientY - item.y;
  const rect = canvasWrap.getBoundingClientRect();
  function onMove(ev) {
    const cx = (ev.clientX || ev.touches?.[0]?.clientX) - rect.left;
    const cy = (ev.clientY || ev.touches?.[0]?.clientY) - rect.top;
    item.x = (ev.clientX - startX);
    item.y = (ev.clientY - startY);
    const el = itemsLayer.querySelector(`[data-id="${item.id}"]`);
    if(el) { el.style.left = item.x+'px'; el.style.top = item.y+'px'; }
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

// ── 회전 ──
function startRotItem(e, item, el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  function onMove(ev) {
    const dx = ev.clientX - cx, dy = ev.clientY - cy;
    item.rot = Math.atan2(dy,dx) * 180/Math.PI + 90;
    el.style.transform = `rotate(${item.rot}deg)`;
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

// ── 리사이즈 ──
function startResizeItem(e, item) {
  const startDist = Math.hypot(e.clientX - (item.x + item.w/2), e.clientY - (item.y + item.h/2));
  const startW = item.w, startH = item.h;
  function onMove(ev) {
    const dist = Math.hypot(ev.clientX - (item.x + item.w/2), ev.clientY - (item.y + item.h/2));
    const scale = dist / startDist;
    item.w = Math.max(30, startW * scale);
    item.h = Math.max(30, startH * scale);
    const el = itemsLayer.querySelector(`[data-id="${item.id}"]`);
    if(el) { el.style.width = item.w+'px'; el.style.height = item.h+'px'; }
    const rangeEl = document.getElementById('img-size-range');
    if(rangeEl) rangeEl.value = item.w;
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

// ── 선택 ──
function selectItemById(id) {
  selectedItem = items.find(i=>i.id===id)||null;
  renderItems();
  updatePanelForSelection();
}

function deselectAll() {
  selectedItem = null;
  renderItems();
  updatePanelForSelection();
}

function deleteSelectedItem() {
  if(!selectedItem) return;
  deleteItemById(selectedItem.id);
}
function deleteItemById(id) {
  items = items.filter(i=>i.id!==id);
  if(selectedItem?.id===id) selectedItem=null;
  renderItems();
  updatePanelForSelection();
}

// 캔버스 빈 곳 탭 → 선택 해제
canvasWrap.addEventListener('pointerdown', e => {
  if(e.target === canvasWrap || e.target === itemsLayer) deselectAll();
});

function updatePanelForSelection() {
  const pDefault = document.getElementById('panel-default');
  const pImage = document.getElementById('panel-image');
  const pDraw = document.getElementById('panel-draw');
  if(drawMode) {
    pDefault.style.display='none'; pImage.style.display='none'; pDraw.style.display='flex';
  } else if(selectedItem) {
    pDefault.style.display='none'; pImage.style.display='flex'; pDraw.style.display='none';
    document.getElementById('img-size-range').value = selectedItem.w;
    // 현재 프레임 버튼 active 표시
    document.querySelectorAll('.frame-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.frame===(selectedItem.frame||''));
    });
  } else {
    pDefault.style.display='flex'; pImage.style.display='none'; pDraw.style.display='none';
  }
}

function onItemSizeChange(val) {
  if(!selectedItem) return;
  const ratio = selectedItem.h / selectedItem.w;
  selectedItem.w = +val;
  selectedItem.h = +val * ratio;
  const el = itemsLayer.querySelector(`[data-id="${selectedItem.id}"]`);
  if(el) { el.style.width = selectedItem.w+'px'; el.style.height = selectedItem.h+'px'; }
}

function setFrame(btn, frame) {
  if(!selectedItem) return;
  selectedItem.frame = frame;
  document.querySelectorAll('.frame-btn').forEach(b=>b.classList.toggle('active', b===btn));
  renderItems();
  // 선택 유지
  const el = itemsLayer.querySelector(`[data-id="${selectedItem.id}"]`);
  if(el) el.classList.add('selected');
}

// ── 드로잉 ──
function toggleDrawMode() {
  drawMode ? cancelDrawMode() : enterDrawMode();
}

function enterDrawMode() {
  drawMode = true;
  deselectAll();
  document.getElementById('btn-draw').classList.add('active');
  drawCanvas.style.cursor = 'crosshair';
  drawCanvas.style.pointerEvents = 'auto';
  itemsLayer.classList.remove('interactive');
  // 드로잉 캔버스 초기화
  drawCtx.clearRect(0,0,canvasW,canvasH);
  strokeHistory = [];
  updatePanelForSelection();
}

function cancelDrawMode() {
  drawMode = false;
  drawCtx.clearRect(0,0,canvasW,canvasH);
  document.getElementById('btn-draw').classList.remove('active');
  drawCanvas.style.pointerEvents = 'none';
  drawCanvas.style.cursor = 'default';
  itemsLayer.classList.add('interactive');
  updatePanelForSelection();
}

function finishDrawing() {
  // 드로잉 캔버스를 이미지로 변환해서 아이템으로 추가
  const url = drawCanvas.toDataURL('image/png');
  // 빈 캔버스인지 체크
  const tempCtx = document.createElement('canvas').getContext('2d');
  const blank = document.createElement('canvas');
  blank.width = drawCanvas.width; blank.height = drawCanvas.height;
  if(drawCanvas.toDataURL() === blank.toDataURL()) { cancelDrawMode(); return; }

  const img = new Image();
  img.onload = () => {
    const item = { id: Date.now(), type:'drawing', src: url, x:0, y:0, w:canvasW, h:canvasH, rot:0, frame:'' };
    items.push(item);
    cancelDrawMode();
    renderItems();
    selectItemById(item.id);
  };
  img.src = url;
}

function setupDrawEvents() {
  drawCanvas.style.pointerEvents = 'none';
  function getPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [(t.clientX - rect.left) * (canvasW / rect.width),
            (t.clientY - rect.top)  * (canvasH / rect.height)];
  }
  function startStroke(e) {
    if(!drawMode) return;
    e.preventDefault();
    isDrawing = true;
    [lastX, lastY] = getPos(e);
    // 스트로크 시작 전 스냅샷 저장
    strokeHistory.push(drawCtx.getImageData(0,0,canvasW,canvasH));
    drawCtx.beginPath();
    drawCtx.arc(lastX, lastY, drawSize/2, 0, Math.PI*2);
    drawCtx.fillStyle = drawColor;
    drawCtx.fill();
  }
  function drawStroke(e) {
    if(!drawMode || !isDrawing) return;
    e.preventDefault();
    const [x,y] = getPos(e);
    drawCtx.beginPath();
    drawCtx.moveTo(lastX, lastY);
    drawCtx.lineTo(x, y);
    drawCtx.strokeStyle = drawColor;
    drawCtx.lineWidth = drawSize;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    drawCtx.stroke();
    [lastX, lastY] = [x,y];
  }
  function endStroke() { isDrawing = false; }
  drawCanvas.addEventListener('pointerdown', startStroke);
  drawCanvas.addEventListener('pointermove', drawStroke);
  drawCanvas.addEventListener('pointerup', endStroke);
  drawCanvas.addEventListener('touchstart', startStroke, {passive:false});
  drawCanvas.addEventListener('touchmove', drawStroke, {passive:false});
  drawCanvas.addEventListener('touchend', endStroke);
}

function undoLastStroke() {
  if(!strokeHistory.length) return;
  drawCtx.putImageData(strokeHistory.pop(), 0, 0);
}

function setDrawColor(c) {
  drawColor = c;
  document.getElementById('draw-color-input').value = c;
  document.querySelectorAll('#draw-color-row .color-swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.color === c);
  });
}

function renderKeyColorSwatches() {
  const row = document.getElementById('draw-color-row');
  // 기존 스와치 제거
  row.querySelectorAll('.color-swatch').forEach(s=>s.remove());
  keyColors.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.dataset.color = c;
    sw.style.background = c;
    sw.title = c;
    sw.addEventListener('click', () => setDrawColor(c));
    row.appendChild(sw);
  });
}

// ── 내보내기 ──
async function openExport() {
  const expCanvas = document.getElementById('export-canvas');
  expCanvas.width = canvasW;
  expCanvas.height = canvasH;
  const ctx = expCanvas.getContext('2d');

  // 1. 배경
  if(bgImage) {
    const iw = bgImage.naturalWidth, ih = bgImage.naturalHeight;
    const scale = Math.max(canvasW/iw, canvasH/ih);
    const dw = iw*scale, dh = ih*scale;
    ctx.drawImage(bgImage, (canvasW-dw)/2, (canvasH-dh)/2, dw, dh);
  }

  // 2. 아이템들 (순서대로)
  for(const item of items) {
    await drawItemOnCanvas(ctx, item);
  }

  document.getElementById('export-modal').classList.add('on');
}

async function drawItemOnCanvas(ctx, item) {
  const img = await loadImageCORS(item.src);
  if(!img) return;
  ctx.save();
  ctx.translate(item.x + item.w/2, item.y + item.h/2);
  ctx.rotate((item.rot||0) * Math.PI/180);

  // 프레임 클립
  applyFrameClip(ctx, item.frame, item.w, item.h);

  ctx.drawImage(img, -item.w/2, -item.h/2, item.w, item.h);
  ctx.restore();
}

function applyFrameClip(ctx, frame, w, h) {
  if(!frame) return;
  ctx.beginPath();
  const hw=w/2, hh=h/2;
  if(frame==='frame-circle') {
    ctx.ellipse(0,0,hw,hh,0,0,Math.PI*2);
  } else if(frame==='frame-round') {
    const r=Math.min(hw,hh)*0.2;
    ctx.roundRect(-hw,-hh,w,h,r);
  } else if(frame==='frame-triangle') {
    ctx.moveTo(0,-hh); ctx.lineTo(hw,hh); ctx.lineTo(-hw,hh); ctx.closePath();
  } else if(frame==='frame-heart') {
    // 하트 근사
    const s=hw/50;
    ctx.moveTo(0,hh*0.85);
    ctx.bezierCurveTo(-hw,-hh*0.2,-hw,-hh*0.9,0,-hh*0.3);
    ctx.bezierCurveTo(hw,-hh*0.9,hw,-hh*0.2,0,hh*0.85);
  } else if(frame==='frame-star') {
    for(let i=0;i<10;i++){
      const r2=i%2===0?Math.max(hw,hh):Math.max(hw,hh)*0.45;
      const a=i*Math.PI/5-Math.PI/2;
      i===0?ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2):ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    }
    ctx.closePath();
  } else if(frame==='frame-squirt') {
    const pts=8, r2=Math.max(hw,hh);
    for(let i=0;i<pts;i++){
      const a=i*(Math.PI*2/pts)-Math.PI/2;
      i===0?ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2):ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    }
    ctx.closePath();
  }
  ctx.clip();
}

function loadImageCORS(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => {
      // crossOrigin 실패 시 재시도 (data URL은 필요 없음)
      if(src.startsWith('data:')) { resolve(null); return; }
      const img2 = new Image();
      img2.onload = () => resolve(img2);
      img2.onerror = () => resolve(null);
      img2.src = src;
    };
    img.src = src;
  });
}

function downloadExport() {
  const canvas = document.getElementById('export-canvas');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = '내부스꾸미기.png';
  a.click();
}

async function shareExport() {
  const canvas = document.getElementById('export-canvas');
  canvas.toBlob(async blob => {
    if(navigator.share && navigator.canShare({files:[new File([blob],'booth.png',{type:'image/png'})]})) {
      await navigator.share({files:[new File([blob],'booth.png',{type:'image/png'})], title:'내 부스 꾸미기'});
    } else {
      downloadExport();
    }
  });
}

function closeExport() { document.getElementById('export-modal').classList.remove('on'); }

// ── postMessage: 부모 플레이어에서 사용자 데이터 수신 ──
window.addEventListener('message', e => {
  if(e.data?.type !== 'lmp-context') return;
  const d = e.data;
  if(d.keyColors?.length) { keyColors = d.keyColors; renderKeyColorSwatches(); }
  if(d.boothType) { userBoothType = d.boothType; if(backgrounds.length) autoSelectBg(); }
});

// ── 시작 ──
init();
</script>
